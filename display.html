<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;700;800&family=Bebas+Neue&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.6);
            --bg-dark: #050810;
            --surface: rgba(15, 23, 42, 0.65);
            --surface-border: rgba(255, 255, 255, 0.08);
            --gold: #FBBF24; --gold-glow: rgba(251, 191, 36, 0.4);
            --silver: #94A3B8; --bronze: #D97706;
            --slide-duration: 12s; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; text-transform: uppercase; }
        
        body { background: var(--bg-dark); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 1s ease; }

        .ambient-bg { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
        .grid-overlay {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.45; animation: float 25s infinite alternate ease-in-out; transition: background 1s ease;}
        .orb-1 { background: var(--primary); width: 65vw; height: 65vw; top: -20%; left: -10%; }
        .orb-2 { background: rgba(236, 72, 153, 0.4); width: 55vw; height: 55vw; bottom: -15%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5%, 10%) scale(1.15); } }

        .header { padding: 1.5rem 3rem; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(5, 8, 16, 0.95), transparent); z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 1.5rem; }
        
        /* Titles are injected dynamically via JS based on branding settings */
        
        .header-right { display: flex; align-items: center; gap: 2rem; }
        .clock { font-family: 'Inter', sans-serif; font-size: 1.5rem; font-weight: 800; color: rgba(255,255,255,0.9); letter-spacing: 2px; }
        .live-badge { background: rgba(225, 29, 72, 0.15); color: #FDA4AF; padding: 0.5rem 1.25rem; border-radius: 50px; border: 1px solid rgba(225, 29, 72, 0.4); font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 0 20px rgba(225, 29, 72, 0.2); }
        .live-dot { width: 12px; height: 12px; background: #FDA4AF; border-radius: 50%; animation: pulse 1.5s infinite; box-shadow: 0 0 10px #FDA4AF; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }

        .slide-container { flex: 1; position: relative; padding: 1.5rem 3rem 4rem 3rem; display: flex; flex-direction: column; overflow: hidden; }
        .slide { position: absolute; inset: 0; padding: 1.5rem 3rem; opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease; display: flex; flex-direction: column; pointer-events: none; transform: scale(0.98); }
        .slide.active { opacity: 1; pointer-events: all; transform: scale(1); }
        .slide-title { font-size: 3.2rem; color: var(--primary); margin-bottom: 1.5rem; text-shadow: 0 10px 30px rgba(0,0,0,0.8); letter-spacing: -1px; text-align: center; flex-shrink: 0; z-index: 10; position: relative; }

        .leaderboard { display: flex; flex-direction: column; gap: 1rem; max-width: 1300px; margin: 0 auto; width: 100%; }
        .lb-row { background: var(--surface); border: 1px solid var(--surface-border); padding: 1rem 2.5rem; border-radius: 16px; display: flex; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); opacity: 0; transform: translateX(-30px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide.active .lb-row { opacity: 1; transform: translateX(0); }
        .slide.active .lb-row:nth-child(1) { transition-delay: 0.1s; }
        .slide.active .lb-row:nth-child(2) { transition-delay: 0.2s; }
        .slide.active .lb-row:nth-child(3) { transition-delay: 0.3s; }
        .slide.active .lb-row:nth-child(4) { transition-delay: 0.4s; }
        .slide.active .lb-row:nth-child(5) { transition-delay: 0.5s; }
        
        .lb-row.gold { border-left: 8px solid var(--gold); background: linear-gradient(90deg, rgba(251,191,36,0.15), var(--surface)); transform: scale(1.02); box-shadow: 0 20px 40px var(--gold-glow); z-index: 10; }
        .lb-row.silver { border-left: 8px solid var(--silver); background: linear-gradient(90deg, rgba(148,163,184,0.1), var(--surface)); }
        .lb-row.bronze { border-left: 8px solid var(--bronze); background: linear-gradient(90deg, rgba(217,119,6,0.1), var(--surface)); }
        
        .lb-rank { font-size: 2.2rem; font-weight: 800; width: 80px; color: rgba(255,255,255,0.2); }
        .lb-row.gold .lb-rank { color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
        .lb-team { flex: 1; font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; }
        .lb-score { font-size: 3.2rem; font-weight: 800; color: white; display: flex; align-items: baseline; gap: 0.5rem; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .lb-score span { font-size: 1.2rem; color: rgba(255,255,255,0.5); font-weight: 700; }

        .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 1.5rem; flex: 1; min-height: 0; padding-bottom: 1.5rem; }
        .pedestal-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 30%; text-align: center; opacity: 0; transform: translateY(60px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide.active .pedestal-wrapper { opacity: 1; transform: translateY(0); }
        .slide.active .pedestal-wrapper.p2 { transition-delay: 0.2s; }
        .slide.active .pedestal-wrapper.p1 { transition-delay: 0.5s; z-index: 5; }
        .slide.active .pedestal-wrapper.p3 { transition-delay: 0.8s; }

        .pedestal-card { background: var(--surface); border: 1px solid var(--surface-border); backdrop-filter: blur(20px); padding: 1.25rem; border-radius: 20px; width: 100%; margin-bottom: 1rem; box-shadow: 0 15px 35px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; min-height: 120px; }
        .p-name { font-size: 1.6rem; font-weight: 800; color: white; line-height: 1.1; margin-bottom: 0.4rem; }
        .p1 .p-name { font-size: 2rem; }
        .p-team { font-size: 1.1rem; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
        
        .pedestal { width: 100%; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 1rem; position: relative; overflow: hidden; box-shadow: inset 0 4px 15px rgba(255,255,255,0.2); }
        .pedestal::after { content:''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%); }
        .p1 .pedestal { height: 220px; background: linear-gradient(to bottom, var(--gold), #92400E); box-shadow: 0 -10px 50px var(--gold-glow), inset 0 4px 15px rgba(255,255,255,0.4); }
        .p2 .pedestal { height: 160px; background: linear-gradient(to bottom, var(--silver), #334155); }
        .p3 .pedestal { height: 110px; background: linear-gradient(to bottom, var(--bronze), #78350F); }
        .rank-num { font-size: 4.5rem; font-weight: 800; color: rgba(255,255,255,0.95); text-shadow: 0 10px 20px rgba(0,0,0,0.4); line-height: 1; z-index: 2; }

        .qr-widget { position: fixed; bottom: 4.5rem; right: 2rem; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.15); padding: 1rem; border-radius: 16px; display: flex; align-items: center; gap: 1rem; backdrop-filter: blur(20px); z-index: 100; box-shadow: 0 15px 40px rgba(0,0,0,0.6); transition: all 0.5s ease; animation: floatQR 6s infinite ease-in-out; }
        @keyframes floatQR { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .qr-text-block { display: flex; flex-direction: column; gap: 0.2rem; max-width: 130px; }
        .qr-widget span { font-size: 0.9rem; font-weight: 800; color: white; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .qr-widget small { font-size: 0.7rem; color: var(--primary); font-weight: 700; letter-spacing: 1px; }
        #display-qr { background: white; padding: 6px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .ticker-wrap { position: fixed; bottom: 0; left: 0; width: 100%; height: 3rem; background: #0F172A; border-top: 2px solid var(--primary); z-index: 150; overflow: hidden; display: flex; align-items: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .ticker-move { display: inline-block; white-space: nowrap; padding-right: 100%; animation: ticker 40s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }
        @keyframes ticker { 0% { transform: translate3d(100vw, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .ticker-item { display: inline-flex; align-items: center; gap: 0.75rem; font-size: 1rem; font-weight: 800; color: white; margin-right: 3rem; letter-spacing: 1px; }
        .t-badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 800; }
        .t-live { background: #10B981; color: #064E3B; }
        .t-reg { background: #3B82F6; color: #1E3A8A; }
        .t-val { background: #F59E0B; color: #78350F; }

        .progress-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.05); position: fixed; top: 0; left: 0; z-index: 200; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: none; box-shadow: 0 0 15px var(--primary); }
        .progress-bar.animating { transition: width var(--slide-duration) linear; width: 100%; }

        #custom-bg { position:absolute; inset:0; background-size: cover; background-position: center; z-index:-1; opacity:0; filter: blur(8px) brightness(0.5); transition: opacity 1s ease; }
    </style>
</head>
<body>
    <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div class="grid-overlay"></div>

    <div class="progress-bar-container"><div class="progress-bar" id="progress"></div></div>

    <div class="header">
        <div class="header-left" id="branding-header-left">
            <!-- Populated via Javascript to enforce strict hiding rules -->
        </div>
        <div class="header-right">
            <div class="clock" id="live-clock">00:00:00</div>
            <div class="live-badge"><div class="live-dot"></div> LIVE BROADCAST</div>
        </div>
    </div>

    <div class="slide-container">
        
        <div id="slide-custom" class="slide">
            <div id="custom-bg"></div>
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 1;">
                <h2 id="custom-title" class="theme-font" style="font-size: 5.5rem; color: var(--primary); text-shadow: 0 10px 50px rgba(0,0,0,0.9); margin-bottom: 1.5rem;"></h2>
                <p id="custom-text" style="font-size: 2.2rem; font-family: 'Inter', sans-serif; font-weight: 600; max-width: 80%; line-height: 1.4; text-shadow: 0 4px 20px rgba(0,0,0,0.9); color: white;"></p>
            </div>
        </div>

        <div id="slide-podium" class="slide">
            <h2 class="slide-title theme-font">OFFICIAL RESULTS: <span id="podium-comp-name" style="color:white;"></span></h2>
            <div class="podium-container" id="podium-board"></div>
        </div>

        <div id="slide-standings" class="slide active">
            <h2 class="slide-title theme-font">CHAMPIONSHIP STANDINGS</h2>
            <div class="leaderboard" id="standings-board">
                <h3 style="color:rgba(255,255,255,0.5); text-align:center; padding: 4rem;">SYNCING METRICS...</h3>
            </div>
        </div>

        <div id="slide-schedule" class="slide">
            <h2 class="slide-title theme-font">EVENT SCHEDULE & STATUS</h2>
            <div class="leaderboard" id="schedule-board"></div>
        </div>
    </div>

    <div id="qr-widget" class="qr-widget">
        <div id="display-qr"></div>
        <div class="qr-text-block">
            <span id="qr-main-text" class="theme-font">SCAN FOR LIVE DATA</span>
            <small id="qr-sub-text">POINT YOUR CAMERA</small>
        </div>
    </div>

    <div class="ticker-wrap">
        <div class="ticker-move" id="live-ticker-track">
            <div class="ticker-item">SYNCING LIVE DATA TO FESTOS NETWORK...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let systemSettings = { thresholds: { aplus: 90, a: 70, b: 60, c: 50 }, points_solo: { aplus: 8, a: 7, b: 5, c: 3 }, points_small: { aplus: 12, a: 10, b: 7, c: 5 }, points_large: { aplus: 15, a: 12, b: 10, c: 7 }, pos_points: { p1: 3, p2: 2, p3: 1 } };
        let allTeams = [];
        let calculatedTeamScores = {};
        
        let activeSlides = ['slide-standings'];
        let currentSlide = 0;
        let lastConfettiTrigger = 0;
        let lastPublishedCount = 0;
        let currentPodiumCompId = null; 
        
        const isPreviewMode = new URLSearchParams(window.location.search).get('preview') === 'true';

        const qrInstance = new QRCode(document.getElementById('display-qr'), { 
            text: window.location.origin + '/spectator.html', 
            width: 75, height: 75, colorDark: "#0F172A", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L 
        });

        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false }); }, 1000);

        async function fetchDisplayData() {
            try {
                // Strict Branding Injection
                const { data: brandData } = await supabaseClient.from('settings').select('value').eq('id', 'system_branding').maybeSingle();
                if (brandData && brandData.value) {
                    const b = brandData.value;
                    const validName = b.fest_name && b.fest_name.trim() !== '';
                    const validLogo = b.fest_logo && b.fest_logo.trim() !== '';
                    const displayMode = b.display_mode || 'both';

                    // Document Title
                    document.title = validName ? `${b.fest_name} | Display` : 'Display';

                    // Favicon Inject
                    if (validLogo) {
                        let allIcons = document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']");
                        if (allIcons.length === 0) {
                            let newIcon = document.createElement('link'); newIcon.rel = 'icon';
                            document.head.appendChild(newIcon); allIcons = [newIcon];
                        }
                        allIcons.forEach(link => { if (link.type === 'image/svg+xml') link.removeAttribute('type'); link.href = b.fest_logo; });
                    }

                    // Strict Header Builder
                    const headerLeft = document.getElementById('branding-header-left');
                    let html = '';
                    const showLogo = validLogo && (displayMode === 'both' || displayMode === 'logo');
                    const showName = (displayMode === 'both' || displayMode === 'name') || (!validLogo && displayMode === 'logo');
                    
                    if (showLogo) {
                        html += `<img id="fest-logo" src="${b.fest_logo}" alt="Logo" style="height: 60px; max-width: 200px; object-fit: contain; border-radius: 8px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); display: block;">`;
                    }
                    if (showName && validName) {
                        html += `<h1 id="fest-title" class="theme-font" style="font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; text-shadow: 0 0 25px var(--primary-glow); margin: 0; line-height: 1;">${b.fest_name.toUpperCase()}</h1>`;
                    }
                    headerLeft.innerHTML = html;
                }

                const { data: set_data } = await supabaseClient.from('settings').select('value').eq('id', 'point_system').maybeSingle();        
                if (set_data && set_data.value) systemSettings = set_data.value;

                const { data: displayData } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                let customEnabled = false;

                if (displayData && displayData.value) {
                    const v = displayData.value;
                    document.documentElement.style.setProperty('--slide-duration', `${v.slide_duration || 12}s`);
                    document.getElementById('qr-widget').style.opacity = v.show_qr === false ? '0' : '1';
                    
                    if (v.primary_color) {
                        document.documentElement.style.setProperty('--primary', v.primary_color);
                        const hex = v.primary_color.replace('#','');
                        const r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
                        document.documentElement.style.setProperty('--primary-glow', `rgba(${r},${g},${b},0.6)`);
                    }
                    if (v.font_family) {
                        const fontString = `"${v.font_family}", sans-serif`;
                        document.body.style.fontFamily = fontString;
                        document.querySelectorAll('.theme-font, .slide-title, .lb-team, .p-name').forEach(el => el.style.fontFamily = fontString);
                    }

                    if (v.trigger_confetti > lastConfettiTrigger && !isPreviewMode) {
                        fireConfetti();
                        lastConfettiTrigger = v.trigger_confetti;
                    }

                    if (v.custom_enable) {
                        customEnabled = true;
                        document.getElementById('custom-title').innerText = v.custom_title || '';
                        document.getElementById('custom-text').innerText = v.custom_text || '';
                        if (v.custom_image) {
                            document.getElementById('custom-bg').style.backgroundImage = `url(${v.custom_image})`;
                            document.getElementById('custom-bg').style.opacity = '0.6';
                        } else {
                            document.getElementById('custom-bg').style.opacity = '0';
                        }
                    }
                }

                const { data: teams } = await supabaseClient.from('teams').select('*');
                allTeams = teams || [];
                calculatedTeamScores = {};
                allTeams.forEach(t => calculatedTeamScores[t.id] = { name: t.name, score: 0 });

                const { data: allComps } = await supabaseClient.from('competitions')
                    .select('*, categories(name), stages(name), participant_competitions(count)')
                    .order('updated_at', { ascending: false });

                const publishedComps = allComps.filter(c => c.status === 'published');
                
                if (publishedComps.length > lastPublishedCount && lastPublishedCount !== 0 && !isPreviewMode) fireConfetti();
                lastPublishedCount = publishedComps.length;

                activeSlides = [];
                if (customEnabled) activeSlides.push('slide-custom');
                if (publishedComps.length > 0) activeSlides.push('slide-podium');
                activeSlides.push('slide-standings');
                
                const activeEvents = allComps.filter(c => ['ongoing', 'registration', 'valuation', 'pending'].includes(c.status));
                if (activeEvents.length > 0) activeSlides.push('slide-schedule');

                updateLiveTicker(activeEvents, publishedComps);

                if (publishedComps.length > 0) {
                    currentPodiumCompId = publishedComps[0].id;
                    const compIds = publishedComps.map(c => c.id);
                    const { data: judgements } = await supabaseClient.from('judgements')
                        .select('competition_id, awarded_mark, participants(id, name, team_id, unique_id)')
                        .in('competition_id', compIds)
                        .not('participant_id', 'is', null).not('awarded_mark', 'is', null);

                    processScores(judgements || [], publishedComps);
                } else {
                    document.getElementById('standings-board').innerHTML = `<h3 style="color:rgba(255,255,255,0.5); text-align:center; padding: 4rem;">AWAITING OFFICIAL RESULTS...</h3>`;
                }

                renderStandings();
                renderSchedule(activeEvents);

            } catch (error) { console.error("Display Fetch Error:", error); }
        }

        function updateLiveTicker(activeEvents, publishedComps) {
            const track = document.getElementById('live-ticker-track');
            let tickerHtml = '';
            
            activeEvents.filter(c => c.status === 'ongoing').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-live">LIVE ON STAGE</span> ${c.name} (${c.stages?.name || 'GLOBAL'})</div>`; });
            activeEvents.filter(c => c.status === 'valuation').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-val">IN VALUATION</span> ${c.name}</div>`; });
            if(publishedComps.length > 0) { tickerHtml += `<div class="ticker-item"><span class="t-badge" style="background:var(--primary); color:white;">LATEST RESULT</span> ${publishedComps[0].name}</div>`; }
            activeEvents.filter(c => c.status === 'registration').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-reg">CALLING NOW</span> ${c.name}</div>`; });
            
            if(tickerHtml === '') tickerHtml = '<div class="ticker-item">WELCOME TO FESTOS LIVE • SYNCED WITH DASHBOARD</div>';
            track.innerHTML = tickerHtml + tickerHtml;
        }

        function updateDynamicQR(slideId) {
            let targetUrl = window.location.origin + '/spectator.html';
            let mainText = 'SCAN FOR LIVE DATA';
            let subText = 'MOBILE SPECTATOR APP';

            if (slideId === 'slide-podium' && currentPodiumCompId) {
                targetUrl += `?view=results&comp=${currentPodiumCompId}`;
                mainText = 'SCAN FOR RESULTS'; subText = 'DOWNLOAD THE POSTER';
            } else if (slideId === 'slide-schedule') {
                targetUrl += `?view=live`;
                mainText = 'SCAN SCHEDULE'; subText = 'SEE ALL ACTIVE EVENTS';
            } else if (slideId === 'slide-standings') {
                targetUrl += `?view=standings`;
                mainText = 'SCAN STANDINGS'; subText = 'DOWNLOAD LEADERBOARD';
            }

            document.getElementById('qr-main-text').innerText = mainText;
            document.getElementById('qr-sub-text').innerText = subText;
            
            qrInstance.clear();
            qrInstance.makeCode(targetUrl);
            
            const widget = document.getElementById('qr-widget');
            widget.style.transform = 'scale(1.05)';
            setTimeout(() => widget.style.transform = '', 300);
        }

        function processScores(judgements, publishedComps) {
            const compGroups = {};
            judgements.forEach(j => {
                if (!j.participants || !j.participants.id) return; 
                const comp = publishedComps.find(c => c.id === j.competition_id);
                if(!compGroups[j.competition_id]) compGroups[j.competition_id] = { participants: {}, comp_data: comp };
                const pId = j.participants.id;
                if(!compGroups[j.competition_id].participants[pId]) compGroups[j.competition_id].participants[pId] = { participant: j.participants, marks_array: [] };
                compGroups[j.competition_id].participants[pId].marks_array.push(parseFloat(j.awarded_mark));
            });

            let latestCompResults = [];

            for (const [compId, compData] of Object.entries(compGroups)) {
                const limit = compData.comp_data.max_participants || 1;
                const sizeCat = limit >= 4 ? 'large' : (limit >= 2 ? 'small' : 'solo');
                const registeredCount = compData.comp_data.participant_competitions?.[0]?.count || 0;
                const eligibleForPosPts = registeredCount >= 3;

                const participantsArr = Object.values(compData.participants).map(p => {
                    let sortedMarks = p.marks_array.sort((a, b) => a - b);
                    if (sortedMarks.length >= 3) sortedMarks = sortedMarks.slice(1, sortedMarks.length - 1); 
                    const sum = sortedMarks.reduce((a, b) => a + b, 0);
                    p.score = sum / sortedMarks.length;
                    if (compData.comp_data.is_group && !p.participant.name.endsWith('& PARTY')) p.participant.name += " & PARTY";
                    return p;
                }).sort((a, b) => b.score - a.score);

                let currentRank = 1;
                let previousScore = -1;
                let compPodium = [];

                participantsArr.forEach((entry, idx) => {
                    if (entry.score !== previousScore) currentRank = idx + 1; 
                    entry.position = currentRank;
                    previousScore = entry.score;

                    let percent = (entry.score / (compData.comp_data.max_mark || 100)) * 100;
                    let gradePts = 0; let posPts = 0;

                    if (percent >= 50) {
                        if (percent >= systemSettings.thresholds.aplus) gradePts = systemSettings[`points_${sizeCat}`].aplus;
                        else if (percent >= systemSettings.thresholds.a) gradePts = systemSettings[`points_${sizeCat}`].a;
                        else if (percent >= systemSettings.thresholds.b) gradePts = systemSettings[`points_${sizeCat}`].b;
                        else gradePts = systemSettings[`points_${sizeCat}`].c;
                    }
                    if (eligibleForPosPts && currentRank <= 3) {
                        if (currentRank === 1) posPts = systemSettings.pos_points.p1;
                        else if (currentRank === 2) posPts = systemSettings.pos_points.p2;
                        else if (currentRank === 3) posPts = systemSettings.pos_points.p3;
                    }

                    const teamId = entry.participant.team_id;
                    if (teamId && calculatedTeamScores[teamId]) calculatedTeamScores[teamId].score += (gradePts + posPts); 

                    if (currentRank <= 3) compPodium.push({ rank: currentRank, name: entry.participant.name, team: allTeams.find(t => t.id === teamId)?.name || 'IND' });
                });

                if (publishedComps[0] && compId === publishedComps[0].id) latestCompResults = compPodium;
            }

            renderPodium(publishedComps[0], latestCompResults);
        }

        function renderStandings() {
            const container = document.getElementById('standings-board');
            const sortedTeams = Object.values(calculatedTeamScores).sort((a, b) => b.score - a.score).slice(0, 5); 
            if (sortedTeams.length === 0) return;

            container.innerHTML = sortedTeams.map((team, index) => {
                const rank = index + 1;
                let cardClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
                return `<div class="lb-row ${cardClass}"><div class="lb-rank theme-font">#${rank}</div><div class="lb-team theme-font">${team.name}</div><div class="lb-score">${team.score} <span>PTS</span></div></div>`;
            }).join('');
        }

        function renderPodium(comp, podiumData) {
            const container = document.getElementById('podium-board');
            if (!comp || podiumData.length === 0) return;

            document.getElementById('podium-comp-name').innerText = `${comp.name} (${comp.categories?.name || 'GEN'})`;
            const getPos = (rank) => podiumData.find(p => p.rank === rank) || { name: '-', team: '-' };
            const p1 = getPos(1); const p2 = getPos(2); const p3 = getPos(3);

            container.innerHTML = `
                <div class="pedestal-wrapper p2"><div class="pedestal-card"><div class="p-name theme-font">${p2.name}</div><div class="p-team theme-font">${p2.team}</div></div><div class="pedestal"><div class="rank-num theme-font">2</div></div></div>
                <div class="pedestal-wrapper p1"><div class="pedestal-card" style="box-shadow: 0 20px 50px var(--gold-glow); border-color: rgba(251,191,36,0.5);"><div class="p-name theme-font">${p1.name}</div><div class="p-team theme-font" style="color: var(--gold);">${p1.team}</div></div><div class="pedestal"><div class="rank-num theme-font">1</div></div></div>
                <div class="pedestal-wrapper p3"><div class="pedestal-card"><div class="p-name theme-font">${p3.name}</div><div class="p-team theme-font">${p3.team}</div></div><div class="pedestal"><div class="rank-num theme-font">3</div></div></div>
            `;
        }

        function renderSchedule(activeComps) {
            const container = document.getElementById('schedule-board');
            if (activeComps.length === 0) {
                container.innerHTML = `<h3 style="color:rgba(255,255,255,0.5); text-align:center; padding: 4rem;">ALL SCHEDULED EVENTS COMPLETED</h3>`;
                return;
            }

            activeComps.sort((a,b) => {
                const getW = s => s === 'ongoing' ? 1 : (s === 'valuation' ? 2 : (s === 'registration' ? 3 : 4));
                return getW(a.status) - getW(b.status);
            });

            container.innerHTML = activeComps.slice(0, 4).map(c => {
                let bText = c.status; let col = "var(--silver)"; let bBg = "rgba(255,255,255,0.05)";
                if(c.status === 'ongoing') { bText = "LIVE NOW"; col = "#10B981"; bBg = "rgba(16,185,129,0.15)"; }
                if(c.status === 'registration') { bText = "CALLING"; col = "#3B82F6"; bBg = "rgba(59,130,246,0.15)"; }
                if(c.status === 'valuation') { bText = "IN VALUATION"; col = "#F59E0B"; bBg = "rgba(245,158,11,0.15)"; }
                if(c.status === 'pending') { bText = "UPCOMING"; col = "#94A3B8"; }

                return `
                <div class="lb-row" style="border-left: 6px solid ${col}; padding: 1rem 2rem;">
                    <div style="flex:1;">
                        <div style="font-size: 1rem; color: ${col}; font-weight: 800; margin-bottom:0.2rem; letter-spacing: 1px;">${c.categories?.name || 'GEN'} • ${c.stages?.name || 'GLOBAL STAGE'}</div>
                        <div class="theme-font" style="font-size: 2rem; font-weight: 800; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">${c.name}</div>
                    </div>
                    <div style="background: ${bBg}; padding: 0.8rem 1.5rem; border-radius: 12px; font-size: 1.2rem; font-weight: 800; color: ${col}; text-align: center; border: 1px solid ${col};">${bText}</div>
                </div>`;
            }).join('');
        }

        function fireConfetti() {
            if (isPreviewMode) return;
            const duration = 5000; const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function rotateSlides() {
            if (activeSlides.length === 0) return;
            if (currentSlide >= activeSlides.length) currentSlide = 0;

            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            const activeSlideId = activeSlides[currentSlide];
            const slideEl = document.getElementById(activeSlideId);
            if (slideEl) slideEl.classList.add('active');
            
            updateDynamicQR(activeSlideId);
            
            const progressBar = document.getElementById('progress');
            progressBar.classList.remove('animating');
            void progressBar.offsetWidth; 
            progressBar.classList.add('animating');
            
            currentSlide++;
            if (currentSlide >= activeSlides.length) {
                currentSlide = 0;
                fetchDisplayData(); 
            }
        }

        fetchDisplayData().then(() => {
            const durationMs = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slide-duration')) || 12) * 1000;
            rotateSlides();
            setInterval(rotateSlides, durationMs);
            if (isPreviewMode) document.body.style.zoom = "0.45";
        });
    </script>
</body>
