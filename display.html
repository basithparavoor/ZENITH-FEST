<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestOS | Live Spectator Display</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@600;800;900&family=Bebas+Neue&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --bg-main: #0F172A;
            --bg-surface: rgba(30, 41, 59, 0.6);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; text-transform: uppercase; }
        
        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-main);
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
            position: relative;
        }

        /* --- PREMIUM ANIMATED BACKGROUND --- */
        .grid-pattern {
            position: absolute; inset: 0; z-index: -2;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 2px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 10%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 10%, transparent 100%);
        }
        .ambient-bg { position: fixed; inset: 0; z-index: -3; pointer-events: none; overflow: hidden; background: #020617; }
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.5; animation: float 25s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        .orb-1 { width: 800px; height: 800px; background: var(--primary); top: -200px; left: -200px; }
        .orb-2 { width: 600px; height: 600px; background: #E11D48; bottom: -150px; right: -150px; animation-delay: -7s; opacity: 0.3; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 100% { transform: translate(100px, 150px) scale(1.2) rotate(20deg); } }

        /* --- HEADER & BRANDING --- */
        #brand-header {
            position: absolute; top: 3rem; left: 0; width: 100%; z-index: 50; display: flex; justify-content: center; align-items: center; gap: 1.5rem;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        #brand-header img { height: 90px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.2); }
        #brand-header h1 { font-size: 4rem; font-weight: 900; letter-spacing: -1px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }

        /* --- SLIDE CONTAINER & TRANSITIONS --- */
        #slide-container {
            flex: 1; position: relative; z-index: 10; display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%; overflow: hidden; padding-top: 8rem; padding-bottom: 80px;
        }

        .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; padding: 4rem; }
        .slide.active { opacity: 1; pointer-events: auto; }

        .trans-fade .slide { transition: opacity 1s ease-in-out; }
        .trans-slide .slide { transform: translateX(100%); transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s; opacity: 0; }
        .trans-slide .slide.active { transform: translateX(0); opacity: 1; }
        .trans-slide .slide.exit { transform: translateX(-100%); opacity: 0; }
        .trans-zoom .slide { transform: scale(1.15); transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s; opacity: 0; }
        .trans-zoom .slide.active { transform: scale(1); opacity: 1; }

        /* --- GLOBAL TICKER MARQUEE --- */
        #ticker-wrap {
            position: absolute; bottom: 0; width: 100%; height: 80px; 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 2px solid var(--primary); display: flex; align-items: center; overflow: hidden; z-index: 100;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .ticker-badge {
            background: var(--primary); color: white; height: 100%; display: flex; align-items: center; padding: 0 3rem;
            font-size: 1.5rem; font-weight: 900; letter-spacing: 0.1em; z-index: 101; box-shadow: 10px 0 20px rgba(0,0,0,0.5);
        }
        .ticker-content { flex: 1; overflow: hidden; display: flex; align-items: center; }
        .ticker-text {
            white-space: nowrap; font-size: 2rem; font-weight: 800; color: var(--text-main); letter-spacing: 0.05em;
            display: inline-block; padding-left: 100%; animation: ticker 25s linear infinite;
        }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* --- LIVE FLASH ALERT --- */
        #flash-alert {
            position: fixed; inset: 0; background: rgba(225, 29, 72, 0.95); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 4rem; backdrop-filter: blur(20px);
        }
        .flash-text { font-size: 7rem; font-weight: 900; line-height: 1.1; text-shadow: 0 10px 40px rgba(0,0,0,0.6); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.05); opacity: 0.8; } }

        /* --- SLIDE TYPES CSS --- */
        .slide-title { font-size: 3rem; font-weight: 900; color: var(--primary); margin-bottom: 3rem; text-shadow: 0 4px 20px rgba(0,0,0,0.8); letter-spacing: 0.05em; text-align: center; }

        /* Premium Leaderboard */
        .lb-container { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 1400px; }
        .lb-card { 
            background: var(--bg-surface); border: 2px solid var(--border); border-radius: 24px; 
            padding: 2rem 3rem; display: flex; align-items: center; gap: 3rem; 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); position: relative; overflow: hidden;
        }
        .lb-card::before { content: ''; position: absolute; top:0; left:0; width: 8px; height: 100%; background: var(--text-muted); }
        .lb-card.rank-1 { border-color: #F59E0B; background: rgba(245, 158, 11, 0.1); transform: scale(1.05); z-index: 5; }
        .lb-card.rank-1::before { background: #F59E0B; box-shadow: 0 0 20px #F59E0B; }
        .lb-card.rank-2::before { background: #94A3B8; }
        .lb-card.rank-3::before { background: #B45309; }

        .lb-rank { font-size: 5rem; font-weight: 900; color: var(--text-muted); width: 100px; text-align: center; line-height: 1; }
        .lb-card.rank-1 .lb-rank { color: #F59E0B; text-shadow: 0 0 30px rgba(245, 158, 11, 0.5); }
        .lb-name { font-size: 3.5rem; font-weight: 800; flex: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .lb-pts { font-size: 4.5rem; font-weight: 900; color: var(--primary); text-shadow: 0 0 30px var(--primary-glow); }

        /* Premium Schedule */
        .sch-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; width: 100%; max-width: 1600px; }
        .sch-card { 
            background: var(--bg-surface); border: 1px solid var(--border); border-left: 8px solid var(--primary); 
            padding: 2.5rem; border-radius: 20px; display: flex; flex-direction: column; gap: 1rem;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .sch-time { font-size: 2.5rem; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 1rem; }
        .sch-event { font-size: 2.8rem; font-weight: 800; line-height: 1.2; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .sch-stage { font-size: 1.5rem; font-weight: 700; color: var(--text-main); background: rgba(255,255,255,0.1); padding: 0.5rem 1.5rem; border-radius: 50px; align-self: flex-start; border: 1px solid var(--border); }

        /* Custom Slide */
        .cs-bg { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; filter: brightness(0.6); }
        .cs-content { text-align: center; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
        .cs-title { font-size: 6rem; font-weight: 900; color: var(--primary); text-shadow: 0 10px 30px rgba(0,0,0,0.8); line-height: 1.1; }
        .cs-text { font-size: 3rem; font-weight: 600; line-height: 1.4; max-width: 1400px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); color: #F8FAFC; }
        .cs-qr { background: white; padding: 1.5rem; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; gap: 1rem; }

    </style>
</head>
<body class="trans-fade" id="app-body">

    <!-- Premium Background -->
    <div class="ambient-bg">
        <div class="grid-pattern"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Dynamic Header -->
    <div id="brand-header">
        <!-- JS Injected Logo & Title -->
    </div>

    <!-- Instant Flash Alert Overlay -->
    <div id="flash-alert">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 10rem; margin-bottom: 2rem; color: white;"></i>
        <div class="flash-text" id="flash-msg">ATTENTION PLEASE</div>
    </div>

    <!-- Main Dynamic Canvas -->
    <div id="slide-container">
        <div class="slide active" style="text-align: center;">
            <i class="fa-solid fa-satellite-dish fa-beat-fade" style="font-size: 6rem; color: var(--primary); margin-bottom: 2rem;"></i>
            <h1 style="font-size: 4rem; font-weight: 800;">ESTABLISHING CONNECTION...</h1>
            <p style="font-size: 2rem; color: var(--text-muted); margin-top: 1rem;">WAITING FOR DATA FROM CONTROL DESK</p>
        </div>
    </div>

    <!-- Scrolling Global Ticker -->
    <div id="ticker-wrap" style="display: none;">
        <div class="ticker-badge"><i class="fa-solid fa-bolt" style="margin-right: 15px;"></i> LIVE</div>
        <div class="ticker-content">
            <div class="ticker-text" id="global-ticker-text"></div>
        </div>
    </div>

    <!-- Web Audio API Fallbacks -->
    <audio id="sfx-applause" src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg" preload="auto"></audio>
    <audio id="sfx-alert" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // State Engine
        let displaySettings = {};
        let systemBranding = {};
        let pointsAdminSettings = {};
        let lastActionTimestamp = 0;
        
        // Playlist Engine
        let playlist = [];
        let currentSlideIndex = 0;
        let slideTimer = null;

        // Data Caches
        let teamsData = [];
        let pointsData = [];
        let scheduleData = {};
        let compsList = [];

        async function initDisplay() {
            await fetchBranding();
            await fetchPointSettings();
            await cycleDataFetch(); // Initial heavy load
            
            setInterval(pollLiveTriggers, 3000); // 3s Fast poll for actions/settings
            setInterval(cycleDataFetch, 30000); // 30s Slow poll for DB data
        }

        async function fetchBranding() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'system_branding').maybeSingle();
                if (data && data.value) {
                    systemBranding = data.value;
                    const header = document.getElementById('brand-header');
                    let html = '';
                    if (systemBranding.fest_logo) html += `<img src="${systemBranding.fest_logo}">`;
                    if (systemBranding.fest_name) html += `<h1>${systemBranding.fest_name}</h1>`;
                    header.innerHTML = html;
                }
            } catch (e) { console.error("Branding sync failed"); }
        }

        async function fetchPointSettings() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'point_system').maybeSingle();
                // Exact fallback defaults from admin.js
                pointsAdminSettings = data?.value || {
                    thresholds: { aplus: 90, a: 70, b: 60, c: 50 },
                    points_solo: { aplus: 8, a: 7, b: 5, c: 3 },
                    points_small: { aplus: 12, a: 10, b: 7, c: 5 },
                    points_large: { aplus: 15, a: 12, b: 10, c: 7 },
                    pos_points: { p1: 3, p2: 2, p3: 1 }
                };
            } catch (e) { console.error("Point settings sync failed"); }
        }

        // --- HEAVY DATA FETCHING (Accurate Point Engine & Schedules) ---
        async function cycleDataFetch() {
            try {
                const { data: schedReq } = await supabaseClient.from('settings').select('value').eq('id', 'master_schedule').maybeSingle();
                scheduleData = schedReq?.value || {};

                const { data: teams } = await supabaseClient.from('teams').select('*');
                teamsData = teams || [];
                
                const { data: comps } = await supabaseClient.from('competitions').select('*, categories(name), stages(name)');
                compsList = comps || [];

                const { data: judgements } = await supabaseClient.from('judgements').select('participant_id, competition_id, awarded_mark');
                const { data: participants } = await supabaseClient.from('participants').select('id, team_id');

                // --- ACCURATE POINT ENGINE (Mirrors Admin.js) ---
                let teamScores = {};
                teamsData.forEach(t => teamScores[t.id] = { name: t.name, score: 0 });

                let compAverages = {};
                (judgements || []).forEach(j => {
                    if(!compAverages[j.competition_id]) compAverages[j.competition_id] = {};
                    if(!compAverages[j.competition_id][j.participant_id]) compAverages[j.competition_id][j.participant_id] = { marks: [] };
                    compAverages[j.competition_id][j.participant_id].marks.push(parseFloat(j.awarded_mark));
                });

                const pMap = {}; participants.forEach(p => pMap[p.id] = p.team_id);

                compsList.forEach(comp => {
                    if(!compAverages[comp.id]) return;
                    
                    // 1. Average Marks and drop outliers
                    let pAvg = Object.keys(compAverages[comp.id]).map(pId => {
                        let m = compAverages[comp.id][pId].marks.sort((a,b) => a - b);
                        if (m.length >= 3) m = m.slice(1, m.length - 1); // Drop highest/lowest
                        let avg = m.reduce((a, b) => a + b, 0) / m.length;
                        return { id: pId, mark: avg };
                    }).sort((a, b) => b.mark - a.mark);

                    const limit = comp.max_participants || 1;
                    const sizeCat = limit >= 4 ? 'large' : (limit >= 2 ? 'small' : 'solo');

                    let currentRank = 1;
                    let previousScore = -1;

                    // 2. Assign Grades & Positions
                    pAvg.forEach((p, idx) => {
                        if (p.mark !== previousScore) currentRank = idx + 1;
                        previousScore = p.mark;

                        let percent = (p.mark / (comp.max_mark || 100)) * 100;
                        let gradePts = 0; let posPts = 0;

                        if (percent >= 50) {
                            if (percent >= pointsAdminSettings.thresholds.aplus) gradePts = Number(pointsAdminSettings[`points_${sizeCat}`].aplus) || 0;
                            else if (percent >= pointsAdminSettings.thresholds.a) gradePts = Number(pointsAdminSettings[`points_${sizeCat}`].a) || 0;
                            else if (percent >= pointsAdminSettings.thresholds.b) gradePts = Number(pointsAdminSettings[`points_${sizeCat}`].b) || 0;
                            else gradePts = Number(pointsAdminSettings[`points_${sizeCat}`].c) || 0;
                        }

                        if (currentRank <= 3) {
                            if (currentRank === 1) posPts = Number(pointsAdminSettings.pos_points.p1) || 0;
                            else if (currentRank === 2) posPts = Number(pointsAdminSettings.pos_points.p2) || 0;
                            else if (currentRank === 3) posPts = Number(pointsAdminSettings.pos_points.p3) || 0;
                        }

                        const tId = pMap[p.id];
                        if (tId && teamScores[tId]) {
                            teamScores[tId].score += (gradePts + posPts);
                        }
                    });
                });

                // Top 5 Teams
                pointsData = Object.values(teamScores)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 5);

                if (Object.keys(displaySettings).length > 0) buildPlaylist();

            } catch (e) { console.error("Data cycle failed", e); }
        }

        // --- FAST POLLING (Live Triggers & Settings) ---
        async function pollLiveTriggers() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                if (!data || !data.value) return;
                
                const newSettings = data.value;
                const requiresPlaylistRebuild = JSON.stringify(displaySettings.custom_slides) !== JSON.stringify(newSettings.custom_slides) 
                                                || displaySettings.show_leaderboard !== newSettings.show_leaderboard
                                                || displaySettings.show_schedule !== newSettings.show_schedule;

                displaySettings = newSettings;
                applyDisplayStyles();

                if (displaySettings.live_action && displaySettings.live_action.timestamp > lastActionTimestamp) {
                    lastActionTimestamp = displaySettings.live_action.timestamp;
                    executeLiveAction(displaySettings.live_action);
                }

                if (requiresPlaylistRebuild) buildPlaylist();

            } catch (e) { console.error("Polling error"); }
        }

        function applyDisplayStyles() {
            const root = document.documentElement;
            root.style.setProperty('--primary', displaySettings.primary_color || '#4F46E5');
            root.style.setProperty('--primary-glow', `${displaySettings.primary_color || '#4F46E5'}66`); // 40% opacity
            root.style.setProperty('--font-main', displaySettings.font_family || "'Plus Jakarta Sans', sans-serif");
            
            document.getElementById('app-body').className = `trans-${displaySettings.transition || 'fade'}`;

            const tickerWrap = document.getElementById('ticker-wrap');
            if (displaySettings.global_ticker) {
                tickerWrap.style.display = 'flex';
                document.getElementById('global-ticker-text').innerText = displaySettings.global_ticker;
            } else {
                tickerWrap.style.display = 'none';
            }
        }

        // --- LIVE ACTION DESK EXECUTOR ---
        function executeLiveAction(action) {
            if (action.type === 'confetti') {
                document.getElementById('sfx-applause').play().catch(()=>{});
                const duration = 5000; const end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 15, angle: 60, spread: 55, origin: { x: 0 }, colors: [displaySettings.primary_color || '#4F46E5', '#10B981', '#F59E0B'] });
                    confetti({ particleCount: 15, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#E11D48', '#FFFFFF', '#F59E0B'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } 
            else if (action.type === 'applause') {
                document.getElementById('sfx-applause').play().catch(()=>{});
            }
            else if (action.type === 'flash_alert') {
                document.getElementById('sfx-alert').play().catch(()=>{});
                const alertDiv = document.getElementById('flash-alert');
                document.getElementById('flash-msg').innerText = action.message || "ATTENTION";
                alertDiv.style.display = 'flex';
                clearTimeout(slideTimer); // Pause loop
                
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                    startSlideShow(); // Resume loop
                }, 15000);
            }
        }

        // --- DYNAMIC PLAYLIST BUILDER ---
        function buildPlaylist() {
            playlist = [];

            // 1. Premium Leaderboard Slide
            if (displaySettings.show_leaderboard !== false && pointsData.length > 0) {
                let lbHtml = `<div class="slide-title">CHAMPIONSHIP STANDINGS</div><div class="lb-container">`;
                pointsData.forEach((team, i) => {
                    let rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
                    let crownHtml = i === 0 ? '<i class="fa-solid fa-crown" style="position:absolute; top:-25px; left:50%; transform:translateX(-50%); font-size:4rem; color:#F59E0B; text-shadow:0 0 20px rgba(245,158,11,0.8);"></i>' : '';
                    lbHtml += `
                        <div class="lb-card ${rankClass}">
                            ${crownHtml}
                            <div class="lb-rank">#${i + 1}</div>
                            <div class="lb-name">${team.name}</div>
                            <div class="lb-pts">${team.score} <span style="font-size:2rem; color:var(--text-muted);">PTS</span></div>
                        </div>
                    `;
                });
                lbHtml += `</div>`;
                playlist.push({ html: lbHtml, duration: displaySettings.slide_duration || 12 });
            }

            // 2. Premium Schedule Slide
            if (displaySettings.show_schedule !== false && Object.keys(scheduleData).length > 0) {
                let upcoming = Object.keys(scheduleData)
                    .map(cId => ({ comp: compsList.find(c => c.id == cId), sched: scheduleData[cId] }))
                    .filter(item => item.comp && item.sched.status === 'published')
                    .sort((a,b) => {
                        if (a.sched.date !== b.sched.date) return a.sched.date.localeCompare(b.sched.date);
                        return a.sched.time.localeCompare(b.sched.time);
                    })
                    .slice(0, 6); // Next 6 events (Grid layout)

                if (upcoming.length > 0) {
                    let schHtml = `<div class="slide-title">UPCOMING SCHEDULE</div><div class="sch-container">`;
                    upcoming.forEach(u => {
                        schHtml += `
                            <div class="sch-card">
                                <div class="sch-time"><i class="fa-regular fa-clock"></i> ${u.sched.time} ${u.sched.to_time ? `<span style="font-size:1.8rem; color:var(--text-muted);">- ${u.sched.to_time}</span>` : ''}</div>
                                <div class="sch-event">${u.comp.name}</div>
                                <div class="sch-stage">${u.comp.stages?.name || 'TBD'}</div>
                            </div>
                        `;
                    });
                    schHtml += `</div>`;
                    playlist.push({ html: schHtml, duration: displaySettings.slide_duration || 12 });
                }
            }

            // 3. Custom Slides
            if (displaySettings.custom_slides && displaySettings.custom_slides.length > 0) {
                displaySettings.custom_slides.filter(cs => cs.enabled !== false).forEach(cs => {
                    let csHtml = '';
                    if (cs.bg_url) csHtml += `<img src="${cs.bg_url}" class="cs-bg">`;
                    csHtml += `<div class="cs-content">`;
                    if (cs.title) csHtml += `<div class="cs-title" style="color: ${cs.color || 'var(--primary)'};">${cs.title}</div>`;
                    if (cs.text) csHtml += `<div class="cs-text">${cs.text}</div>`;
                    if (cs.qr_url) csHtml += `<div class="cs-qr"><div id="qr-${cs.id}"></div><div style="font-size:1.2rem; font-weight:900; color:#0F172A; margin-top:0.5rem; letter-spacing:0.05em;">${cs.qr_text || 'SCAN ME'}</div></div>`;
                    csHtml += `</div>`;
                    
                    playlist.push({ 
                        html: csHtml, 
                        duration: cs.duration || displaySettings.slide_duration || 12,
                        qrData: cs.qr_url ? { id: cs.id, url: cs.qr_url } : null
                    });
                });
            }

            // Fallback Idle Screen
            if (playlist.length === 0) {
                playlist.push({
                    html: `
                        <div style="text-align:center;">
                            <i class="fa-solid fa-hourglass-half fa-spin-pulse" style="font-size: 6rem; color: var(--primary); margin-bottom: 2rem;"></i>
                            <h1 style="font-size: 5rem; font-weight: 900;">NEXT UPDATES SHORTLY</h1>
                            <p style="font-size: 2.5rem; color: var(--text-muted); margin-top: 1rem;">STAY TUNED</p>
                        </div>
                    `,
                    duration: 20
                });
            }

            // Restart slideshow safely
            clearTimeout(slideTimer);
            if (currentSlideIndex >= playlist.length) currentSlideIndex = 0;
            startSlideShow();
        }

        function startSlideShow() {
            const container = document.getElementById('slide-container');
            const slideData = playlist[currentSlideIndex];
            if (!slideData) return;

            const oldSlide = container.querySelector('.slide.active');
            if (oldSlide) {
                oldSlide.classList.remove('active');
                oldSlide.classList.add('exit');
                setTimeout(() => oldSlide.remove(), 1000); 
            }

            const newSlide = document.createElement('div');
            newSlide.className = 'slide';
            newSlide.innerHTML = slideData.html;
            container.appendChild(newSlide);
            
            if (slideData.qrData) {
                setTimeout(() => {
                    new QRCode(document.getElementById(`qr-${slideData.qrData.id}`), {
                        text: slideData.qrData.url, width: 250, height: 250,
                        colorDark: "#0F172A", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
                    });
                }, 50);
            }

            requestAnimationFrame(() => requestAnimationFrame(() => newSlide.classList.add('active')));

            currentSlideIndex++;
            if (currentSlideIndex >= playlist.length) currentSlideIndex = 0;
            
            slideTimer = setTimeout(startSlideShow, slideData.duration * 1000);
        }

        document.addEventListener('DOMContentLoaded', initDisplay);
    </script>
</body>
</html>
