<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 320 512%22><path fill=%22%234F46E5%22 d=%22M296 160H180.6l42.6-129.8C227.2 15 215.7 0 200 0H56C44 0 33.8 8.9 32.2 20.8l-32 240C-.5 273.6 9.3 288 24 288h118.7L96.6 482.5c-3.6 15.2 8 29.5 23.3 29.5 8.4 0 16.4-4.4 20.8-12l176-304c9.3-15.9-2.2-36-20.7-36z%22/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Premium Broadcast Dark Palette */
            --primary: #3B82F6;
            --primary-glow: rgba(59, 130, 246, 0.45);
            --bg-dark: #070B14;
            --surface: rgba(15, 23, 42, 0.75);
            --surface-border: rgba(255, 255, 255, 0.1);
            
            --gold: #F59E0B; --gold-glow: rgba(245, 158, 11, 0.45);
            --silver: #9CA3AF; --silver-glow: rgba(156, 163, 175, 0.35);
            --bronze: #D97706; --bronze-glow: rgba(217, 119, 6, 0.35);
            
            --slide-duration: 12s; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; text-transform: uppercase; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* MASTER SCALED VIEWPORT (Fit to any screen: 4K, 1080p, 720p, mobile, preview iframe) */
        #display-stage {
            position: absolute;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: var(--bg-dark);
            transform-origin: top left;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transition: background 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Ambient Background Modes */
        .ambient-bg { position: absolute; inset: 0; z-index: -2; pointer-events: none; }
        .grid-overlay {
            position: absolute; inset: 0; z-index: -1; pointer-events: none;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.45; animation: float 25s infinite alternate ease-in-out; transition: background 0.8s ease, transform 0.8s ease;}
        .orb-1 { background: var(--primary); width: 850px; height: 850px; top: -20%; left: -10%; }
        .orb-2 { background: rgba(139, 92, 246, 0.35); width: 750px; height: 750px; bottom: -15%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5%, 8%) scale(1.15); } }

        /* 8 EXPANDED LUXURY THEMES */
        /* 1. Cyber Aurora */
        body.bg-cyber-aurora #display-stage { background: #070B14; }
        body.bg-cyber-aurora .ambient-bg { display: block; }
        body.bg-cyber-aurora .grid-overlay { display: block; }
        body.bg-cyber-aurora #stardust-canvas { display: none; }

        /* 2. Golden Stardust */
        body.bg-golden-stardust #display-stage { background: radial-gradient(circle at center, #1A1305 0%, #080602 100%); }
        body.bg-golden-stardust .ambient-bg { display: none; }
        body.bg-golden-stardust .grid-overlay { display: none; }
        body.bg-golden-stardust #stardust-canvas { display: block; }

        /* 3. Corporate Slate */
        body.bg-corporate-slate #display-stage { background: #0A0E17; }
        body.bg-corporate-slate .ambient-bg { display: none; }
        body.bg-corporate-slate .grid-overlay { opacity: 0.45; display: block; }
        body.bg-corporate-slate #stardust-canvas { display: none; }

        /* 4. Cosmic Nebula */
        body.bg-cosmic-nebula #display-stage { background: radial-gradient(ellipse at bottom, #1B0B2E 0%, #06020E 100%); }
        body.bg-cosmic-nebula .ambient-bg { display: block; }
        body.bg-cosmic-nebula .orb-1 { background: #EC4899; opacity: 0.35; }
        body.bg-cosmic-nebula .orb-2 { background: #8B5CF6; opacity: 0.45; }
        body.bg-cosmic-nebula .grid-overlay { opacity: 0.3; display: block; }
        body.bg-cosmic-nebula #stardust-canvas { display: none; }

        /* 5. Crimson Grandeur */
        body.bg-crimson-grandeur #display-stage { background: radial-gradient(ellipse at center, #26050C 0%, #0A0103 100%); }
        body.bg-crimson-grandeur .ambient-bg { display: block; }
        body.bg-crimson-grandeur .orb-1 { background: #E11D48; opacity: 0.35; }
        body.bg-crimson-grandeur .orb-2 { background: #D97706; opacity: 0.25; }
        body.bg-crimson-grandeur .grid-overlay { opacity: 0.2; display: block; }
        body.bg-crimson-grandeur #stardust-canvas { display: none; }

        /* 6. Emerald Matrix */
        body.bg-emerald-matrix #display-stage { background: radial-gradient(ellipse at center, #021C14 0%, #010A07 100%); }
        body.bg-emerald-matrix .ambient-bg { display: block; }
        body.bg-emerald-matrix .orb-1 { background: #10B981; opacity: 0.35; }
        body.bg-emerald-matrix .orb-2 { background: #06B6D4; opacity: 0.35; }
        body.bg-emerald-matrix .grid-overlay { opacity: 0.4; display: block; }
        body.bg-emerald-matrix #stardust-canvas { display: none; }

        /* 7. Synthwave Sunset */
        body.bg-synthwave-sunset #display-stage { background: linear-gradient(180deg, #090214 0%, #1A0730 65%, #380C3F 100%); }
        body.bg-synthwave-sunset .ambient-bg { display: block; }
        body.bg-synthwave-sunset .orb-1 { background: #F43F5E; opacity: 0.4; top: -10%; }
        body.bg-synthwave-sunset .orb-2 { background: #06B6D4; opacity: 0.35; }
        body.bg-synthwave-sunset .grid-overlay { opacity: 0.55; display: block; }
        body.bg-synthwave-sunset #stardust-canvas { display: none; }

        /* 8. Midnight Quartz */
        body.bg-midnight-quartz #display-stage { background: radial-gradient(circle at 50% 30%, #0C1A30 0%, #030710 100%); }
        body.bg-midnight-quartz .ambient-bg { display: block; }
        body.bg-midnight-quartz .orb-1 { background: #38BDF8; opacity: 0.35; }
        body.bg-midnight-quartz .orb-2 { background: #6366F1; opacity: 0.35; }
        body.bg-midnight-quartz .grid-overlay { opacity: 0.35; display: block; }
        body.bg-midnight-quartz #stardust-canvas { display: none; }

        /* Top Progress Bar */
        .progress-bar-container { width: 100%; height: 5px; background: rgba(255,255,255,0.08); position: absolute; top: 0; left: 0; z-index: 500; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), #60A5FA); width: 0%; box-shadow: 0 0 15px var(--primary-glow); }
        .progress-bar.animating { transition: width var(--slide-duration) linear; width: 100%; }

        /* Header HUD */
        .header { 
            height: 110px; padding: 0 3.5rem; display: flex; justify-content: space-between; align-items: center; 
            background: linear-gradient(to bottom, rgba(7, 11, 20, 0.98), rgba(7, 11, 20, 0.6) 80%, transparent); z-index: 200; 
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 1.5rem; }
        .header-right { display: flex; align-items: center; gap: 2rem; }
        .clock { font-family: 'Inter', sans-serif; font-size: 1.6rem; font-weight: 700; color: rgba(255,255,255,0.95); letter-spacing: 2px; }
        .live-badge { 
            background: rgba(239, 68, 68, 0.16); color: #FCA5A5; padding: 0.5rem 1.25rem; border-radius: 50px; 
            border: 1px solid rgba(239, 68, 68, 0.4); font-size: 1.05rem; font-weight: 800; 
            display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 0 20px rgba(239, 68, 68, 0.25); letter-spacing: 0.04em;
        }
        .live-dot { width: 12px; height: 12px; background: #EF4444; border-radius: 50%; animation: pulseDot 1.5s infinite; box-shadow: 0 0 12px #EF4444; }
        @keyframes pulseDot { 0% { transform: scale(0.9); opacity: 0.5; } 50% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.5; } }

        /* Milestone Widget */
        .milestone-widget {
            display: flex; align-items: center; gap: 1.25rem;
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.55rem 1.4rem; border-radius: 50px; backdrop-filter: blur(20px);
            font-size: 0.9rem; font-weight: 800; letter-spacing: 0.04em;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }
        .milestone-bar-bg { width: 140px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; }
        .milestone-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #10B981); border-radius: 6px; transition: width 1s ease; }

        /* Slides Base */
        .slide-container { flex: 1; position: relative; padding: 1rem 3.5rem 5rem 3.5rem; display: flex; flex-direction: column; overflow: hidden; }
        .slide { position: absolute; inset: 0; padding: 1rem 3.5rem 5.5rem 3.5rem; opacity: 0; transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; pointer-events: none; transform: scale(0.97); }
        .slide.active { opacity: 1; pointer-events: all; transform: scale(1); }
        .slide-title { font-size: 3rem; font-weight: 800; color: #FFFFFF; margin-bottom: 2rem; text-shadow: 0 8px 25px rgba(0,0,0,0.7); letter-spacing: -0.02em; text-align: center; flex-shrink: 0; z-index: 10; position: relative; }
        .page-indicator { font-size: 1.4rem; color: rgba(255,255,255,0.45); vertical-align: middle; margin-left: 1rem; font-weight: 600; }

        /* --- 🏆 SPECTACULAR PODIUM RESULTS SCREEN --- */
        .results-layout { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding-bottom: 2rem; }        
        .v-podium-stack { display: flex; flex-direction: column; gap: 1.25rem; width: 1100px; max-width: 100%; }
        
        .v-podium-card { 
            display: flex; flex-direction: row; border-radius: 22px; overflow: hidden; 
            box-shadow: 0 20px 45px rgba(0,0,0,0.4); opacity: 0; transform: translateX(80px); 
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease; height: 145px; 
            position: relative;
        }
        .slide.active .v-podium-card { opacity: 1; transform: translateX(0); }
        
        /* 1st Place Gold */
        .v-podium-card.p1 { 
            height: 165px; z-index: 10; transform: scale(1.03) translateX(80px); 
            border: 2px solid rgba(245, 158, 11, 0.75); box-shadow: 0 25px 60px var(--gold-glow); 
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.18), rgba(15, 23, 42, 0.9));
        }
        .slide.active .v-podium-card.p1 { transform: scale(1.03) translateX(0); transition-delay: 0.1s; }
        
        /* 2nd Place Silver */
        .v-podium-card.p2 { 
            border: 1px solid rgba(156, 163, 175, 0.45); box-shadow: 0 15px 40px var(--silver-glow); 
            background: linear-gradient(90deg, rgba(156, 163, 175, 0.12), rgba(15, 23, 42, 0.88));
        }
        .slide.active .v-podium-card.p2 { transition-delay: 0.35s; }
        
        /* 3rd Place Bronze */
        .v-podium-card.p3 { 
            border: 1px solid rgba(217, 119, 6, 0.45); box-shadow: 0 15px 40px var(--bronze-glow); 
            background: linear-gradient(90deg, rgba(217, 119, 6, 0.12), rgba(15, 23, 42, 0.88));
        }
        .slide.active .v-podium-card.p3 { transition-delay: 0.6s; }

        .v-card-info { 
            flex: 1; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(24px);
            padding: 0 3rem; display: flex; flex-direction: column; justify-content: center; text-align: left; 
        }        
        .v-card-rank { 
            width: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0.35rem; padding: 0.75rem; 
            flex-shrink: 0; position: relative;
        }
        
        .p1 .v-card-rank { background: linear-gradient(135deg, #78350F 0%, #B45309 40%, #D97706 100%); }
        .p2 .v-card-rank { background: linear-gradient(135deg, #1E293B 0%, #334155 40%, #475569 100%); }
        .p3 .v-card-rank { background: linear-gradient(135deg, #451A03 0%, #78350F 40%, #92400E 100%); }
        
        /* --- 🌟 LUXURY EMBLEM MEDALLIONS --- */
        .pos-badge-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .pos-medal-svg { width: 90px; height: 90px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5)); }
        .p1 .pos-medal-svg { width: 105px; height: 105px; }
        
        .pos-badge-ribbon {
            font-size: 0.72rem; font-weight: 900; letter-spacing: 0.08em; padding: 2px 10px; border-radius: 4px;
            margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        .gold-ribbon { background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; }
        .silver-ribbon { background: #F1F5F9; color: #334155; border: 1px solid #CBD5E1; }
        .bronze-ribbon { background: #FFEDD5; color: #7C2D12; border: 1px solid #FDBA74; }
        
        .v-name { font-size: 2.2rem; font-weight: 800; color: white; margin-bottom: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: -0.01em; }
        .p1 .v-name { font-size: 2.6rem; color: #FFFFFF; text-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        
        .v-team { font-size: 1.2rem; font-weight: 700; color: rgba(255,255,255,0.75); letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.75rem; }
        .p1 .v-team { color: var(--gold); font-size: 1.35rem; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

        /* Group Competition Members Roster */
        .v-members-strip { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.4rem; max-height: 48px; overflow: hidden; }
        .v-member-tag { 
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); 
            color: #FFFFFF; padding: 0.2rem 0.65rem; border-radius: 6px; font-size: 0.95rem; font-weight: 700; 
            display: inline-flex; align-items: center; gap: 0.3rem; letter-spacing: 0.02em;
        }
        .v-member-tag.leader { 
            background: rgba(245, 158, 11, 0.3); border-color: rgba(245, 158, 11, 0.7); 
            color: #FDE68A; font-weight: 800; 
        }

        /* --- 🏅 CHAMPIONSHIP LEADERBOARD MEDALS --- */
        .leaderboard { display: flex; flex-direction: column; gap: 1.1rem; max-width: 1450px; margin: 0 auto; width: 100%; }
        .lb-row { 
            background: var(--surface); border: 1px solid var(--surface-border); padding: 1.25rem 2.75rem; 
            border-radius: 20px; display: flex; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            backdrop-filter: blur(24px); opacity: 0; 
            transform: translateX(-40px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .slide.active .lb-row { opacity: 1; transform: translateX(0); }
        .slide.active .lb-row:nth-child(1) { transition-delay: 0.08s; } .slide.active .lb-row:nth-child(2) { transition-delay: 0.16s; }
        .slide.active .lb-row:nth-child(3) { transition-delay: 0.24s; } .slide.active .lb-row:nth-child(4) { transition-delay: 0.32s; }
        .slide.active .lb-row:nth-child(5) { transition-delay: 0.40s; } .slide.active .lb-row:nth-child(6) { transition-delay: 0.48s; }
        
        .lb-row.gold { border-left: 8px solid var(--gold); background: linear-gradient(90deg, rgba(245, 158, 11, 0.18), var(--surface)); transform: scale(1.02); box-shadow: 0 15px 40px var(--gold-glow); z-index: 10; }
        .lb-row.silver { border-left: 8px solid var(--silver); background: linear-gradient(90deg, rgba(156, 163, 175, 0.16), var(--surface)); }
        .lb-row.bronze { border-left: 8px solid var(--bronze); background: linear-gradient(90deg, rgba(217, 119, 6, 0.16), var(--surface)); }
        
        .lb-rank { width: 100px; display: flex; align-items: center; justify-content: flex-start; }
        .lb-medal { 
            width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.35); position: relative;
        }
        .lb-gold-medal { 
            background: linear-gradient(135deg, #FFE259 0%, #FFA751 100%); color: #78350F; 
            border: 2px solid #FFF3C4; box-shadow: 0 0 20px var(--gold-glow); font-size: 1.6rem;
        }
        .lb-silver-medal { 
            background: linear-gradient(135deg, #FFFFFF 0%, #94A3B8 100%); color: #0F172A; 
            border: 2px solid #F1F5F9; box-shadow: 0 0 15px var(--silver-glow); 
        }
        .lb-bronze-medal { 
            background: linear-gradient(135deg, #FDE68A 0%, #B45309 100%); color: #451A03; 
            border: 2px solid #FED7AA; box-shadow: 0 0 15px var(--bronze-glow); 
        }
        .lb-plain-medal { 
            background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.15); font-size: 1.3rem; 
        }

        .lb-team { flex: 1; font-size: 2.2rem; font-weight: 800; letter-spacing: 0.02em; color: #FFFFFF; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .lb-score { font-size: 3.2rem; font-weight: 800; color: white; display: flex; align-items: baseline; gap: 0.6rem; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .lb-score span { font-size: 1.2rem; color: rgba(255,255,255,0.7); font-weight: 700; letter-spacing: 1px; }

        /* --- 📅 EVENT SCHEDULE & RADAR --- */
        .sch-card {
            border-radius: 20px; background: var(--surface); border: 1px solid var(--surface-border);
            padding: 1.35rem 2.5rem; display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .slide.active .sch-card { opacity: 1; transform: translateY(0); }
        .slide.active .sch-card:nth-child(1) { transition-delay: 0.1s; } .slide.active .sch-card:nth-child(2) { transition-delay: 0.2s; }
        .slide.active .sch-card:nth-child(3) { transition-delay: 0.3s; } .slide.active .sch-card:nth-child(4) { transition-delay: 0.4s; }
        .slide.active .sch-card:nth-child(5) { transition-delay: 0.5s; }

        /* --- HOLOGRAPHIC QR HUD --- */
        .qr-widget { 
            position: absolute; bottom: 5rem; right: 3rem; background: rgba(15, 23, 42, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 1.1rem 1.4rem; border-radius: 24px; 
            display: flex; align-items: center; gap: 1.25rem; backdrop-filter: blur(28px); 
            z-index: 300; box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 25px rgba(59, 130, 246, 0.2); 
            animation: floatQR 6s infinite ease-in-out; 
        }
        @keyframes floatQR { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .qr-text-block { display: flex; flex-direction: column; gap: 0.3rem; max-width: 150px; }
        .qr-widget span { font-size: 1rem; font-weight: 800; color: white; line-height: 1.2; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
        .qr-widget small { font-size: 0.75rem; color: #60A5FA; font-weight: 700; letter-spacing: 0.05em; }
        #display-qr { background: white; padding: 8px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* --- BOTTOM TICKER MARQUEE --- */
        .ticker-wrap { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 3.5rem; 
            background: rgba(11, 17, 33, 0.96); backdrop-filter: blur(24px); 
            border-top: 1px solid rgba(59, 130, 246, 0.4); z-index: 400; overflow: hidden; 
            display: flex; align-items: center; box-shadow: 0 -10px 35px rgba(0,0,0,0.6); 
        }
        .ticker-move { display: inline-block; white-space: nowrap; padding-right: 100%; animation: ticker 75s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }
        @keyframes ticker { 0% { transform: translate3d(1920px, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .ticker-item { display: inline-flex; align-items: center; gap: 0.85rem; font-size: 1.1rem; font-weight: 700; color: white; margin-right: 3.5rem; letter-spacing: 0.03em; }
        .t-badge { padding: 0.25rem 0.65rem; border-radius: 8px; font-size: 0.85rem; font-weight: 800; }
        .t-live { background: #10B981; color: #022C22; }
        .t-reg { background: #3B82F6; color: #1E3A8A; }
        .t-val { background: #F59E0B; color: #451A03; }

        /* Custom Slides */

    <script>
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- DYNAMIC SCREEN FIT SCALER (4K, 1080p, 720p, mobile, iframe) ---
        function autoScaleDisplay() {
            const stage = document.getElementById('display-stage');
            if (!stage) return;

            const targetW = 1920;
            const targetH = 1080;
            const winW = window.innerWidth;
            const winH = window.innerHeight;

            const scaleX = winW / targetW;
            const scaleY = winH / targetH;
            const scale = Math.min(scaleX, scaleY);

            stage.style.transform = `scale(${scale})`;
            stage.style.left = `${(winW - (targetW * scale)) / 2}px`;
            stage.style.top = `${(winH - (targetH * scale)) / 2}px`;
        }

        window.addEventListener('resize', autoScaleDisplay);
        window.addEventListener('orientationchange', autoScaleDisplay);

        // --- GLOBALS ---
        let displaySettings = {};
        let systemBranding = {};
        let slideTimer = null;
        let flashTimer = null;
        let isStardustRunning = false;
        let systemSettings = { thresholds: { aplus: 90, a: 70, b: 60, c: 50 }, points_solo: { aplus: 8, a: 7, b: 5, c: 3 }, points_small: { aplus: 12, a: 10, b: 7, c: 5 }, points_large: { aplus: 15, a: 12, b: 10, c: 7 }, pos_points: { p1: 3, p2: 2, p3: 1 } };        
        
        let allTeams = [];
        let calculatedTeamScores = {};
        let activeSlides = [];
        let currentSlide = 0;
        
        let lastActionTimestamp = 0;
        let lastPublishedCount = 0;
        let currentPodiumCompId = null;
        
        let globalActiveEvents = [];
        let globalPublishedComps = [];
        let latestCompResults = [];
        
        const isPreviewMode = new URLSearchParams(window.location.search).get('preview') === 'true';

        const qrInstance = new QRCode(document.getElementById('display-qr'), { 
            text: window.location.origin + '/spectator.html', 
            width: 85, height: 85, colorDark: "#0F172A", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L 
        });

        setInterval(() => { 
            const clockEl = document.getElementById('live-clock');
            if (clockEl) clockEl.innerText = new Date().toLocaleTimeString('en-US', { hour12: false }); 
        }, 1000);

        // --- STARDUST CANVAS PARTICLES ENGINE ---
        const stardustCanvas = document.getElementById('stardust-canvas');
        const stardustCtx = stardustCanvas ? stardustCanvas.getContext('2d') : null;
        let stardustParticles = [];

        function initStardustCanvas() {
            if (!stardustCanvas) return;
            stardustCanvas.width = 1920;
            stardustCanvas.height = 1080;
            stardustParticles = [];
            for (let i = 0; i < 80; i++) {
                stardustParticles.push({
                    x: Math.random() * 1920,
                    y: Math.random() * 1080,
                    size: Math.random() * 3 + 0.8,
                    speedY: Math.random() * 0.45 + 0.15,
                    speedX: (Math.random() - 0.5) * 0.35,
                    opacity: Math.random() * 0.75 + 0.25,
                    gold: Math.random() > 0.35
                });
            }
        }

        function animateStardust() {
            if (!stardustCtx || !document.body.classList.contains('bg-golden-stardust')) {
                isStardustRunning = false;
                return;
            }
            isStardustRunning = true;
            stardustCtx.clearRect(0, 0, 1920, 1080);
            stardustParticles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;
                if (p.y < 0) p.y = 1080;
                if (p.x < 0) p.x = 1920;
                if (p.x > 1920) p.x = 0;

                stardustCtx.fillStyle = p.gold ? `rgba(245, 158, 11, ${p.opacity})` : `rgba(255, 255, 255, ${p.opacity * 0.9})`;
                stardustCtx.beginPath();
                stardustCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                stardustCtx.fill();
            });
            requestAnimationFrame(animateStardust);
        }

        function applyDisplayBranding(brandData) {
            if (!brandData) return;
            systemBranding = brandData;
            const validName = systemBranding.fest_name && systemBranding.fest_name.trim() !== '';
            const validLogo = systemBranding.fest_logo && systemBranding.fest_logo.trim() !== '';
            const displayMode = systemBranding.display_mode || 'both';

            // 1. Dynamic Page Title
            document.title = validName ? `${systemBranding.fest_name} | Live Display` : 'Live Display';

            // 2. Global Favicon Injection (Dynamically inject uploaded Fest Logo as Favicon)
            if (validLogo) {
                let iconLinks = document.querySelectorAll("link[rel~='icon']");
                if (iconLinks.length === 0) {
                    let newIcon = document.createElement('link');
                    newIcon.rel = 'icon';
                    document.head.appendChild(newIcon);
                    iconLinks = [newIcon];
                }
                iconLinks.forEach(link => link.href = systemBranding.fest_logo);
            }

            // 3. Header Branding Area
            const brandContainer = document.getElementById('branding-header-left');
            if (brandContainer) {
                let brandHtml = '';
                if (displayMode === 'logo' && validLogo) {
                    brandHtml = `<img src="${systemBranding.fest_logo}" style="height: 60px; object-fit: contain;">`;
                } else if (displayMode === 'name' && validName) {
                    brandHtml = `<h1 class="theme-font" style="font-size: 2.2rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em;">${systemBranding.fest_name}</h1>`;
                } else {
                    const logoPart = validLogo ? `<img src="${systemBranding.fest_logo}" style="height: 60px; object-fit: contain; margin-right: 15px;">` : '';
                    const namePart = validName ? `<h1 class="theme-font" style="font-size: 2.2rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em;">${systemBranding.fest_name}</h1>` : '';
                    brandHtml = `<div style="display:flex; align-items:center;">${logoPart}${namePart}</div>`;
                }
                brandContainer.innerHTML = brandHtml;
            }
        }

        async function fetchDisplayData() {
            try {
                // Strict Branding Injection & Favicon Sync
                const { data: brandData } = await supabaseClient.from('settings').select('value').eq('id', 'system_branding').maybeSingle();
                if (brandData && brandData.value) {
                    applyDisplayBranding(brandData.value);
                }

                const { data: set_data } = await supabaseClient.from('settings').select('value').eq('id', 'point_system').maybeSingle();        
                if (set_data && set_data.value) systemSettings = set_data.value;

                // Handle Display Settings & Custom Slides
                const { data: displayData } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                let customSlidesArray = [];

                if (displayData && displayData.value) {
                    displaySettings = displayData.value;
                    document.documentElement.style.setProperty('--slide-duration', `${displaySettings.slide_duration || 12}s`);
                    
                    const bgStyle = displaySettings.bg_style || 'cyber_aurora';
                    document.body.className = `trans-${displaySettings.transition || 'fade'} bg-${bgStyle.replace('_', '-')}`;
                    if (bgStyle === 'golden_stardust' && !isStardustRunning) {
                        initStardustCanvas();
                        animateStardust();
                    }
                    
                    if (displaySettings.primary_color) {
                        document.documentElement.style.setProperty('--primary', displaySettings.primary_color);
                        const hex = displaySettings.primary_color.replace('#','');
                        const r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
                        document.documentElement.style.setProperty('--primary-glow', `rgba(${r},${g},${b},0.6)`);
                    }
                    if (displaySettings.font_family) {
                        const fontString = `"${displaySettings.font_family}", sans-serif`;
                        document.body.style.fontFamily = fontString;
                        document.querySelectorAll('.theme-font, .slide-title, .lb-team, .p-name').forEach(el => el.style.fontFamily = fontString);
                    }

                    if (displaySettings.custom_slides && Array.isArray(displaySettings.custom_slides)) {
                        customSlidesArray = displaySettings.custom_slides.filter(s => s.enabled !== false);
                    }
                }

                const { data: teams } = await supabaseClient.from('teams').select('*');
                allTeams = teams || [];
                calculatedTeamScores = {};
                allTeams.forEach(t => calculatedTeamScores[t.id] = { name: t.name, score: 0 });

                const { data: allComps } = await supabaseClient.from('competitions')
                    .select('*, categories(name), stages(name), participant_competitions(count)')
                    .order('updated_at', { ascending: false });

                // Fetch all participant enrollments to obtain full group rosters
                const { data: allCompEnrollments } = await supabaseClient
                    .from('participant_competitions')
                    .select('competition_id, is_leader, participant_id, participants(id, name, unique_id, team_id)')
                    .order('is_leader', { ascending: false });

                globalPublishedComps = (allComps || []).filter(c => c.status === 'published');
                globalActiveEvents = (allComps || []).filter(c => ['ongoing', 'registration', 'valuation', 'pending'].includes(c.status));
                
                if (globalPublishedComps.length > lastPublishedCount && lastPublishedCount !== 0 && !isPreviewMode) fireConfetti();
                lastPublishedCount = globalPublishedComps.length;

                // --- DATA PROCESSING ---
                const { data: schedReq } = await supabaseClient.from('settings').select('value').eq('id', 'master_schedule').maybeSingle();
                const scheduleData = schedReq?.value || {};
                
                const { data: judgements } = await supabaseClient.from('judgements')
                    .select('competition_id, awarded_mark, participant_id, participants(id, name, team_id, unique_id)')
                    .not('participant_id', 'is', null).not('awarded_mark', 'is', null);

                // Core Point Engine
                const compGroups = {};
                (judgements || []).forEach(j => {
                    if (!j.participants || !j.participants.id) return; 
                    const comp = globalPublishedComps.find(c => c.id === j.competition_id);
                    if(!comp) return; 
                    if(!compGroups[j.competition_id]) compGroups[j.competition_id] = { participants: {}, comp_data: comp };
                    const pId = j.participants.id;
                    if(!compGroups[j.competition_id].participants[pId]) compGroups[j.competition_id].participants[pId] = { participant: j.participants, marks_array: [] };
                    compGroups[j.competition_id].participants[pId].marks_array.push(parseFloat(j.awarded_mark));
                });

                latestCompResults = [];

                for (const [compId, compData] of Object.entries(compGroups)) {
                    const isGroup = !!compData.comp_data.is_group;
                    const limit = compData.comp_data.max_participants || 1;
                    const sizeCat = limit >= 4 ? 'large' : (limit >= 2 ? 'small' : 'solo');
                    const registeredCount = compData.comp_data.participant_competitions?.[0]?.count || 0;
                    const eligibleForPosPts = registeredCount >= 3;

                    const participantsArr = Object.values(compData.participants).map(p => {
                        let sortedMarks = p.marks_array.sort((a, b) => a - b);
                        if (sortedMarks.length >= 3) sortedMarks = sortedMarks.slice(1, sortedMarks.length - 1); 
                        const sum = sortedMarks.reduce((a, b) => a + b, 0);
                        p.score = sum / sortedMarks.length;
                        return p;
                    }).sort((a, b) => b.score - a.score);

                    let currentRank = 1;
                    let previousScore = -1;
                    let compPodium = [];

                    participantsArr.forEach((entry, idx) => {
                        if (entry.score !== previousScore) currentRank = idx + 1; 
                        entry.position = currentRank;
                        previousScore = entry.score;

                        let percent = (entry.score / (compData.comp_data.max_mark || 100)) * 100;
                        let gradePts = 0; let posPts = 0;

                        if (percent >= 50) {
                            if (percent >= systemSettings.thresholds.aplus) gradePts = systemSettings[`points_${sizeCat}`].aplus;
                            else if (percent >= systemSettings.thresholds.a) gradePts = systemSettings[`points_${sizeCat}`].a;
                            else if (percent >= systemSettings.thresholds.b) gradePts = systemSettings[`points_${sizeCat}`].b;
                            else gradePts = systemSettings[`points_${sizeCat}`].c;
                        }
                        if (eligibleForPosPts && currentRank <= 3) {
                            if (currentRank === 1) posPts = systemSettings.pos_points.p1;
                            else if (currentRank === 2) posPts = systemSettings.pos_points.p2;
                            else if (currentRank === 3) posPts = systemSettings.pos_points.p3;
                        }

                        const teamId = entry.participant.team_id;
                        const teamName = allTeams.find(t => t.id === teamId)?.name || 'IND';
                        if (teamId && calculatedTeamScores[teamId]) {
                            calculatedTeamScores[teamId].score += (Number(gradePts) + Number(posPts)); 
                        }

                        if (currentRank <= 3) {
                            // Collect ALL participants in this group from this team
                            const teamGroupMembers = isGroup
                                ? (allCompEnrollments || [])
                                    .filter(pc => String(pc.competition_id) === String(compId) && String(pc.participants?.team_id) === String(teamId))
                                    .map(pc => ({ name: pc.participants?.name, is_leader: !!pc.is_leader }))
                                : [];

                            compPodium.push({ 
                                rank: currentRank, 
                                name: isGroup && teamGroupMembers.length > 0 ? `${teamName} SQUAD` : entry.participant.name, 
                                team: teamName,
                                is_group: isGroup,
                                members: teamGroupMembers
                            });
                        }
                    });

                    if (globalPublishedComps[0] && compId === globalPublishedComps[0].id) {
                        latestCompResults = compPodium;
                        currentPodiumCompId = compId;
                    }
                }

                // --- BUILD PLAYLIST ---
                buildPlaylist(scheduleData, customSlidesArray);

            } catch (error) { console.error("Display Fetch Error:", error); }
        }

        // --- DYNAMIC PAGINATED PLAYLIST BUILDER ---
        function buildPlaylist(scheduleData, customSlidesArray) {
            activeSlides = [];
            const container = document.getElementById('slide-container');
            container.innerHTML = '';

                                                </defs>
                                                <path d="M22 65 C18 45 30 25 50 18 C45 28 48 40 54 48 C42 46 32 52 28 62 Z" fill="url(#p1Grad)" opacity="0.95"/>
                                                <path d="M98 65 C102 45 90 25 70 18 C75 28 72 40 66 48 C78 46 88 52 92 62 Z" fill="url(#p1Grad)" opacity="0.95"/>
                                                <path d="M20 75 C15 90 32 105 52 108 C46 98 48 88 52 78 C40 82 28 80 22 75 Z" fill="url(#p1Grad)" opacity="0.95"/>
                                                <path d="M100 75 C105 90 88 105 68 108 C74 98 72 88 68 78 C80 82 92 80 98 75 Z" fill="url(#p1Grad)" opacity="0.95"/>

                                            <div class="pos-badge-ribbon gold-ribbon">CHAMPION</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- RANK 2 (SILVER) -->
                                <div class="v-podium-card p2">

        function updateLiveTicker(activeEvents, publishedComps) {
            const track = document.getElementById('live-ticker-track');
            let tickerHtml = '';
            
            activeEvents.filter(c => c.status === 'ongoing').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-live">LIVE ON STAGE</span> ${c.name} (${c.stages?.name || 'MAIN STAGE'})</div>`; });
            activeEvents.filter(c => c.status === 'valuation').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-val">IN VALUATION</span> ${c.name}</div>`; });
            if(publishedComps.length > 0) { tickerHtml += `<div class="ticker-item"><span class="t-badge" style="background:var(--primary); color:white;">LATEST RESULT</span> ${publishedComps[0].name}</div>`; }
            activeEvents.filter(c => c.status === 'registration').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-reg">CALLING NOW</span> ${c.name}</div>`; });
            
            if(tickerHtml === '') tickerHtml = '<div class="ticker-item">WELCOME TO ZENITH FEST BROADCAST • LIVE NETWORK SYNCED</div>';
            track.innerHTML = tickerHtml + tickerHtml;
        }

        function updateDynamicQR(slideId, customUrl = null, customText = null) {
            let targetUrl = displaySettings.qr_url && displaySettings.qr_url.trim() !== '' ? displaySettings.qr_url : (window.location.origin + '/spectator.html');

            }

            if (customUrl) {
                targetUrl = customUrl;
                mainText = customText || 'SCAN TO VISIT';
                subText = 'EXTERNAL LINK';
            } else if (displaySettings.qr_preset === 'custom' && displaySettings.qr_url) {
                targetUrl = displaySettings.qr_url;
                mainText = displaySettings.qr_title || 'SCAN FOR INFO';
                subText = displaySettings.qr_subtitle || 'POINT YOUR CAMERA';

                targetUrl = window.location.origin + '/display.html?mode=schedule';

                subText = displaySettings.qr_subtitle || 'STAGE TIMINGS & DETAILS';

        // --- FEST MILESTONES CALCULATOR ---
        function updateMilestonesWidget(totalCompsCount, completedCompsCount) {
            const widget = document.getElementById('fest-milestones-widget');
            if (!widget) return;

            if (displaySettings.show_milestones === false) {
                widget.style.display = 'none';
                return;
            }

            widget.style.display = 'flex';
            const total = Math.max(1, totalCompsCount || 0);
            const completed = completedCompsCount || 0;
            const percent = Math.min(100, Math.round((completed / total) * 100));
            const medalsTotal = completed * 3;

            document.getElementById('ms-percent').innerText = `${percent}%`;
            document.getElementById('ms-bar-fill').style.width = `${percent}%`;
            document.getElementById('ms-counts').innerText = `(${completed}/${total})`;
            document.getElementById('ms-medals').innerText = `${medalsTotal}`;
        }

        // --- FAST POLLING & REAL-TIME REMOTE ACTION ENGINE ---
        async function pollLiveTriggers() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                if (!data || !data.value) return;
                
                const newSettings = data.value;
                const requiresPlaylistRebuild = JSON.stringify(displaySettings.custom_slides) !== JSON.stringify(newSettings.custom_slides);

                displaySettings = newSettings;
                
                // 1. Theme Color & Transitions
                document.documentElement.style.setProperty('--primary', displaySettings.primary_color || '#3B82F6');
                const hex = (displaySettings.primary_color || '#3B82F6').replace('#','');
                const r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
                document.documentElement.style.setProperty('--primary-glow', `rgba(${r},${g},${b},0.5)`);
                document.body.style.fontFamily = `"${displaySettings.font_family || 'Plus Jakarta Sans'}", sans-serif`;

                // 2. Ambient Background Style
                const bgStyle = displaySettings.bg_style || 'cyber_aurora';
                document.body.className = `trans-${displaySettings.transition || 'fade'} bg-${bgStyle.replace('_', '-')}`;
                if (bgStyle === 'golden_stardust') {
                    if (!isStardustRunning) { initStardustCanvas(); animateStardust(); }
                }

                // 3. Stage Blackout State
                if (displaySettings.blackout) {
                    document.body.classList.add('blackout-active');
                } else {
                    document.body.classList.remove('blackout-active');
                }

                // 4. Pinned Slide State
                const pinnedBadge = document.getElementById('pinned-badge');
                if (displaySettings.pinned_slide) {
                    if (pinnedBadge) {
                        pinnedBadge.style.display = 'flex';
                        pinnedBadge.querySelector('span').innerText = `PINNED: ${displaySettings.pinned_slide.replace('slide-','').toUpperCase()}`;
                    }
                    const targetEl = document.getElementById(displaySettings.pinned_slide);
                    if (targetEl && !targetEl.classList.contains('active')) {
                        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
                        targetEl.classList.add('active');
                        clearTimeout(slideTimer);
                        document.getElementById('progress')?.classList.remove('animating');
                    }
                } else {
                    if (pinnedBadge) pinnedBadge.style.display = 'none';
                }

                // 5. Process Live Remote Actions
                if (displaySettings.live_action && displaySettings.live_action.timestamp > lastActionTimestamp) {
                    lastActionTimestamp = displaySettings.live_action.timestamp;
                    const action = displaySettings.live_action;
                    
                    if (action.type === 'confetti') {
                        document.getElementById('sfx-applause')?.play().catch(()=>{});
                        fireConfetti();
                    } 
                    else if (action.type === 'next_slide') {
                        clearTimeout(slideTimer);
                        rotateSlides();
                    }
                    else if (action.type === 'prev_slide') {
                        clearTimeout(slideTimer);
                        currentSlide = (currentSlide - 2 + activeSlides.length) % activeSlides.length;
                        rotateSlides();
                    }
                    else if (action.type === 'pause') {
                        clearTimeout(slideTimer);
                        document.getElementById('progress')?.classList.remove('animating');
                    }
                    else if (action.type === 'resume') {
                        rotateSlides();
                    }
                    else if (action.type === 'pin') {
                        const targetEl = document.getElementById(action.target_slide);
                        if (targetEl) {
                            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
                            targetEl.classList.add('active');
                            clearTimeout(slideTimer);
                            document.getElementById('progress')?.classList.remove('animating');
                        }
                    }
                    else if (action.type === 'unpin') {
                        rotateSlides();
                    }
                    else if (action.type === 'flash_alert') {
                        document.getElementById('sfx-alert')?.play().catch(()=>{});
                        const alertDiv = document.getElementById('flash-alert');
                        document.getElementById('flash-msg').innerText = action.message || "ATTENTION PLEASE";
                        alertDiv.style.display = 'flex';
                        clearTimeout(slideTimer); 
                        clearTimeout(flashTimer);
                        
                        const dur = action.duration && action.duration > 0 ? action.duration * 1000 : 0;
                        if (dur > 0) {
                            flashTimer = setTimeout(() => {
                                alertDiv.style.display = 'none';
                                rotateSlides(); 
                            }, dur);
                        }
                    }
                    else if (action.type === 'clear_flash') {
                        clearTimeout(flashTimer);
                        const alertDiv = document.getElementById('flash-alert');
                        if (alertDiv) alertDiv.style.display = 'none';
                        rotateSlides();
                    }
                }

                if (requiresPlaylistRebuild) fetchDisplayData(); 

            } catch (e) { console.error("Polling error:", e); }
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 6, angle: 60, spread: 60, origin: { x: 0 },
                    colors: ['#FBBF24', '#3B82F6', '#10B981', '#FFFFFF']
                });
                confetti({
                    particleCount: 6, angle: 120, spread: 60, origin: { x: 1 },
                    colors: ['#FBBF24', '#3B82F6', '#10B981', '#FFFFFF']
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // --- SLIDE ROTATION ENGINE ---
        function rotateSlides() {
            if (activeSlides.length === 0) return;
            if (displaySettings.pinned_slide || displaySettings.is_paused) return; // Halt if pinned or paused

            if (currentSlide >= activeSlides.length) currentSlide = 0;

            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            const activeSlideId = activeSlides[currentSlide];
            const slideEl = document.getElementById(activeSlideId);
            if (slideEl) slideEl.classList.add('active');
            
            // Extract Custom Data Attributes (if any)
            const customDuration = slideEl ? parseInt(slideEl.getAttribute('data-duration')) : null;
            const customQrUrl = slideEl ? slideEl.getAttribute('data-qr-url') : null;
            const customQrText = slideEl ? slideEl.getAttribute('data-qr-text') : null;
            const customTicker = slideEl ? slideEl.getAttribute('data-ticker') : null;

            // Determine Timing
            const defaultDurationSecs = parseInt(displaySettings.slide_duration) || 12;
            const durationSecs = customDuration && customDuration > 0 ? customDuration : defaultDurationSecs;
            const durationMs = durationSecs * 1000;

            // Apply Dynamic QR
            if (customQrUrl) {
                updateDynamicQR(activeSlideId, customQrUrl, customQrText);
            } else {
                updateDynamicQR(activeSlideId);
            }

            // Render Ticker Data
            const track = document.getElementById('live-ticker-track');
            if (customTicker && customTicker.trim() !== '') {
                const html = `<div class="ticker-item"><span class="t-badge" style="background:var(--primary); color:white;">ANNOUNCEMENT</span> ${customTicker}</div>`;
                track.innerHTML = html + html + html + html; 
            } else if (typeof displaySettings.global_ticker === 'string' && displaySettings.global_ticker.trim() !== '') {
                const html = `<div class="ticker-item"><span class="t-badge" style="background:var(--primary); color:white;">ANNOUNCEMENT</span> ${displaySettings.global_ticker}</div>`;
                track.innerHTML = html + html + html + html; 
            } else {
                updateLiveTicker(globalActiveEvents, globalPublishedComps); 
            }

            // Update Milestones Progress
            updateMilestonesWidget((globalActiveEvents.length + globalPublishedComps.length), globalPublishedComps.length);

            // Animate Progress Bar
            const progressBar = document.getElementById('progress');
            if (progressBar) {
                progressBar.classList.remove('animating');
                void progressBar.offsetWidth; 
                progressBar.style.transition = `width ${durationSecs}s linear`;
                progressBar.classList.add('animating');
            }
            
            currentSlide++;
            if (currentSlide >= activeSlides.length) {
                currentSlide = 0;
                fetchDisplayData(); 
                return;
            }

            clearTimeout(slideTimer);
            slideTimer = setTimeout(rotateSlides, durationMs);
        }

        // --- PRESENTER KEYBOARD SHORTCUTS ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                displaySettings.is_paused = !displaySettings.is_paused;
                if (displaySettings.is_paused) {
                    clearTimeout(slideTimer);
                    document.getElementById('progress')?.classList.remove('animating');
                } else {
                    rotateSlides();
                }
            } else if (e.code === 'ArrowRight') {
                clearTimeout(slideTimer);
                rotateSlides();
            } else if (e.code === 'ArrowLeft') {
                clearTimeout(slideTimer);
                currentSlide = (currentSlide - 2 + activeSlides.length) % activeSlides.length;
                rotateSlides();
            } else if (e.code === 'KeyF') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            } else if (e.code === 'KeyB') {
                document.body.classList.toggle('blackout-active');
            } else if (e.code === 'KeyC') {
                fireConfetti();
            }
        });

        // --- INSTANT ZERO-LATENCY WINDOW MESSAGE RECEIVER (PREVIEW & REAL-TIME SYNC) ---
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            
            // 1. Instant Theme & Styling Update
            if (event.data.type === 'theme_update' && event.data.settings) {
                const s = event.data.settings;
                displaySettings = { ...displaySettings, ...s };
                
                if (s.primary_color) {
                    document.documentElement.style.setProperty('--primary', s.primary_color);
                    const hex = s.primary_color.replace('#','');
                    const r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
                    document.documentElement.style.setProperty('--primary-glow', `rgba(${r},${g},${b},0.5)`);
                }
                
                if (s.font_family) {
                    document.body.style.fontFamily = `"${s.font_family}", sans-serif`;
                    document.querySelectorAll('.theme-font, .slide-title, .lb-team, .p-name').forEach(el => el.style.fontFamily = `"${s.font_family}", sans-serif`);
                }
                
                const bgStyle = s.bg_style || 'cyber_aurora';
                document.body.className = `trans-${s.transition || 'fade'} bg-${bgStyle.replace(/_/g, '-')}`;
                if (bgStyle === 'golden_stardust') {
                    if (!isStardustRunning) { initStardustCanvas(); animateStardust(); }
                }
                
                if (s.slide_duration) {
                    document.documentElement.style.setProperty('--slide-duration', `${s.slide_duration}s`);
                }
                
                if (s.show_milestones !== undefined) {
                    const mw = document.getElementById('fest-milestones-widget');
                    if (mw) mw.style.display = s.show_milestones ? 'flex' : 'none';
                }
                
                if (s.show_qr !== undefined) {
                    const qw = document.getElementById('qr-widget');
                    if (qw) qw.style.display = s.show_qr ? 'flex' : 'none';
                }
                
                if (s.qr_preset || s.qr_url) {
                    updateDynamicQR(activeSlides[currentSlide] || 'slide-podium');
                }
            }

            // 2. Instant Remote Action Receiver
            if (event.data.type === 'display_action' && event.data.action) {
                const action = event.data.action;
                if (action.type === 'confetti') {
                    document.getElementById('sfx-applause')?.play().catch(()=>{});
                    fireConfetti();
                } else if (action.type === 'next_slide') {
                    clearTimeout(slideTimer);
                    rotateSlides();
                } else if (action.type === 'prev_slide') {
                    clearTimeout(slideTimer);
                    currentSlide = (currentSlide - 2 + activeSlides.length) % activeSlides.length;
                    rotateSlides();
                } else if (action.type === 'pause') {
                    displaySettings.is_paused = true;
                    clearTimeout(slideTimer);
                    document.getElementById('progress')?.classList.remove('animating');
                } else if (action.type === 'resume') {
                    displaySettings.is_paused = false;
                    rotateSlides();
                } else if (action.type === 'blackout') {
                    if (action.blackout) document.body.classList.add('blackout-active');
                    else document.body.classList.remove('blackout-active');
                } else if (action.type === 'pin') {
                    const targetEl = document.getElementById(action.target_slide);
                    if (targetEl) {
                        displaySettings.pinned_slide = action.target_slide;
                        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
                        targetEl.classList.add('active');
                        clearTimeout(slideTimer);
                        document.getElementById('progress')?.classList.remove('animating');
                        const pb = document.getElementById('pinned-badge');
                        if (pb) {
                            pb.style.display = 'flex';
                            pb.querySelector('span').innerText = `PINNED: ${action.target_slide.replace('slide-','').toUpperCase()}`;
                        }
                    }
                } else if (action.type === 'unpin') {
                    displaySettings.pinned_slide = null;
                    const pb = document.getElementById('pinned-badge');
                    if (pb) pb.style.display = 'none';
                    rotateSlides();
                } else if (action.type === 'flash_alert') {
                    document.getElementById('sfx-alert')?.play().catch(()=>{});
                    const alertDiv = document.getElementById('flash-alert');
                    document.getElementById('flash-msg').innerText = action.message || "ATTENTION PLEASE";
                    alertDiv.style.display = 'flex';
                    clearTimeout(slideTimer); 
                    clearTimeout(flashTimer);
                    const dur = action.duration && action.duration > 0 ? action.duration * 1000 : 0;
                    if (dur > 0) {
                        flashTimer = setTimeout(() => {
                            alertDiv.style.display = 'none';
                            rotateSlides(); 
                        }, dur);
                    }
                } else if (action.type === 'clear_flash') {
                    clearTimeout(flashTimer);
                    const alertDiv = document.getElementById('flash-alert');
                    if (alertDiv) alertDiv.style.display = 'none';
                    rotateSlides();
                }
            }
        });

        // Fast initial branding & favicon injection
        (async function initQuickBranding() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'system_branding').maybeSingle();
                if (data && data.value) applyDisplayBranding(data.value);
            } catch(e) {}
        })();

        // Initialize display and scaling
        autoScaleDisplay();
        fetchDisplayData().then(() => {
            autoScaleDisplay();
            setInterval(pollLiveTriggers, 2000); 
        });
    </script>
</body>
</html>
