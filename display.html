<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;500;700;800;900&family=Bebas+Neue&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.6);
            --bg-dark: #050810;
            --surface: rgba(15, 23, 42, 0.65);
            --surface-border: rgba(255, 255, 255, 0.08);
            --gold: #FBBF24; --gold-glow: rgba(251, 191, 36, 0.4);
            --silver: #94A3B8; --bronze: #D97706;
            --slide-duration: 12s; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; text-transform: uppercase; }
        
        body { background: var(--bg-dark); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 1s ease; }

        .ambient-bg { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
        .grid-overlay {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.45; animation: float 25s infinite alternate ease-in-out; transition: background 1s ease;}
        .orb-1 { background: var(--primary); width: 65vw; height: 65vw; top: -20%; left: -10%; }
        .orb-2 { background: rgba(236, 72, 153, 0.4); width: 55vw; height: 55vw; bottom: -15%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5%, 10%) scale(1.15); } }

        .header { padding: 1.5rem 3rem; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(5, 8, 16, 0.95), transparent); z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 1.5rem; }
        .header-right { display: flex; align-items: center; gap: 2rem; }
        .clock { font-family: 'Inter', sans-serif; font-size: 1.5rem; font-weight: 800; color: rgba(255,255,255,0.9); letter-spacing: 2px; }
        .live-badge { background: rgba(225, 29, 72, 0.15); color: #FDA4AF; padding: 0.5rem 1.25rem; border-radius: 50px; border: 1px solid rgba(225, 29, 72, 0.4); font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 0 20px rgba(225, 29, 72, 0.2); }
        .live-dot { width: 12px; height: 12px; background: #FDA4AF; border-radius: 50%; animation: pulse 1.5s infinite; box-shadow: 0 0 10px #FDA4AF; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }

        .slide-container { flex: 1; position: relative; padding: 1.5rem 3rem 4rem 3rem; display: flex; flex-direction: column; overflow: hidden; }
        .slide { position: absolute; inset: 0; padding: 1.5rem 3rem; opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease; display: flex; flex-direction: column; pointer-events: none; transform: scale(0.98); }
        .slide.active { opacity: 1; pointer-events: all; transform: scale(1); }
        .slide-title { font-size: 3.2rem; color: #FFFFFF; margin-bottom: 1.5rem; text-shadow: 0 10px 30px rgba(0,0,0,0.8); letter-spacing: -1px; text-align: center; flex-shrink: 0; z-index: 10; position: relative; }
        .page-indicator { font-size: 1.5rem; color: rgba(255,255,255,0.4); vertical-align: middle; margin-left: 1rem; font-weight: 600; }

        /* --- VERTICAL PODIUM LAYOUT --- */
        .results-layout { display: flex; align-items: center; justify-content: flex-start; width: 100%; height: 100%; padding-left: 5rem; }
        .v-podium-stack { display: flex; flex-direction: column; gap: 1.5rem; width: 600px; }
        
        .v-podium-card { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); transform: scale(1); transition: transform 0.5s; opacity: 0; transform: translateX(-50px); }
        .slide.active .v-podium-card { opacity: 1; transform: translateX(0); }
        
        .v-podium-card.p1 { transform: scale(1.05); z-index: 10; box-shadow: 0 20px 50px var(--gold-glow); border: 2px solid rgba(251,191,36,0.6); }
        .v-podium-card.p2 { border: 1px solid rgba(148,163,184,0.4); }
        .v-podium-card.p3 { border: 1px solid rgba(217,119,6,0.4); }
        
        .slide.active .v-podium-card.p2 { transition-delay: 0.1s; }
        .slide.active .v-podium-card.p1 { transition-delay: 0.4s; transform: scale(1.05); }
        .slide.active .v-podium-card.p3 { transition-delay: 0.7s; }

        .v-card-top { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); padding: 1.5rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .v-card-bottom { padding: 1rem; text-align: center; display: flex; justify-content: center; align-items: center; gap: 1rem; }
        
        .p1 .v-card-bottom { background: linear-gradient(90deg, #92400E, var(--gold), #92400E); }
        .p2 .v-card-bottom { background: linear-gradient(90deg, #334155, var(--silver), #334155); }
        .p3 .v-card-bottom { background: linear-gradient(90deg, #78350F, var(--bronze), #78350F); }
        
        .v-rank-num { font-size: 3.5rem; font-weight: 900; color: white; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .v-name { font-size: 1.6rem; font-weight: 800; color: white; margin-bottom: 0.25rem; }
        .v-team { font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
        .p1 .v-name { font-size: 2.2rem; }
        
        /* --- LEADERBOARD & SCHEDULE --- */
        .leaderboard { display: flex; flex-direction: column; gap: 1rem; max-width: 1300px; margin: 0 auto; width: 100%; }
        .lb-row { background: var(--surface); border: 1px solid var(--surface-border); padding: 1rem 2.5rem; border-radius: 16px; display: flex; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); opacity: 0; transform: translateX(-30px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide.active .lb-row { opacity: 1; transform: translateX(0); }
        .slide.active .lb-row:nth-child(1) { transition-delay: 0.1s; } .slide.active .lb-row:nth-child(2) { transition-delay: 0.2s; }
        .slide.active .lb-row:nth-child(3) { transition-delay: 0.3s; } .slide.active .lb-row:nth-child(4) { transition-delay: 0.4s; }
        .slide.active .lb-row:nth-child(5) { transition-delay: 0.5s; } .slide.active .lb-row:nth-child(6) { transition-delay: 0.6s; }
        
        .lb-row.gold { border-left: 8px solid var(--gold); background: linear-gradient(90deg, rgba(251,191,36,0.15), var(--surface)); transform: scale(1.02); box-shadow: 0 20px 40px var(--gold-glow); z-index: 10; }
        .lb-row.silver { border-left: 8px solid var(--silver); background: linear-gradient(90deg, rgba(148,163,184,0.1), var(--surface)); }
        .lb-row.bronze { border-left: 8px solid var(--bronze); background: linear-gradient(90deg, rgba(217,119,6,0.1), var(--surface)); }
        
        .lb-rank { font-size: 2.2rem; font-weight: 800; width: 80px; color: rgba(255,255,255,0.4); }
        .lb-row.gold .lb-rank { color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
        .lb-team { flex: 1; font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; color: #FFFFFF; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .lb-score { font-size: 3.2rem; font-weight: 800; color: white; display: flex; align-items: baseline; gap: 0.5rem; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .lb-score span { font-size: 1.2rem; color: rgba(255,255,255,0.6); font-weight: 700; }

        .qr-widget { position: fixed; bottom: 4.5rem; right: 2rem; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.15); padding: 1rem; border-radius: 16px; display: flex; align-items: center; gap: 1rem; backdrop-filter: blur(20px); z-index: 100; box-shadow: 0 15px 40px rgba(0,0,0,0.6); transition: all 0.5s ease; animation: floatQR 6s infinite ease-in-out; }
        @keyframes floatQR { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .qr-text-block { display: flex; flex-direction: column; gap: 0.2rem; max-width: 130px; }
        .qr-widget span { font-size: 0.9rem; font-weight: 800; color: white; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .qr-widget small { font-size: 0.7rem; color: var(--primary); font-weight: 700; letter-spacing: 1px; }
        #display-qr { background: white; padding: 6px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .ticker-wrap { position: fixed; bottom: 0; left: 0; width: 100%; height: 3rem; background: #0F172A; border-top: 2px solid var(--primary); z-index: 150; overflow: hidden; display: flex; align-items: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .ticker-move { display: inline-block; white-space: nowrap; padding-right: 100%; animation: ticker 40s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }
        @keyframes ticker { 0% { transform: translate3d(100vw, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .ticker-item { display: inline-flex; align-items: center; gap: 0.75rem; font-size: 1rem; font-weight: 800; color: white; margin-right: 3rem; letter-spacing: 1px; }
        .t-badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 800; }
        .t-live { background: #10B981; color: #064E3B; }
        .t-reg { background: #3B82F6; color: #1E3A8A; }
        .t-val { background: #F59E0B; color: #78350F; }

        .progress-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.05); position: fixed; top: 0; left: 0; z-index: 200; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: none; box-shadow: 0 0 15px var(--primary); }
        .progress-bar.animating { transition: width var(--slide-duration) linear; width: 100%; }

        /* Custom Slides */
        .cs-bg { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; filter: brightness(0.6); }
        .cs-content { text-align: center; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
        .cs-title { font-size: 6rem; font-weight: 900; color: var(--primary); text-shadow: 0 10px 30px rgba(0,0,0,0.8); line-height: 1.1; }
        .cs-text { font-size: 3rem; font-weight: 600; line-height: 1.4; max-width: 1400px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); color: #F8FAFC; }

        /* Dynamic Transitions */
        .trans-fade .slide { transition: opacity 1s ease-in-out; }
        .trans-slide .slide { transform: translateX(100%); transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s; opacity: 0; }
        .trans-slide .slide.active { transform: translateX(0); opacity: 1; }
        .trans-slide .slide.exit { transform: translateX(-100%); opacity: 0; }
        .trans-zoom .slide { transform: scale(1.15); transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s; opacity: 0; }
        .trans-zoom .slide.active { transform: scale(1); opacity: 1; }

        /* --- LIVE FLASH ALERT --- */
        #flash-alert {
            position: fixed; inset: 0; background: rgba(225, 29, 72, 0.95); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 4rem; backdrop-filter: blur(20px);
        }
        .flash-text { font-size: 7rem; font-weight: 900; line-height: 1.1; text-shadow: 0 10px 40px rgba(0,0,0,0.6); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.05); opacity: 0.8; } }
    </style>
</head>
<body class="trans-fade" id="app-body">
    <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div class="grid-overlay"></div>

    <div class="progress-bar-container"><div class="progress-bar" id="progress"></div></div>

    <div class="header">
        <div class="header-left" id="branding-header-left"></div>
        <div class="header-right">
            <div class="clock" id="live-clock">00:00:00</div>
            <div class="live-badge"><div class="live-dot"></div> LIVE BROADCAST</div>
        </div>
    </div>

    <!-- Instant Flash Alert Overlay -->
    <div id="flash-alert">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 10rem; margin-bottom: 2rem; color: white;"></i>
        <div class="flash-text" id="flash-msg">ATTENTION PLEASE</div>
    </div>

    <!-- PLAYLIST CONTAINER -->
    <div class="slide-container" id="slide-container">
        <div class="slide active" style="text-align: center; align-items: center; justify-content: center;">
            <i class="fa-solid fa-satellite-dish fa-beat-fade" style="font-size: 6rem; color: var(--primary); margin-bottom: 2rem;"></i>
            <h1 style="font-size: 4rem; font-weight: 800;">ESTABLISHING CONNECTION...</h1>
            <p style="font-size: 2rem; color: var(--text-muted); margin-top: 1rem;">WAITING FOR DATA FROM CONTROL DESK</p>
        </div>
    </div>

    <div id="qr-widget" class="qr-widget">
        <div id="display-qr"></div>
        <div class="qr-text-block">
            <span id="qr-main-text" class="theme-font">SCAN FOR LIVE DATA</span>
            <small id="qr-sub-text">POINT YOUR CAMERA</small>
        </div>
    </div>

    <div class="ticker-wrap" id="ticker-wrap">
        <div class="ticker-move" id="live-ticker-track">
            <div class="ticker-item">SYNCING LIVE DATA TO FESTOS NETWORK...</div>
        </div>
    </div>

    <audio id="sfx-applause" src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg" preload="auto"></audio>
    <audio id="sfx-alert" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- GLOBALS ---
        let displaySettings = {};
        let systemBranding = {};
        let slideTimer = null;
        let systemSettings = { thresholds: { aplus: 90, a: 70, b: 60, c: 50 }, points_solo: { aplus: 8, a: 7, b: 5, c: 3 }, points_small: { aplus: 12, a: 10, b: 7, c: 5 }, points_large: { aplus: 15, a: 12, b: 10, c: 7 }, pos_points: { p1: 3, p2: 2, p3: 1 } };        
        
        let allTeams = [];
        let calculatedTeamScores = {};
        let activeSlides = [];
        let currentSlide = 0;
        
        let lastActionTimestamp = 0;
        let lastPublishedCount = 0;
        let currentPodiumCompId = null;
        
        let globalActiveEvents = [];
        let globalPublishedComps = [];
        let latestCompResults = [];
        
        const isPreviewMode = new URLSearchParams(window.location.search).get('preview') === 'true';

        const qrInstance = new QRCode(document.getElementById('display-qr'), { 
            text: window.location.origin + '/spectator.html', 
            width: 75, height: 75, colorDark: "#0F172A", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L 
        });

        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false }); }, 1000);

        async function fetchDisplayData() {
            try {
                // Strict Branding Injection
                const { data: brandData } = await supabaseClient.from('settings').select('value').eq('id', 'system_branding').maybeSingle();
                if (brandData && brandData.value) {
                    systemBranding = brandData.value;
                    const validName = systemBranding.fest_name && systemBranding.fest_name.trim() !== '';
                    const validLogo = systemBranding.fest_logo && systemBranding.fest_logo.trim() !== '';
                    const displayMode = systemBranding.display_mode || 'both';

                    document.title = validName ? `${systemBranding.fest_name} | Display` : 'Display';

                    if (validLogo) {
                        let allIcons = document.querySelectorAll("link[rel='icon']");
                        if (allIcons.length === 0) {
                            let newIcon = document.createElement('link'); newIcon.rel = 'icon';
                            document.head.appendChild(newIcon); allIcons = [newIcon];
                        }
                        allIcons.forEach(link => { if (link.type === 'image/svg+xml') link.removeAttribute('type'); link.href = systemBranding.fest_logo; });
                    }

                    const headerLeft = document.getElementById('branding-header-left');
                    let html = '';
                    const showLogo = validLogo && (displayMode === 'both' || displayMode === 'logo');
                    const showName = (displayMode === 'both' || displayMode === 'name') || (!validLogo && displayMode === 'logo');
                    
                    if (showLogo) {
                        html += `<img id="fest-logo" src="${systemBranding.fest_logo}" alt="Logo" style="height: 60px; max-width: 200px; object-fit: contain; border-radius: 8px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); display: block;">`;
                    }
                    if (showName && validName) {
                        html += `<h1 id="fest-title" class="theme-font" style="font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; text-shadow: 0 0 25px var(--primary-glow); margin: 0; line-height: 1; color: #FFFFFF;">${systemBranding.fest_name.toUpperCase()}</h1>`;
                    }
                    headerLeft.innerHTML = html;
                }

                const { data: set_data } = await supabaseClient.from('settings').select('value').eq('id', 'point_system').maybeSingle();        
                if (set_data && set_data.value) systemSettings = set_data.value;

                // Handle Display Settings & Custom Slides
                const { data: displayData } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                let customSlidesArray = [];

                if (displayData && displayData.value) {
                    displaySettings = displayData.value;
                    document.documentElement.style.setProperty('--slide-duration', `${displaySettings.slide_duration || 12}s`);
                    document.getElementById('qr-widget').style.opacity = displaySettings.show_qr === false ? '0' : '1';
                    document.getElementById('app-body').className = `trans-${displaySettings.transition || 'fade'}`;
                    
                    if (displaySettings.primary_color) {
                        document.documentElement.style.setProperty('--primary', displaySettings.primary_color);
                        const hex = displaySettings.primary_color.replace('#','');
                        const r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
                        document.documentElement.style.setProperty('--primary-glow', `rgba(${r},${g},${b},0.6)`);
                    }
                    if (displaySettings.font_family) {
                        const fontString = `"${displaySettings.font_family}", sans-serif`;
                        document.body.style.fontFamily = fontString;
                        document.querySelectorAll('.theme-font, .slide-title, .lb-team, .p-name').forEach(el => el.style.fontFamily = fontString);
                    }

                    if (displaySettings.custom_slides && Array.isArray(displaySettings.custom_slides)) {
                        customSlidesArray = displaySettings.custom_slides.filter(s => s.enabled !== false);
                    }
                }

                const { data: teams } = await supabaseClient.from('teams').select('*');
                allTeams = teams || [];
                calculatedTeamScores = {};
                allTeams.forEach(t => calculatedTeamScores[t.id] = { name: t.name, score: 0 });

                const { data: allComps } = await supabaseClient.from('competitions')
                    .select('*, categories(name), stages(name), participant_competitions(count)')
                    .order('updated_at', { ascending: false });

                globalPublishedComps = allComps.filter(c => c.status === 'published');
                globalActiveEvents = allComps.filter(c => ['ongoing', 'registration', 'valuation', 'pending'].includes(c.status));
                
                if (globalPublishedComps.length > lastPublishedCount && lastPublishedCount !== 0 && !isPreviewMode) fireConfetti();
                lastPublishedCount = globalPublishedComps.length;

                // --- DATA PROCESSING ---
                const { data: schedReq } = await supabaseClient.from('settings').select('value').eq('id', 'master_schedule').maybeSingle();
                const scheduleData = schedReq?.value || {};
                
                const { data: judgements } = await supabaseClient.from('judgements')
                    .select('competition_id, awarded_mark, participant_id, participants(id, name, team_id, unique_id)')
                    .not('participant_id', 'is', null).not('awarded_mark', 'is', null);

                // Core Point Engine
                const compGroups = {};
                (judgements || []).forEach(j => {
                    if (!j.participants || !j.participants.id) return; 
                    const comp = globalPublishedComps.find(c => c.id === j.competition_id);
                    if(!comp) return; 
                    if(!compGroups[j.competition_id]) compGroups[j.competition_id] = { participants: {}, comp_data: comp };
                    const pId = j.participants.id;
                    if(!compGroups[j.competition_id].participants[pId]) compGroups[j.competition_id].participants[pId] = { participant: j.participants, marks_array: [] };
                    compGroups[j.competition_id].participants[pId].marks_array.push(parseFloat(j.awarded_mark));
                });

                latestCompResults = [];

                for (const [compId, compData] of Object.entries(compGroups)) {
                    const limit = compData.comp_data.max_participants || 1;
                    const sizeCat = limit >= 4 ? 'large' : (limit >= 2 ? 'small' : 'solo');
                    const registeredCount = compData.comp_data.participant_competitions?.[0]?.count || 0;
                    const eligibleForPosPts = registeredCount >= 3;

                    const participantsArr = Object.values(compData.participants).map(p => {
                        let sortedMarks = p.marks_array.sort((a, b) => a - b);
                        if (sortedMarks.length >= 3) sortedMarks = sortedMarks.slice(1, sortedMarks.length - 1); 
                        const sum = sortedMarks.reduce((a, b) => a + b, 0);
                        p.score = sum / sortedMarks.length;
                        if (compData.comp_data.is_group && !p.participant.name.endsWith('& PARTY')) p.participant.name += " & PARTY";
                        return p;
                    }).sort((a, b) => b.score - a.score);

                    let currentRank = 1;
                    let previousScore = -1;
                    let compPodium = [];

                    participantsArr.forEach((entry, idx) => {
                        if (entry.score !== previousScore) currentRank = idx + 1; 
                        entry.position = currentRank;
                        previousScore = entry.score;

                        let percent = (entry.score / (compData.comp_data.max_mark || 100)) * 100;
                        let gradePts = 0; let posPts = 0;

                        if (percent >= 50) {
                            if (percent >= systemSettings.thresholds.aplus) gradePts = systemSettings[`points_${sizeCat}`].aplus;
                            else if (percent >= systemSettings.thresholds.a) gradePts = systemSettings[`points_${sizeCat}`].a;
                            else if (percent >= systemSettings.thresholds.b) gradePts = systemSettings[`points_${sizeCat}`].b;
                            else gradePts = systemSettings[`points_${sizeCat}`].c;
                        }
                        if (eligibleForPosPts && currentRank <= 3) {
                            if (currentRank === 1) posPts = systemSettings.pos_points.p1;
                            else if (currentRank === 2) posPts = systemSettings.pos_points.p2;
                            else if (currentRank === 3) posPts = systemSettings.pos_points.p3;
                        }

                        const teamId = entry.participant.team_id;
                        if (teamId && calculatedTeamScores[teamId]) {
                            calculatedTeamScores[teamId].score += (Number(gradePts) + Number(posPts)); 
                        }

                        if (currentRank <= 3) {
                            compPodium.push({ 
                                rank: currentRank, 
                                name: entry.participant.name, 
                                team: allTeams.find(t => t.id === teamId)?.name || 'IND'
                            });
                        }
                    });

                    if (globalPublishedComps[0] && compId === globalPublishedComps[0].id) {
                        latestCompResults = compPodium;
                        currentPodiumCompId = compId;
                    }
                }

                // --- BUILD THE PAGINATED PLAYLIST ---
                buildPlaylist(scheduleData, customSlidesArray);

            } catch (error) { console.error("Display Fetch Error:", error); }
        }

        // --- DYNAMIC PAGINATED PLAYLIST BUILDER ---
        function buildPlaylist(scheduleData, customSlidesArray) {
            activeSlides = []; // Clear array
            const container = document.getElementById('slide-container');
            container.innerHTML = ''; // Wipe DOM

            // 1. VERTICAL STACKED RESULTS SLIDE (Matches Attached Image)
            if (globalPublishedComps.length > 0 && latestCompResults && latestCompResults.length > 0) {
                const comp = globalPublishedComps[0];
                const getPos = (r) => latestCompResults.find(p => p.rank === r) || { name: '-', team: '-' };
                const p1 = getPos(1); const p2 = getPos(2); const p3 = getPos(3);
                
                let podiumHtml = `
                    <div class="slide" id="slide-podium" data-qr-type="results" data-qr-comp="${comp.id}">
                        <h2 class="slide-title theme-font" style="margin-bottom: 3rem; z-index: 10;">OFFICIAL RESULTS: <span style="color:var(--gold);">${comp.name}</span></h2>
                        
                        <div class="results-layout">
                            <div class="v-podium-stack">
                                
                                <!-- RANK 2 (TOP) -->
                                <div class="v-podium-card p2">
                                    <div class="v-card-top">
                                        <div class="v-name theme-font">${p2.name}</div>
                                        <div class="v-team theme-font">${p2.team}</div>
                                    </div>
                                    <div class="v-card-bottom">
                                        <span class="v-rank-num theme-font">2</span>
                                    </div>
                                </div>
                                
                                <!-- RANK 1 (MIDDLE) -->
                                <div class="v-podium-card p1">
                                    <div class="v-card-top">
                                        <div class="v-name theme-font">${p1.name}</div>
                                        <div class="v-team theme-font" style="color: var(--gold);">${p1.team}</div>
                                    </div>
                                    <div class="v-card-bottom">
                                        <i class="fa-solid fa-crown" style="font-size: 2.5rem; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.3);"></i>
                                        <span class="v-rank-num theme-font">1</span>
                                    </div>
                                </div>

                                <!-- RANK 3 (BOTTOM) -->
                                <div class="v-podium-card p3">
                                    <div class="v-card-top">
                                        <div class="v-name theme-font">${p3.name}</div>
                                        <div class="v-team theme-font">${p3.team}</div>
                                    </div>
                                    <div class="v-card-bottom">
                                        <span class="v-rank-num theme-font">3</span>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', podiumHtml);
                activeSlides.push('slide-podium');
            }

            // 2. PAGINATED TEAM LEADERBOARD SLIDES
            const sortedTeams = Object.values(calculatedTeamScores).sort((a, b) => b.score - a.score);
            if (sortedTeams.length > 0) {
                const CHUNK = 6; 
                for (let i = 0; i < sortedTeams.length; i += CHUNK) {
                    const chunk = sortedTeams.slice(i, i + CHUNK);
                    const pageInfo = sortedTeams.length > CHUNK ? `<span class="page-indicator">(PAGE ${Math.floor(i/CHUNK)+1})</span>` : '';
                    
                    let lbHtml = `<div class="slide" id="slide-standings-${i}" data-qr-type="standings">
                        <h2 class="slide-title theme-font">CHAMPIONSHIP STANDINGS ${pageInfo}</h2>
                        <div class="leaderboard">`;
                    
                    chunk.forEach((team, idx) => {
                        const rank = i + idx + 1;
                        let cardClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
                        lbHtml += `
                            <div class="lb-row ${cardClass}">
                                <div class="lb-rank theme-font">#${rank}</div>
                                <div class="lb-team theme-font">${team.name}</div>
                                <div class="lb-score">${team.score} <span>PTS</span></div>
                            </div>
                        `;
                    });
                    lbHtml += `</div></div>`;
                    container.insertAdjacentHTML('beforeend', lbHtml);
                    activeSlides.push(`slide-standings-${i}`);
                }
            }

            // 3. PAGINATED EVENT SCHEDULE SLIDES
            if (globalActiveEvents.length > 0) {
                let upcoming = [...globalActiveEvents].sort((a,b) => {
                    const getW = s => s === 'ongoing' ? 1 : (s === 'valuation' ? 2 : (s === 'registration' ? 3 : 4));
                    return getW(a.status) - getW(b.status);
                });

                const SCH_CHUNK = 5; 
                for (let i = 0; i < upcoming.length; i += SCH_CHUNK) {
                    const chunk = upcoming.slice(i, i + SCH_CHUNK);
                    const pageInfo = upcoming.length > SCH_CHUNK ? `<span class="page-indicator">(PAGE ${Math.floor(i/SCH_CHUNK)+1})</span>` : '';
                    
                    let schHtml = `<div class="slide" id="slide-schedule-${i}" data-qr-type="live">
                        <h2 class="slide-title theme-font">EVENT SCHEDULE & STATUS ${pageInfo}</h2>
                        <div class="leaderboard">`;
                    
                   chunk.forEach(comp => {
                        let cStatus = comp.status || 'pending';
                        let bText = "UPCOMING"; let col = "#94A3B8"; let bBg = "rgba(255,255,255,0.05)";
                        
                        if(cStatus === 'ongoing') { bText = "LIVE ON STAGE"; col = "#10B981"; bBg = "rgba(16,185,129,0.15)"; }
                        else if(cStatus === 'registration') { bText = "CALLING NOW"; col = "#3B82F6"; bBg = "rgba(59,130,246,0.15)"; }
                        else if(cStatus === 'valuation') { bText = "IN VALUATION"; col = "#F59E0B"; bBg = "rgba(245,158,11,0.15)"; }

                        let sTime = scheduleData[comp.id]?.time || '--:--';
                        let sToTime = scheduleData[comp.id]?.to_time ? `<span style="font-size:1.5rem; color:var(--text-muted);">- ${scheduleData[comp.id].to_time}</span>` : '';

                        schHtml += `
                            <div class="lb-row" style="border-left: 6px solid ${col}; padding: 1.25rem 2rem;">
                                <div style="flex:1;">
                                    <div style="font-size: 1rem; color: ${col}; font-weight: 800; margin-bottom:0.2rem; letter-spacing: 1px;"><i class="fa-regular fa-clock"></i> ${sTime} ${sToTime} &nbsp;|&nbsp; ${comp.stages?.name || 'TBD'}</div>
                                    <div class="theme-font" style="font-size: 2.2rem; font-weight: 800; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.5); color: #FFFFFF;">${comp.name}</div>
                                </div>
                                <div style="background: ${bBg}; padding: 0.8rem 1.5rem; border-radius: 12px; font-size: 1.2rem; font-weight: 800; color: ${col}; text-align: center; border: 1px solid ${col};">
                                    ${bText}
                                </div>
                            </div>
                        `;
                    });
                    schHtml += `</div></div>`;
                    container.insertAdjacentHTML('beforeend', schHtml);
                    activeSlides.push(`slide-schedule-${i}`);
                }
            }

            // 4. CUSTOM SLIDES
            customSlidesArray.forEach(cs => {
                const slideId = `slide-custom-${cs.id}`;
                const slideHtml = `
                    <div id="${slideId}" class="slide" 
                         data-duration="${cs.duration || ''}" 
                         data-qr-url="${cs.qr_url || ''}" 
                         data-qr-text="${cs.qr_text || ''}"
                         data-ticker="${cs.ticker || ''}">
                        <div class="cs-bg" style="background-image:url('${cs.bg_url || ''}');"></div>
                        <div class="cs-content">
                            <h2 class="theme-font cs-title">${cs.title || ''}</h2>
                            <p class="cs-text">${cs.text || ''}</p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', slideHtml);
                activeSlides.push(slideId);
            });

            // 5. FALLBACK SLIDE IF EMPTY
            if (activeSlides.length === 0) {
                container.innerHTML = `
                    <div class="slide active" id="slide-fallback" style="text-align:center; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-hourglass-half fa-spin-pulse" style="font-size: 6rem; color: var(--primary); margin-bottom: 2rem;"></i>
                        <h1 class="theme-font" style="font-size: 5rem; font-weight: 900; color: #FFFFFF;">NEXT UPDATES SHORTLY</h1>
                        <p style="font-size: 2.5rem; color: var(--text-muted); margin-top: 1rem;">STAY TUNED</p>
                    </div>
                `;
                activeSlides.push('slide-fallback');
            }

            clearTimeout(slideTimer);
            if (currentSlide >= activeSlides.length) currentSlide = 0;
            rotateSlides();
        }

        function updateLiveTicker(activeEvents, publishedComps) {
            const track = document.getElementById('live-ticker-track');
            let tickerHtml = '';
            
            activeEvents.filter(c => c.status === 'ongoing').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-live">LIVE ON STAGE</span> ${c.name} (${c.stages?.name || 'GLOBAL'})</div>`; });
            activeEvents.filter(c => c.status === 'valuation').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-val">IN VALUATION</span> ${c.name}</div>`; });
            if(publishedComps.length > 0) { tickerHtml += `<div class="ticker-item"><span class="t-badge" style="background:var(--primary); color:white;">LATEST RESULT</span> ${publishedComps[0].name}</div>`; }
            activeEvents.filter(c => c.status === 'registration').forEach(c => { tickerHtml += `<div class="ticker-item"><span class="t-badge t-reg">CALLING NOW</span> ${c.name}</div>`; });
            
            if(tickerHtml === '') tickerHtml = '<div class="ticker-item">WELCOME TO FESTOS LIVE • SYNCED WITH DASHBOARD</div>';
            track.innerHTML = tickerHtml + tickerHtml;
        }

        function updateDynamicQR(slideId, customUrl = null, customText = null) {
            let targetUrl = window.location.origin + '/spectator.html';
            let mainText = 'SCAN FOR LIVE DATA';
            let subText = 'MOBILE SPECTATOR APP';

            if (customUrl) {
                targetUrl = customUrl;
                mainText = customText || 'SCAN TO VISIT';
                subText = 'EXTERNAL LINK';
            } else if (slideId === 'slide-podium' && currentPodiumCompId) {
                targetUrl += `?view=results&comp=${currentPodiumCompId}`;
                mainText = 'SCAN FOR RESULTS'; subText = 'DOWNLOAD THE POSTER';
            } else if (slideId && slideId.startsWith('slide-schedule')) {
                targetUrl += `?view=live`;
                mainText = 'SCAN SCHEDULE'; subText = 'SEE ALL ACTIVE EVENTS';
            } else if (slideId && slideId.startsWith('slide-standings')) {
                targetUrl += `?view=standings`;
                mainText = 'SCAN STANDINGS'; subText = 'DOWNLOAD LEADERBOARD';
            }

            const qrMain = document.getElementById('qr-main-text');
            const qrSub = document.getElementById('qr-sub-text');
            if (qrMain) qrMain.innerText = mainText;
            if (qrSub) qrSub.innerText = subText;
            
            if (typeof qrInstance !== 'undefined') {
                qrInstance.clear();
                qrInstance.makeCode(targetUrl);
            }
            
            const widget = document.getElementById('qr-widget');
            if (widget) {
                widget.style.transform = 'scale(1.05)';
                setTimeout(() => widget.style.transform = '', 300);
            }
        }

        // --- FAST POLLING ---
        async function pollLiveTriggers() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                if (!data || !data.value) return;
                
                const newSettings = data.value;
                const requiresPlaylistRebuild = JSON.stringify(displaySettings.custom_slides) !== JSON.stringify(newSettings.custom_slides);

                displaySettings = newSettings;
                
                // Live Styles Update
                document.documentElement.style.setProperty('--primary', displaySettings.primary_color || '#4F46E5');
                const hex = (displaySettings.primary_color || '#4F46E5').replace('#','');
                const r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
                document.documentElement.style.setProperty('--primary-glow', `rgba(${r},${g},${b},0.6)`);
                document.body.style.fontFamily = `"${displaySettings.font_family || 'Plus Jakarta Sans'}", sans-serif`;
                document.getElementById('app-body').className = `trans-${displaySettings.transition || 'fade'}`;

                // Process Live Actions
                if (displaySettings.live_action && displaySettings.live_action.timestamp > lastActionTimestamp) {
                    lastActionTimestamp = displaySettings.live_action.timestamp;
                    const action = displaySettings.live_action;
                    
                    if (action.type === 'confetti') {
                        document.getElementById('sfx-applause').play().catch(()=>{});
                        fireConfetti();
                    } 
                    else if (action.type === 'applause') {
                        document.getElementById('sfx-applause').play().catch(()=>{});
                    }
                    else if (action.type === 'flash_alert') {
                        document.getElementById('sfx-alert').play().catch(()=>{});
                        const alertDiv = document.getElementById('flash-alert');
                        document.getElementById('flash-msg').innerText = action.message || "ATTENTION";
                        alertDiv.style.display = 'flex';
                        clearTimeout(slideTimer); 
                        
                        setTimeout(() => {
                            alertDiv.style.display = 'none';
                            rotateSlides(); 
                        }, 15000);
                    }
                }

                if (requiresPlaylistRebuild) fetchDisplayData(); 

            } catch (e) { console.error("Polling error"); }
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5, angle: 60, spread: 55, origin: { x: 0 },
                    colors: ['#FBBF24', '#4F46E5', '#FFFFFF']
                });
                confetti({
                    particleCount: 5, angle: 120, spread: 55, origin: { x: 1 },
                    colors: ['#FBBF24', '#4F46E5', '#FFFFFF']
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // --- NEW SLIDE ROTATION ENGINE ---
        function rotateSlides() {
            if (activeSlides.length === 0) return;
            if (currentSlide >= activeSlides.length) currentSlide = 0;

            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            const activeSlideId = activeSlides[currentSlide];
            const slideEl = document.getElementById(activeSlideId);
            if (slideEl) slideEl.classList.add('active');
            
            // Extract Custom Data Attributes (if any)
            const customDuration = slideEl ? parseInt(slideEl.getAttribute('data-duration')) : null;
            const customQrUrl = slideEl ? slideEl.getAttribute('data-qr-url') : null;
            const customQrText = slideEl ? slideEl.getAttribute('data-qr-text') : null;
            const customTicker = slideEl ? slideEl.getAttribute('data-ticker') : null;
            const qrType = slideEl ? slideEl.getAttribute('data-qr-type') : null;

            // Determine Timing
            const defaultDurationSecs = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slide-duration')) || 12;
            const durationSecs = customDuration && customDuration > 0 ? customDuration : defaultDurationSecs;
            const durationMs = durationSecs * 1000;

            // Apply Dynamic QR
            if (customQrUrl) {
                updateDynamicQR(activeSlideId, customQrUrl, customQrText);
            } else if (qrType) {
                updateDynamicQR(activeSlideId);
            }

            // Render Ticker Data
            const track = document.getElementById('live-ticker-track');
            if (customTicker && customTicker.trim() !== '') {
                const html = `<div class="ticker-item"><span class="t-badge" style="background:var(--primary); color:white;">ANNOUNCEMENT</span> ${customTicker}</div>`;
                track.innerHTML = html + html + html + html; 
            } else if (typeof displaySettings.global_ticker === 'string' && displaySettings.global_ticker.trim() !== '') {
                const html = `<div class="ticker-item"><span class="t-badge" style="background:var(--primary); color:white;">ANNOUNCEMENT</span> ${displaySettings.global_ticker}</div>`;
                track.innerHTML = html + html + html + html; 
            } else {
                updateLiveTicker(globalActiveEvents, globalPublishedComps); 
            }

            // Animate Progress Bar
            const progressBar = document.getElementById('progress');
            progressBar.classList.remove('animating');
            void progressBar.offsetWidth; 
            progressBar.style.transition = `width ${durationSecs}s linear`;
            progressBar.classList.add('animating');
            
            currentSlide++;
            if (currentSlide >= activeSlides.length) {
                currentSlide = 0;
                fetchDisplayData(); 
                return;
            }

            clearTimeout(slideTimer);
            slideTimer = setTimeout(rotateSlides, durationMs);
        }

        fetchDisplayData().then(() => {
            if (isPreviewMode) document.body.style.zoom = "0.45";
            setInterval(pollLiveTriggers, 3000); 
        });
    </script>
</body>
</html>
