<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestOS | Live Spectator Display</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@600;800;900&family=Bebas+Neue&display=swap');

        :root {
            --primary: #4F46E5;
            --bg-main: #0F172A;
            --text-main: #FFFFFF;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; text-transform: uppercase; }
        
        body {
            background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-main);
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- BACKGROUND BRANDING --- */
        #bg-logo {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            height: 60vh; opacity: 0.03; z-index: 0; pointer-events: none; filter: grayscale(100%);
        }

        /* --- SLIDE CONTAINER & TRANSITIONS --- */
        #slide-container {
            flex: 1; position: relative; z-index: 10; display: flex; justify-content: center; align-items: center;
            padding: 2rem; width: 100%; height: calc(100vh - 60px); overflow: hidden;
        }

        .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; padding: 3rem; }
        .slide.active { opacity: 1; pointer-events: auto; }

        /* Transition Animations */
        .trans-fade .slide { transition: opacity 1s ease-in-out; }
        .trans-slide .slide { transform: translateX(100%); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s; opacity: 0; }
        .trans-slide .slide.active { transform: translateX(0); opacity: 1; }
        .trans-slide .slide.exit { transform: translateX(-100%); opacity: 0; }
        .trans-zoom .slide { transform: scale(1.1); transition: transform 0.8s ease, opacity 0.8s ease; opacity: 0; }
        .trans-zoom .slide.active { transform: scale(1); opacity: 1; }

        /* --- GLOBAL TICKER MARQUEE --- */
        #ticker-wrap {
            width: 100%; height: 60px; background: var(--primary); color: white;
            display: flex; align-items: center; overflow: hidden; position: relative; z-index: 20;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5); border-top: 2px solid rgba(255,255,255,0.2);
        }
        .ticker-text {
            white-space: nowrap; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.1em;
            display: inline-block; padding-left: 100%; animation: ticker 20s linear infinite;
        }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* --- LIVE FLASH ALERT --- */
        #flash-alert {
            position: fixed; inset: 0; background: rgba(225, 29, 72, 0.95); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 4rem; backdrop-filter: blur(10px);
        }
        .flash-text { font-size: 6rem; font-weight: 900; line-height: 1.1; text-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.05); opacity: 0.8; } }

        /* --- SLIDE TYPES CSS --- */
        /* Leaderboard */
        .lb-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; width: 100%; max-width: 1000px; padding: 2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 2rem; backdrop-filter: blur(10px); }
        .lb-rank { font-size: 4rem; font-weight: 900; color: var(--primary); width: 80px; text-align: center; line-height: 1; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .lb-name { font-size: 3rem; font-weight: 800; flex: 1; }
        .lb-pts { font-size: 3.5rem; font-weight: 900; color: #10B981; }
        
        /* Schedule */
        .sch-card { background: rgba(255,255,255,0.05); border-left: 8px solid var(--primary); padding: 1.5rem 2rem; border-radius: 0 16px 16px 0; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1200px; }
        .sch-time { font-size: 2.5rem; font-weight: 900; color: var(--primary); width: 250px; }
        .sch-event { font-size: 2.2rem; font-weight: 800; flex: 1; }
        .sch-stage { font-size: 1.8rem; font-weight: 600; color: #94A3B8; background: rgba(255,255,255,0.1); padding: 0.5rem 1.5rem; border-radius: 50px; }

        /* Custom Slide */
        .cs-bg { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .cs-content { text-align: center; z-index: 1; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .cs-title { font-size: 5rem; font-weight: 900; margin-bottom: 1rem; color: var(--primary); }
        .cs-text { font-size: 2.5rem; font-weight: 600; line-height: 1.4; max-width: 1400px; }
        .cs-qr { background: white; padding: 1rem; border-radius: 16px; display: inline-block; margin-top: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .slide-header { font-size: 3.5rem; font-weight: 900; margin-bottom: 3rem; text-align: center; text-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; gap: 1rem; }
        .slide-header img { height: 60px; border-radius: 12px; }
    </style>
</head>
<body class="trans-fade" id="app-body">

    <!-- Background Fallback Logo -->
    <img id="bg-logo" src="" alt="">

    <!-- Instant Flash Alert Overlay -->
    <div id="flash-alert">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 8rem; margin-bottom: 2rem; color: white;"></i>
        <div class="flash-text" id="flash-msg">ATTENTION PLEASE</div>
    </div>

    <!-- Main Dynamic Canvas -->
    <div id="slide-container">
        <div class="slide active">
            <i class="fa-solid fa-satellite-dish fa-beat-fade" style="font-size: 5rem; color: var(--primary); margin-bottom: 2rem;"></i>
            <h1 style="font-size: 3rem; font-weight: 800;">WAITING FOR CONNECTION...</h1>
        </div>
    </div>

    <!-- Scrolling Global Ticker -->
    <div id="ticker-wrap" style="display: none;">
        <div class="ticker-text" id="global-ticker-text"></div>
    </div>

    <!-- Web Audio API Fallbacks -->
    <audio id="sfx-applause" src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg" preload="auto"></audio>
    <audio id="sfx-alert" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // State Engine
        let displaySettings = {};
        let systemBranding = {};
        let lastActionTimestamp = 0;
        
        // Playlist Engine
        let playlist = [];
        let currentSlideIndex = 0;
        let slideTimer = null;

        // Data Caches
        let teamsData = [];
        let pointsData = [];
        let scheduleData = {};
        let compsList = [];

        async function initDisplay() {
            await fetchBranding();
            await cycleDataFetch(); // Initial heavy load
            
            // Start the fast polling loop for live triggers (every 3 seconds)
            setInterval(pollLiveTriggers, 3000);
            
            // Start the slow polling loop for database changes (leaderboard/schedule) every 30s
            setInterval(cycleDataFetch, 30000);
        }

        async function fetchBranding() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'system_branding').maybeSingle();
                if (data && data.value) {
                    systemBranding = data.value;
                    if (systemBranding.fest_logo) {
                        document.getElementById('bg-logo').src = systemBranding.fest_logo;
                    }
                }
            } catch (e) { console.error("Branding sync failed"); }
        }

        // --- HEAVY DATA FETCHING (Leaderboards & Schedules) ---
        async function cycleDataFetch() {
            try {
                // 1. Fetch Master Schedule
                const { data: schedReq } = await supabaseClient.from('settings').select('value').eq('id', 'master_schedule').maybeSingle();
                scheduleData = schedReq?.value || {};

                // 2. Fetch Teams & Points calculation data
                const { data: teams } = await supabaseClient.from('teams').select('*');
                teamsData = teams || [];
                
                const { data: comps } = await supabaseClient.from('competitions').select('*, categories(name), stages(name)');
                compsList = comps || [];

                const { data: judgements } = await supabaseClient.from('judgements').select('participant_id, competition_id, awarded_mark');
                const { data: participants } = await supabaseClient.from('participants').select('id, team_id');

                // Basic Point Calculator (Simplified for Display)
                let tPoints = {};
                teamsData.forEach(t => tPoints[t.id] = { name: t.name, score: 0 });

                if (judgements && judgements.length > 0) {
                    const pMap = {}; participants.forEach(p => pMap[p.id] = p.team_id);
                    // *In a production environment with heavy data, the backend points engine logic should write directly to a `team_scores` table.
                    // For the display, we will use a basic sum of raw marks as a placeholder leaderboard to ensure it renders instantly.
                    judgements.forEach(j => {
                        const tId = pMap[j.participant_id];
                        if (tId && tPoints[tId]) {
                            tPoints[tId].score += parseFloat(j.awarded_mark || 0);
                        }
                    });
                }
                
                pointsData = Object.values(tPoints)
                    .sort((a,b) => b.score - a.score)
                    .slice(0, 5); // Top 5 teams

                // Update the playlist if we have settings
                if (Object.keys(displaySettings).length > 0) buildPlaylist();

            } catch (e) { console.error("Data cycle failed", e); }
        }

        // --- FAST POLLING (Live Triggers & Settings) ---
        async function pollLiveTriggers() {
            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                if (!data || !data.value) return;
                
                const newSettings = data.value;
                const requiresPlaylistRebuild = JSON.stringify(displaySettings.custom_slides) !== JSON.stringify(newSettings.custom_slides) 
                                                || displaySettings.show_leaderboard !== newSettings.show_leaderboard
                                                || displaySettings.show_schedule !== newSettings.show_schedule;

                displaySettings = newSettings;
                applyDisplayStyles();

                // Check for Live Action Interrupts
                if (displaySettings.live_action && displaySettings.live_action.timestamp > lastActionTimestamp) {
                    lastActionTimestamp = displaySettings.live_action.timestamp;
                    executeLiveAction(displaySettings.live_action);
                }

                if (requiresPlaylistRebuild) buildPlaylist();

            } catch (e) { console.error("Polling error"); }
        }

        function applyDisplayStyles() {
            const root = document.documentElement;
            root.style.setProperty('--primary', displaySettings.primary_color || '#4F46E5');
            root.style.setProperty('--font-main', displaySettings.font_family || "'Plus Jakarta Sans', sans-serif");
            
            document.getElementById('app-body').className = `trans-${displaySettings.transition || 'fade'}`;

            const tickerWrap = document.getElementById('ticker-wrap');
            if (displaySettings.global_ticker) {
                tickerWrap.style.display = 'flex';
                document.getElementById('global-ticker-text').innerText = displaySettings.global_ticker;
            } else {
                tickerWrap.style.display = 'none';
            }
        }

        // --- LIVE ACTION DESK EXECUTOR ---
        function executeLiveAction(action) {
            if (action.type === 'confetti') {
                document.getElementById('sfx-applause').play().catch(()=>{});
                const duration = 5000; const end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 10, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#4F46E5', '#10B981', '#F59E0B'] });
                    confetti({ particleCount: 10, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#E11D48', '#FFFFFF', '#F59E0B'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } 
            else if (action.type === 'applause') {
                document.getElementById('sfx-applause').play().catch(()=>{});
            }
            else if (action.type === 'flash_alert') {
                document.getElementById('sfx-alert').play().catch(()=>{});
                const alertDiv = document.getElementById('flash-alert');
                document.getElementById('flash-msg').innerText = action.message || "ATTENTION";
                alertDiv.style.display = 'flex';
                
                // Pause playlist
                clearTimeout(slideTimer);
                
                // Auto hide after 15 seconds
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                    startSlideShow(); // Resume
                }, 15000);
            }
        }

        // --- DYNAMIC PLAYLIST BUILDER ---
        function buildPlaylist() {
            playlist = [];
            const logoHtml = systemBranding.fest_logo ? `<img src="${systemBranding.fest_logo}">` : '';

            // 1. Leaderboard Slide
            if (displaySettings.show_leaderboard !== false && pointsData.length > 0) {
                let lbHtml = `<div class="slide-header">${logoHtml} LIVE CHAMPIONSHIP STANDINGS</div><div style="width: 100%; display: flex; flex-direction: column; align-items: center;">`;
                pointsData.forEach((team, i) => {
                    lbHtml += `
                        <div class="lb-card" style="transform: scale(${1 - (i * 0.05)}); opacity: ${1 - (i * 0.1)};">
                            <div class="lb-rank">#${i + 1}</div>
                            <div class="lb-name">${team.name}</div>
                            <div class="lb-pts">${team.score}</div>
                        </div>
                    `;
                });
                lbHtml += `</div>`;
                playlist.push({ html: lbHtml, duration: displaySettings.slide_duration || 12 });
            }

            // 2. Schedule Slide
            if (displaySettings.show_schedule !== false && Object.keys(scheduleData).length > 0) {
                let upcoming = Object.keys(scheduleData)
                    .map(cId => ({ comp: compsList.find(c => c.id == cId), sched: scheduleData[cId] }))
                    .filter(item => item.comp && item.sched.status === 'published')
                    .sort((a,b) => a.sched.time.localeCompare(b.sched.time))
                    .slice(0, 4); // Next 4 events

                if (upcoming.length > 0) {
                    let schHtml = `<div class="slide-header">${logoHtml} UPCOMING EVENTS SCHEDULE</div><div style="width: 100%; display: flex; flex-direction: column; align-items: center;">`;
                    upcoming.forEach(u => {
                        schHtml += `
                            <div class="sch-card">
                                <div class="sch-time">${u.sched.time} ${u.sched.to_time ? `<span style="font-size:1.5rem; color:#94A3B8;">- ${u.sched.to_time}</span>` : ''}</div>
                                <div class="sch-event">${u.comp.name}</div>
                                <div class="sch-stage">${u.comp.stages?.name || 'TBD'}</div>
                            </div>
                        `;
                    });
                    schHtml += `</div>`;
                    playlist.push({ html: schHtml, duration: displaySettings.slide_duration || 12 });
                }
            }

            // 3. Custom Slides
            if (displaySettings.custom_slides && displaySettings.custom_slides.length > 0) {
                displaySettings.custom_slides.filter(cs => cs.enabled !== false).forEach(cs => {
                    let csHtml = '';
                    if (cs.bg_url) csHtml += `<img src="${cs.bg_url}" class="cs-bg">`;
                    csHtml += `<div class="cs-content">`;
                    if (cs.title) csHtml += `<div class="cs-title" style="color: ${cs.color || 'var(--primary)'};">${cs.title}</div>`;
                    if (cs.text) csHtml += `<div class="cs-text">${cs.text}</div>`;
                    if (cs.qr_url) csHtml += `<div class="cs-qr"><div id="qr-${cs.id}"></div><div style="font-size:1rem; font-weight:800; color:#0F172A; margin-top:0.5rem;">${cs.qr_text || 'SCAN ME'}</div></div>`;
                    csHtml += `</div>`;
                    
                    playlist.push({ 
                        html: csHtml, 
                        duration: cs.duration || displaySettings.slide_duration || 12,
                        qrData: cs.qr_url ? { id: cs.id, url: cs.qr_url } : null
                    });
                });
            }

            // Fallback if empty
            if (playlist.length === 0) {
                playlist.push({
                    html: `
                        <div style="text-align:center;">
                            <img src="${systemBranding.fest_logo || ''}" style="height: 150px; margin-bottom: 2rem; border-radius: 20px;">
                            <h1 style="font-size: 5rem; font-weight: 900;">${systemBranding.fest_name || 'FestOS'}</h1>
                            <p style="font-size: 2rem; color: #94A3B8; margin-top: 1rem;">NEXT UPDATES COMING SOON</p>
                        </div>
                    `,
                    duration: 20
                });
            }

            // Restart slideshow to pick up new slides smoothly
            clearTimeout(slideTimer);
            if (currentSlideIndex >= playlist.length) currentSlideIndex = 0;
            startSlideShow();
        }

        function startSlideShow() {
            const container = document.getElementById('slide-container');
            const slideData = playlist[currentSlideIndex];
            
            if (!slideData) return;

            // DOM transition logic
            const oldSlide = container.querySelector('.slide.active');
            if (oldSlide) {
                oldSlide.classList.remove('active');
                oldSlide.classList.add('exit');
                setTimeout(() => oldSlide.remove(), 1000); // Cleanup after css transition
            }

            const newSlide = document.createElement('div');
            newSlide.className = 'slide';
            newSlide.innerHTML = slideData.html;
            container.appendChild(newSlide);
            
            // Render QR Code if it exists in this slide
            if (slideData.qrData) {
                setTimeout(() => {
                    new QRCode(document.getElementById(`qr-${slideData.qrData.id}`), {
                        text: slideData.qrData.url, width: 200, height: 200,
                        colorDark: "#0F172A", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
                    });
                }, 50);
            }

            // Trigger animation frame
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    newSlide.classList.add('active');
                });
            });

            // Loop to next slide
            currentSlideIndex++;
            if (currentSlideIndex >= playlist.length) currentSlideIndex = 0;
            
            slideTimer = setTimeout(startSlideShow, slideData.duration * 1000);
        }

        // Boot
        document.addEventListener('DOMContentLoaded', initDisplay);

    </script>
</body>
</html>
