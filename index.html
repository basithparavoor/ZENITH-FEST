<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FestOS | Secure Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 320 512%22><path fill=%22%234F46E5%22 d=%22M296 160H180.6l42.6-129.8C227.2 15 215.7 0 200 0H56C44 0 33.8 8.9 32.2 20.8l-32 240C-.5 273.6 9.3 288 24 288h118.7L96.6 482.5c-3.6 15.2 8 29.5 23.3 29.5 8.4 0 16.4-4.4 20.8-12l176-304c9.3-15.9-2.2-36-20.7-36z%22/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

        :root {
            /* Premium Aurora Palette */
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-glow: rgba(79, 70, 229, 0.4);
            
            --danger: #E11D48;
            --danger-bg: rgba(225, 29, 72, 0.1);
            
            --text-main: #0F172A;
            --text-muted: #64748B;
            
            /* Glassmorphism Variables */
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(255,255,255,0.5) inset;
            
            --input-bg: rgba(255, 255, 255, 0.5);
            --input-border: rgba(255, 255, 255, 0.6);
            
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 1.5rem;
            color: var(--text-main);
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        /* --- AURORA MESH BACKGROUND --- */
        .aurora-bg {
            position: fixed; inset: 0; z-index: -2;
            overflow: hidden;
            background: #F8FAFC;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: drift 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .blob-1 { width: 600px; height: 600px; background: rgba(99, 102, 241, 0.3); top: -200px; left: -100px; }
        .blob-2 { width: 500px; height: 500px; background: rgba(236, 72, 153, 0.2); bottom: -100px; right: -100px; animation-delay: -5s; }
        .blob-3 { width: 400px; height: 400px; background: rgba(56, 189, 248, 0.25); top: 30%; left: 40%; animation-delay: -10s; }

        .noise-overlay {
            position: fixed; inset: 0; z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(80px, -50px) scale(1.1) rotate(15deg); }
        }

        /* --- PREMIUM GLASS CARD --- */
        .login-container {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border);
            padding: 3.5rem;
            border-radius: 28px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 440px;
            z-index: 10;
            position: relative;
            transform: translateY(20px);
            opacity: 0;
            animation: scaleUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes scaleUpFade {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Staggered Animations */
        .stagger-1 { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
        .stagger-2 { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
        .stagger-3 { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
        .stagger-4 { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HEADER --- */
        .header { text-align: center; margin-bottom: 2.5rem; }
        .header h1 { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            font-size: 2.25rem; 
            font-weight: 800; 
            margin-bottom: 0.5rem; 
            letter-spacing: -0.04em;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .header h1 i { color: var(--primary); }
        .header p { 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            font-weight: 500; 
            letter-spacing: -0.01em;
        }

        /* --- IMMERSIVE INPUT FIELDS --- */
        .input-group { margin-bottom: 1.25rem; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            transition: var(--transition);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            overflow: hidden;
        }

        .input-icon {
            padding-left: 1.25rem;
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .input-wrapper input {
            width: 100%;
            padding: 1.25rem 1rem 1.25rem 0.75rem;
            background: transparent;
            border: none;
            font-size: 0.95rem;
            font-weight: 600; 
            color: var(--text-main);
            outline: none;
        }

        .input-wrapper input[type="text"] { text-transform: uppercase; }
        .input-wrapper input[type="password"],
        .input-wrapper input[type="text"].password-visible { text-transform: none; }
        .input-wrapper input::placeholder { color: #94A3B8; font-weight: 500; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; }
        
        /* Focus Effects */
        .input-wrapper:focus-within {
            background: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow), inset 0 1px 2px rgba(0,0,0,0.01);
        }
        .input-wrapper:focus-within .input-icon { color: var(--primary); }

        /* --- PASSWORD TOGGLE --- */
        .toggle-password {
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            padding: 0 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            height: 100%;
        }
        .toggle-password:hover { color: var(--primary); }
        .toggle-password:active { transform: scale(0.9); }

        /* --- OPTIONS ROW --- */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            margin-top: 1rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
        }
        .remember-me:hover { color: var(--text-main); }

        .remember-me input {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 1.5px solid #CBD5E1;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .remember-me input:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .remember-me input:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 4px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* --- PREMIUM BUTTON --- */
        .btn-primary {
            width: 100%;
            padding: 1.1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* High-end Shimmer Effect */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-25deg);
            transition: 0.6s ease;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -4px rgba(79, 70, 229, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .btn-primary:hover::after {
            left: 150%;
        }
        .btn-primary:active { 
            transform: translateY(1px); 
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
        }

        /* --- ERROR MESSAGE --- */
        #error-message {
            display: none;
            background: var(--danger-bg);
            border: 1px solid rgba(225, 29, 72, 0.2);
            color: var(--danger);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            animation: shakeDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes shakeDown {
            0% { opacity: 0; transform: translateY(-10px) translateX(0); }
            25% { transform: translateY(0) translateX(-5px); }
            50% { transform: translateY(0) translateX(5px); }
            75% { transform: translateY(0) translateX(-3px); }
            100% { opacity: 1; transform: translateY(0) translateX(0); }
        }

        /* ========================================================================
           STRICT MOBILE UI OVERRIDES (POLISHED APP FEEL)
           ======================================================================== */
        @media (max-width: 768px) {
            body { padding: 1.25rem; }

            .login-container {
                padding: 2.5rem 1.5rem; 
                border-radius: 28px;
                background: rgba(255, 255, 255, 0.75); /* Slightly more opaque on mobile for readability */
                box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.1);
            }

            .header { margin-bottom: 2rem; }
            .header h1 { font-size: 2rem; }

            .input-wrapper input { padding: 1.1rem 0.75rem; font-size: 16px !important; }
            .btn-primary { padding: 1.1rem; font-size: 1rem; }
            
            .input-icon { padding-left: 1rem; }
            .toggle-password { padding: 0 1rem; }
        }
    </style>
</head>
<body>

    <!-- Premium Background Effects -->
    <div class="aurora-bg">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
    </div>
    <div class="grid-pattern"></div>
    <div class="noise-overlay"></div>

    <div class="login-container">
        <div class="header stagger-1">
            <h1 class="brand">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                </svg>
                FestOS
            </h1>
            <p>Enter your credentials to continue</p>
        </div>

        <div id="error-message"></div>

        <form id="loginForm">
            <div class="input-group stagger-2">
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <input type="text" id="username" placeholder="Username" required autocomplete="off">
                </div>
            </div>

            <div class="input-group stagger-3">
                <div class="input-wrapper">
                    <div class="input-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="options-row stagger-4">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember my login
                </label>
            </div>

            <button type="submit" class="btn-primary stagger-4" id="submitBtn">Secure Login</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
