<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FestOS | Secure Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 320 512%22><path fill=%22%234F46E5%22 d=%22M296 160H180.6l42.6-129.8C227.2 15 215.7 0 200 0H56C44 0 33.8 8.9 32.2 20.8l-32 240C-.5 273.6 9.3 288 24 288h118.7L96.6 482.5c-3.6 15.2 8 29.5 23.3 29.5 8.4 0 16.4-4.4 20.8-12l176-304c9.3-15.9-2.2-36-20.7-36z%22/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
       /* Adjusted to import only medium/semi-bold weights for a cleaner, premium look */
       @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600&display=swap');

:root {
    /* Refined, Softer Premium Palette */
    --primary: #3B82F6; /* Softer, elegant blue */
    --primary-hover: #2563EB;
    --primary-light: #EFF6FF;
    --primary-ring: rgba(59, 130, 246, 0.15);
    --primary-gradient: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
    
    --danger: #EF4444;
    --danger-light: #FEF2F2;
    
    --bg-main: #F3F4F6; /* Extremely soft gray for depth */
    --bg-surface: rgba(255, 255, 255, 0.7); /* Ultra-translucent glass */
    --text-main: #1F2937;
    --text-muted: #6B7280;
    --border: rgba(255, 255, 255, 0.5); /* Soft light border for glass effect */
    --input-border: rgba(209, 213, 219, 0.6);
    
    /* Smooth, deep shadows */
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02);
    --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.03);
    --shadow-lg: 0 24px 48px -12px rgba(17, 24, 39, 0.08);
    --shadow-btn: 0 8px 16px -4px rgba(59, 130, 246, 0.3);
    
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    
    --transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* --- SYSTEM RESET --- */
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
    -webkit-tap-highlight-color: transparent;
}

body {
    background-color: var(--bg-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden; 
}

/* --- PREMIUM BACKGROUND ANIMATIONS --- */
.ambient-bg { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
.grid-pattern {
    position: absolute; inset: 0; z-index: -1;
    background-image: radial-gradient(rgba(17, 24, 39, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 10%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 10%, transparent 100%);
}

.orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.5; animation: float 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
.orb-1 { width: 500px; height: 500px; background: rgba(59, 130, 246, 0.15); top: -200px; left: -150px; }
.orb-2 { width: 400px; height: 400px; background: rgba(139, 92, 246, 0.1); bottom: -150px; right: -100px; animation-delay: -7s; }
.orb-3 { width: 350px; height: 350px; background: rgba(14, 165, 233, 0.1); bottom: 20%; left: 20%; animation-delay: -12s; }

@keyframes float {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { transform: translate(60px, 100px) scale(1.1) rotate(5deg); }
}

/* --- APP-LIKE LOGIN CARD --- */
.login-container {
    background: var(--bg-surface);
    backdrop-filter: blur(40px) saturate(150%);
    -webkit-backdrop-filter: blur(40px) saturate(150%);
    border: 1px solid var(--border);
    padding: 3.5rem 3rem;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    width: 100%;
    max-width: 420px;
    z-index: 10;
    position: relative;
    transform: translateY(15px);
    opacity: 0;
    animation: scaleUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

@keyframes scaleUpFade {
    to { transform: translateY(0); opacity: 1; }
}

/* Staggered entrance */
.stagger-1 { opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards; }
.stagger-2 { opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards; }
.stagger-3 { opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards; }
.stagger-4 { opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards; }

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* --- HEADER --- */
.header { text-align: center; margin-bottom: 3rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.header h1 { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    font-size: 1.8rem; 
    font-weight: 600; /* Medium-bold for premium feel */
    margin-bottom: 0.5rem; 
    letter-spacing: -0.02em;
    color: transparent;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}
.header p { 
    color: var(--text-muted); 
    font-size: 0.95rem; 
    font-weight: 400; /* Medium/Regular */
    letter-spacing: 0.01em;
}

/* --- FORM ELEMENTS --- */
.input-group { margin-bottom: 1.5rem; }
.input-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 500; /* Medium weight */
    letter-spacing: 0.01em;
}

.input-wrapper { position: relative; display: flex; align-items: center; }

.input-group input {
    width: 100%;
    padding: 1rem 1.25rem;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid var(--input-border);
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    font-weight: 500; /* Medium weight */
    color: var(--text-main);
    transition: var(--transition);
    outline: none;
    min-height: 52px;
}

.input-group input[type="password"],
.input-group input[type="text"].password-visible {
    padding-right: 3rem;
}

.input-group input::placeholder { color: #9CA3AF; font-weight: 400; }
.input-group input:focus {
    background: #FFFFFF;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}

/* --- PASSWORD TOGGLE --- */
.toggle-password {
    position: absolute;
    right: 0.5rem;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: var(--transition);
}
.toggle-password:hover { color: var(--text-main); }
.toggle-password:active { transform: scale(0.95); }

/* --- OPTIONS ROW --- */
.options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
}
.remember-me {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: var(--transition);
}
.remember-me:hover { color: var(--text-main); }

.remember-me input {
    appearance: none;
    width: 1.2rem;
    height: 1.2rem;
    border: 1.5px solid var(--input-border);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    position: relative;
    transition: var(--transition);
}

.remember-me input:checked {
    background: var(--primary);
    border-color: var(--primary);
}

.remember-me input:checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 2px;
    width: 3px;
    height: 8px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

/* --- BUTTON --- */
.btn-primary {
    width: 100%;
    min-height: 52px;
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 1rem;
    font-weight: 500; /* Medium weight */
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-btn);
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.01em;
    position: relative;
    overflow: hidden;
}
.btn-primary::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
    transform: skewX(-20deg);
    transition: 0.6s ease;
}
.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 20px -4px rgba(59, 130, 246, 0.4);
}
.btn-primary:hover::after {
    left: 150%;
}
.btn-primary:active { 
    transform: translateY(0); 
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
}

/* --- ERROR MESSAGE --- */
#error-message {
    display: none;
    background: var(--danger-light);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: var(--danger);
    padding: 0.85rem 1rem;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 1.5rem;
    text-align: center;
    animation: slideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========================================================================
   STRICT MOBILE UI OVERRIDES (NATIVE APP FEEL)
   ======================================================================== */
@media (max-width: 768px) {
    body {
        align-items: flex-end; 
        padding: 0;
        background-color: #F9FAFB; 
    }
    
    .ambient-bg { display: none; } 

    .login-container {
        border-radius: 32px 32px 0 0;
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.05);
        padding: 2.5rem 1.5rem calc(3rem + env(safe-area-inset-bottom)) 1.5rem; 
        max-width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transform: translateY(100%);
        animation: slideUpMobile 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes slideUpMobile {
        to { transform: translateY(0); opacity: 1; }
    }

    .login-container::before {
        content: '';
        display: block;
        width: 40px;
        height: 5px;
        background: #E5E7EB;
        border-radius: 10px;
        margin: 0 auto 2rem auto;
    }

    .header { margin-bottom: 2.5rem; }
    .header h1 { font-size: 1.6rem; }

    .input-group input { font-size: 16px !important; min-height: 54px; }
    
    .btn-primary { min-height: 56px; font-size: 1rem; }
}
    </style>
</head>
<body>

    <!-- Premium Background -->
    <div class="grid-pattern"></div>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-container">
        <div class="header stagger-1">
            <h1 class="brand">FestOS</h1>
            <p>Enter your credentials to continue</p>
        </div>

        <div id="error-message"></div>

        <form id="loginForm">
            <div class="input-group stagger-2">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="e.g., admin, judge1" required autocomplete="off">
                </div>
            </div>

            <div class="input-group stagger-3">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <!-- Default Eye Icon -->
                        <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="options-row stagger-4">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember my login
                </label>
            </div>

            <button type="submit" class="btn-primary stagger-4" id="submitBtn">Secure Login</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
