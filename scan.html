<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FestOS | ID Scanner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 320 512%22><path fill=%22%234F46E5%22 d=%22M296 160H180.6l42.6-129.8C227.2 15 215.7 0 200 0H56C44 0 33.8 8.9 32.2 20.8l-32 240C-.5 273.6 9.3 288 24 288h118.7L96.6 482.5c-3.6 15.2 8 29.5 23.3 29.5 8.4 0 16.4-4.4 20.8-12l176-304c9.3-15.9-2.2-36-20.7-36z%22/></svg>">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: #EEF2FF;
            --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
            
            --bg-main: #000000; /* True black for camera backdrop */
            --bg-surface: #FFFFFF;
            --input-bg: #F8FAFC;
            
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            
            --shadow-float: 0 12px 30px -8px rgba(0, 0, 0, 0.3);
            --shadow-card: 0 4px 12px rgba(15, 23, 42, 0.04);
            
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 28px;
            
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-main); 
            height: 100vh; width: 100vw; 
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- GLASSMORPHIC UI OVERLAYS --- */
        .header {
            position: absolute; top: 0; left: 0; right: 0;
            /* Respect iOS notch/safe areas */
            padding: calc(1.5rem + env(safe-area-inset-top)) 1.5rem 1.5rem 1.5rem; 
            z-index: 10;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            color: white; text-align: center;
        }
        
        .header h1 { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            font-size: 1.35rem; font-weight: 800; 
            display: flex; align-items: center; justify-content: center; gap: 0.5rem; 
            letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* --- SCANNER VIEWPORT --- */
        #reader-container { flex: 1; position: relative; overflow: hidden; background: #000; }
        #reader { width: 100%; height: 100%; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
        
        /* Hide the ugly default HTML5-QR-Code UI elements */
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink { display: none !important; }

        /* Premium Scanner Reticle */
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; height: 260px; 
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-xl); 
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.55), 0 0 30px rgba(255,255,255,0.1) inset;
            z-index: 5; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        /* Scanning Laser */
        .scan-overlay::before {
            content: ''; position: absolute; width: 100%; height: 3px;
            background: #10B981; box-shadow: 0 0 15px 2px #10B981, 0 15px 30px rgba(16, 185, 129, 0.4);
            animation: scanline 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        /* Corner Reticle Brackets */
        .scan-overlay::after {
            content: ''; position: absolute; inset: -3px; border-radius: var(--radius-xl);
            border: 3px solid transparent;
            background: linear-gradient(to right, white 20px, transparent 20px, transparent calc(100% - 20px), white calc(100% - 20px)) top left / 100% 20px no-repeat,
                        linear-gradient(to right, white 20px, transparent 20px, transparent calc(100% - 20px), white calc(100% - 20px)) bottom left / 100% 20px no-repeat,
                        linear-gradient(to bottom, white 20px, transparent 20px, transparent calc(100% - 20px), white calc(100% - 20px)) top left / 20px 100% no-repeat,
                        linear-gradient(to bottom, white 20px, transparent 20px, transparent calc(100% - 20px), white calc(100% - 20px)) top right / 20px 100% no-repeat;
        }

        @keyframes scanline {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- PREMIUM BOTTOM SHEET MODAL --- */
        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-surface); 
            border-radius: 32px 32px 0 0;
            /* Respect iOS home bar safe area */
            padding: 2rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom)) 1.5rem; 
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
            max-height: 90vh; display: flex; flex-direction: column;
            text-transform: uppercase;
        }
        .bottom-sheet.open { transform: translateY(0); }
        
        /* Drag Handle */
        .sheet-handle {
            width: 45px; height: 6px; background: #CBD5E1;
            border-radius: 10px; margin: -10px auto 1.5rem auto;
        }

        .profile-header { display: flex; gap: 1.25rem; margin-bottom: 1.5rem; align-items: flex-start; }
        .profile-photo {
            width: 90px; height: 120px; object-fit: cover;
            border-radius: 16px; border: 1px solid var(--border);
            box-shadow: 0 4px 12px rgba(15,23,42,0.08); flex-shrink: 0;
            background: var(--input-bg);
        }
        .profile-info { flex: 1; overflow: hidden; }
        .profile-info h2 { 
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.45rem; font-weight: 800; 
            color: var(--text-main); line-height: 1.2; margin-bottom: 0.25rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .profile-info .id-badge { 
            font-family: monospace; font-size: 0.95rem; color: var(--primary); 
            font-weight: 700; display: block; margin-bottom: 0.85rem; letter-spacing: 0.05em;
        }
        
        .tags-wrapper { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .tag { padding: 0.4rem 0.75rem; border-radius: 50px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.3rem; letter-spacing: 0.05em; }
        .tag-team { background: var(--primary-light); color: var(--primary); }
        .tag-category { background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border); }
        .tag-batch { background: #E2E8F0; color: #475569; }

        .comps-container { flex: 1; overflow-y: auto; padding-right: 0.5rem; margin-bottom: 1.5rem; -webkit-overflow-scrolling: touch; }
        .comps-container::-webkit-scrollbar { width: 4px; }
        .comps-container::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        
        .comps-title { font-size: 0.85rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        
        /* Premium Event Cards */
        .comp-card {
            background: var(--input-bg); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 0.85rem;
            display: flex; flex-direction: column; gap: 0.75rem;
            transition: var(--transition);
        }
        
        .comp-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
        .comp-card strong { color: var(--text-main); font-size: 1rem; font-weight: 700; line-height: 1.3; }
        
        .comp-status { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; padding: 0.35rem 0.75rem; border-radius: 50px; white-space: nowrap; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 0.3rem; }
        .status-pending { background: #F1F5F9; color: #64748B; border: 1px solid var(--border); }
        .status-registration { background: #DBEAFE; color: #1D4ED8; }
        .status-ongoing { background: #D1FAE5; color: #059669; }
        .status-judgement_complete { background: #F3E8FF; color: #7E22CE; }
        .status-published { background: #FEF3C7; color: #D97706; border: 1px solid rgba(217, 119, 6, 0.3); }

        /* Action Buttons */
        .btn {
            width: 100%; min-height: 54px; border-radius: var(--radius-lg); border: none;
            background: var(--primary-gradient); color: white; font-size: 1.05rem; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); transition: transform 0.2s; letter-spacing: 0.02em;
        }
        .btn:active { transform: scale(0.97); }

        /* Fullscreen Loader */
        #loader {
            position: absolute; inset: 0; background: rgba(15,23,42,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        
        /* Native App Style Toast */
        #toast {
            position: fixed; top: calc(1rem + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-150px);
            background: var(--bg-surface); color: var(--text-main); padding: 1rem 1.5rem; border-radius: 50px;
            font-weight: 700; z-index: 300; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-float); display: flex; align-items: center; gap: 0.75rem; border-left: 4px solid var(--danger); font-size: 0.95rem; width: 90%; max-width: 400px;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="brand"><i class="ph-fill ph-scan"></i> FestOS Identifier</h1>
        <p style="font-size: 0.85rem; opacity: 0.8; margin-top: 0.25rem; font-weight: 500;">Align QR code within frame</p>
    </div>

    <div id="reader-container">
        <div class="scan-overlay"></div>
        <div id="reader"></div>
    </div>

    <div id="loader">
        <i class="ph ph-spinner-gap" style="font-size: 3.5rem; animation: spin 1s linear infinite; color: var(--primary);"></i>
        <p style="margin-top: 1.5rem; font-weight: 600; font-size: 1.1rem; letter-spacing: 0.05em;">FETCHING PROFILE...</p>
    </div>
    
    <div id="toast"><i class="ph-fill ph-warning-circle" style="color: var(--danger); font-size: 1.25rem;"></i> <span id="toast-msg">Error</span></div>

    <div id="profile-sheet" class="bottom-sheet">
        <div class="sheet-handle"></div>
        
        <div class="profile-header">
            <img id="p-photo" class="profile-photo" src="" alt="Profile">
            <div class="profile-info">
                <h2 id="p-name">Loading...</h2>
                <span id="p-id" class="id-badge">ID: ---</span>
                <div class="tags-wrapper">
                    <span id="p-team" class="tag tag-team"><i class="ph-fill ph-users"></i> TEAM</span>
                    <span id="p-category" class="tag tag-category"><i class="ph-fill ph-folders"></i> CATEGORY</span>
                    <span id="p-batch" class="tag tag-batch"><i class="ph-fill ph-calendar-blank"></i> DOB</span>
                </div>
            </div>
        </div>

        <div class="comps-container">
            <div class="comps-title"><i class="ph-fill ph-trophy" style="color: var(--primary); font-size: 1.1rem;"></i> Enrolled Events</div>
            <div id="p-comps">
                <!-- Dynamically populated -->
            </div>
        </div>

        <button class="btn" onclick="resumeScanning()">
            <i class="ph-bold ph-qr-code"></i> SCAN ANOTHER ID
        </button>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let html5QrCode;
        let isProcessing = false;

        document.addEventListener("DOMContentLoaded", () => {
            startCamera();
        });

        function startCamera() {
            html5QrCode = new Html5Qrcode("reader");
            
            // Start camera using the back camera natively
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10, 
                    qrbox: { width: 260, height: 260 },
                    aspectRatio: window.innerWidth / window.innerHeight
                },
                onScanSuccess,
                (errorMessage) => { /* Ignore background scan errors */ }
            ).catch(err => {
                showToast("Camera access denied or unavailable.");
            });
        }

        async function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            
            html5QrCode.pause(true);
            document.getElementById('loader').style.display = 'flex';

            let uniqueId = decodedText.trim();
            if (uniqueId.includes('?id=')) {
                uniqueId = uniqueId.split('?id=')[1];
            }

            try {
                // Fetching dob, and the nested stages/categories for competitions
                const { data, error } = await supabaseClient
                    .from('participants')
                    .select(`
                        *, 
                        teams(name), 
                        categories(name),
                        participant_competitions(
                            is_leader,
                            competitions(
                                id, 
                                name, 
                                status,
                                categories(name),
                                stages(name)
                            )
                        )
                    `)
                    .eq('unique_id', uniqueId)
                    .single();

                if (error || !data) throw new Error("Participant not found in database.");

                populateSheet(data);
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('profile-sheet').classList.add('open');

            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                showToast(err.message);
                
                setTimeout(() => {
                    isProcessing = false;
                    html5QrCode.resume();
                }, 2000);
            }
        }

        function populateSheet(p) {
            // Populate Details
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-id').innerText = p.unique_id;
            document.getElementById('p-team').innerHTML = `<i class="ph-fill ph-users"></i> ${p.teams?.name || 'INDEPENDENT'}`;
            document.getElementById('p-category').innerHTML = `<i class="ph-fill ph-folders"></i> ${p.categories?.name || 'GENERAL'}`;
            
            // Check if they uploaded a photo, otherwise use fallback
            const photoUrl = p.photo_url || `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="150" height="200"%3E%3Crect width="100%25" height="100%25" fill="%23F1F5F9"/%3E%3Ctext x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="%2394A3B8"%3ENO PHOTO%3C/text%3E%3C/svg%3E`;
            document.getElementById('p-photo').src = photoUrl;
            
            // Set DOB or Batch
            document.getElementById('p-batch').innerHTML = `<i class="ph-fill ph-calendar-blank"></i> ${p.dob || 'DOB N/A'}`;

            // Populate Competitions
            const compContainer = document.getElementById('p-comps');
            
            if (p.participant_competitions && p.participant_competitions.length > 0) {
                compContainer.innerHTML = p.participant_competitions.map(pc => {
                    const comp = pc.competitions;
                    if(!comp) return '';
                    
                    // Format Status Text Beautifully
                    let statusLabel = comp.status.replace('_', ' ').toUpperCase();
                    let icon = '';
                    
                    if(comp.status === 'pending') { statusLabel = 'UPCOMING'; icon = '<i class="ph-bold ph-clock"></i>'; }
                    if(comp.status === 'registration') { statusLabel = 'REGISTRATION'; icon = '<i class="ph-bold ph-megaphone"></i>'; }
                    if(comp.status === 'ongoing') { statusLabel = 'LIVE NOW'; icon = '<i class="ph-fill ph-broadcast"></i>'; }
                    if(comp.status === 'judgement_complete') { statusLabel = 'AWAITING RESULTS'; icon = '<i class="ph-bold ph-hourglass-high"></i>'; }
                    
                    const compCategory = comp.categories?.name || 'General';
                    const compStage = comp.stages?.name || 'Unassigned Stage';
                    
                    // Check if published to add the interactive link
                    let clickAction = '';
                    let interactiveStyle = '';
                    let resultButton = '';
                    
                    if (comp.status === 'published') {
                        statusLabel = 'RESULTS PUBLISHED';
                        icon = '<i class="ph-fill ph-seal-check"></i>';
                        clickAction = `onclick="window.location.href='results.html?comp=${comp.id}'"`;
                        interactiveStyle = 'cursor: pointer; border-color: var(--primary); box-shadow: 0 4px 15px rgba(79, 70, 229, 0.1); transform: scale(1);';
                        resultButton = `
                            <div style="width: 100%; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border);">
                                <button style="width: 100%; background: var(--primary-light); color: var(--primary); border: none; padding: 0.75rem; border-radius: 8px; font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; text-transform: uppercase;">
                                    <i class="ph-bold ph-image"></i> View Result Poster
                                </button>
                            </div>
                        `;
                    }
                    
                    const leaderTag = pc.is_leader ? `<span style="background: var(--success-light); color: var(--success); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.65rem; font-weight: 800; margin-top: 0.25rem; display: inline-block;">GROUP LEADER</span>` : '';
                    
                    return `
                        <div class="comp-card" style="${interactiveStyle}" ${clickAction}>
                            <div class="comp-card-header">
                                <div>
                                    <strong style="display: block;">${comp.name}</strong>
                                    ${leaderTag}
                                </div>
                                <span class="comp-status status-${comp.status}">${icon} ${statusLabel}</span>
                            </div>
                            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">
                                <span style="display: inline-flex; align-items: center; gap: 0.25rem;">
                                    <i class="ph-fill ph-folder" style="color: var(--text-dim);"></i> ${compCategory}
                                </span>
                                <span style="color: var(--border);">|</span>
                                <span style="display: inline-flex; align-items: center; gap: 0.25rem;">
                                    <i class="ph-fill ph-microphone-stage" style="color: var(--text-dim);"></i> ${compStage}
                                </span>
                            </div>
                            ${resultButton}
                        </div>
                    `;
                }).join('');
            } else {
                compContainer.innerHTML = `
                    <div style="text-align: center; padding: 2rem 1rem; background: var(--input-bg); border-radius: var(--radius-md); border: 2px dashed var(--border);">
                        <i class="ph-fill ph-files" style="font-size: 2rem; color: var(--text-dim); margin-bottom: 0.5rem;"></i>
                        <p style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;">No events assigned to this participant.</p>
                    </div>`;
            }
        }

        function resumeScanning() {
            document.getElementById('profile-sheet').classList.remove('open');
            setTimeout(() => {
                isProcessing = false;
                html5QrCode.resume();
            }, 400); // Match CSS transition duration
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            // Clean up error message if needed
            if (msg.includes("Invalid password") || msg.includes("Failed to fetch")) {
                msg = "Network or Database Error.";
            }
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // Add CSS Spinner Keyframes
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);

        // ==========================================
        // GLOBAL BRANDING ENGINE
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            fetchAndApplyBranding();
        });

        async function fetchAndApplyBranding() {
            try {
                const { data, error } = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('id', 'system_branding')
                    .maybeSingle();

                if (error) throw error;
                if (data && data.value) applyGlobalBranding(data.value);
            } catch (e) {
                console.warn("Could not fetch global branding:", e.message);
            }
        }

function applyGlobalBranding(brandingData) {
    const validName = brandingData.fest_name && brandingData.fest_name.trim() !== '';
    const validLogo = brandingData.fest_logo && brandingData.fest_logo.trim() !== '';
    const displayMode = brandingData.display_mode || 'both'; // 'both', 'logo', 'name'
    
    // 1. Update Document Title dynamically
    const festName = validName ? brandingData.fest_name : 'FestOS';
    const titleParts = document.title.split('|');
    const pageContext = titleParts.length > 1 ? titleParts[1].trim() : 'Portal';
    document.title = `${festName} | ${pageContext}`;

    // 2. Global Favicon Injection (Instantly updates across all pages)
    if (validLogo) {
        let iconLinks = document.querySelectorAll("link[rel~='icon']");
        if (iconLinks.length === 0) {
            let newIcon = document.createElement('link');
            newIcon.rel = 'icon';
            document.head.appendChild(newIcon);
            iconLinks = [newIcon];
        }
        iconLinks.forEach(link => link.href = brandingData.fest_logo);
    }

    // 3. UI Header Updates
    const brandContainers = document.querySelectorAll('.brand, .navbar-brand, .logo-text');
    brandContainers.forEach(container => {
        let html = '';
        const showLogo = validLogo && (displayMode === 'both' || displayMode === 'logo');
        const showName = (displayMode === 'both' || displayMode === 'name') || (!validLogo && displayMode === 'logo');
        
        // Dynamic Logo Sizing
        if (showLogo) {
            html += `<img src="${brandingData.fest_logo}" alt="Logo" style="height: 32px; width: auto; max-width: 150px; object-fit: contain; border-radius: 6px; margin-right: ${showName ? '10px' : '0'}; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">`;
        } else if (!validLogo && displayMode !== 'name') {
            html += `<i class="fa-solid fa-bolt" style="color: var(--primary); margin-right: 8px;"></i>`;
        }
        
        // Dynamic Text
        if (showName) {
            html += `<span style="letter-spacing: -0.5px;">${validName ? brandingData.fest_name : 'FestOS'}</span>`;
        }
        
        container.innerHTML = html;
        container.style.display = 'flex';
        container.style.alignItems = 'center';
        
        // Centering logic for specific screens
        if (window.location.pathname.includes('scan') || window.location.pathname.includes('login')) {
            container.style.justifyContent = 'center';
        }
    });
