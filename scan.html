<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FestOS | Scanner Pro</title>
    <!-- Libraries -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="festos-core.js"></script>

    <style>
        :root {
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --primary-light: rgba(59, 130, 246, 0.15);
            --primary-gradient: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
            
            --bg-main: #000000;
            --bg-surface: #111827;
            --bg-surface-elevated: #1F2937;
            
            --border: #374151;
            --border-light: rgba(255, 255, 255, 0.1);
            
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --text-dim: #6B7280;
            
            --success: #10B981;
            --success-light: rgba(16, 185, 129, 0.15);
            --danger: #EF4444;
            --danger-light: rgba(239, 68, 68, 0.15);
            --warning: #F59E0B;
            --warning-light: rgba(245, 158, 11, 0.15);
            
            --shadow-float: 0 12px 30px -8px rgba(0, 0, 0, 0.5);
            --shadow-sheet: 0 -10px 40px rgba(0, 0, 0, 0.6);
            
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-full: 9999px;
            
            --transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-main); 
            height: 100vh; 
            height: 100dvh; 
            width: 100vw; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- GLASS HUD OVERLAYS --- */
        .hud-header {
            position: absolute; 
            top: 0; left: 0; right: 0;
            padding: calc(1rem + env(safe-area-inset-top)) 1.25rem 1rem 1.25rem; 
            z-index: 20;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .hud-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #FFFFFF;
        }
        .hud-logo {
            height: 28px;
            max-width: 110px;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }
        .hud-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        /* Top HUD Action Buttons */
        .hud-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .hud-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .hud-btn:hover, .hud-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
        }
        .hud-btn:active {
            transform: scale(0.95);
        }
        .hud-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* --- SCANNER VIEWPORT --- */
        #reader-container { 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
            background: #000; 
            touch-action: none;
        }
        #reader { 
            width: 100%; 
            height: 100%; 
        }
        #reader video { 
            object-fit: cover !important; 
            width: 100% !important; 
            height: 100% !important; 
        }
        
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink,
        #reader__status_span,
        #qr-shaded-region { display: none !important; }

        /* Hardware Optical & Digital Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: calc(50% + 165px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(17, 24, 39, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 0.28rem 0.4rem;
            border-radius: var(--radius-full);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            transition: var(--transition);
        }
        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #94A3B8;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zoom-btn:hover {
            color: #FFFFFF;
        }
        .zoom-btn.active {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        }

        /* Tap-To-Focus Ripple Ring */
        .focus-ring {
            position: absolute;
            width: 64px;
            height: 64px;
            border: 2px solid #38BDF8;
            border-radius: 50%;
            pointer-events: none;
            z-index: 30;
            transform: translate(-50%, -50%) scale(1.4);
            opacity: 0;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.75);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
        }
        .focus-ring.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Cyber Reticle HUD */
        .scan-overlay {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 280px; 
            height: 280px;
            max-width: 82vw;
            max-height: 82vw;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: var(--radius-xl); 
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.65), 0 0 40px rgba(59, 130, 246, 0.12) inset;
            z-index: 10; 
            pointer-events: none;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        /* Scanner Laser Beam */
        .scan-overlay::before {
            content: ''; 
            position: absolute; 
            width: 100%; 
            height: 2.5px;
            background: #38BDF8; 
            box-shadow: 0 0 15px 3px #38BDF8, 0 10px 25px rgba(56, 189, 248, 0.45);
            animation: scanline 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Corner Brackets */
        .scan-overlay::after {
            content: ''; 
            position: absolute; 
            inset: -2px; 
            border-radius: var(--radius-xl);
            border: 3px solid transparent;
            background: linear-gradient(to right, #38BDF8 25px, transparent 25px, transparent calc(100% - 25px), #38BDF8 calc(100% - 25px)) top left / 100% 25px no-repeat,
                        linear-gradient(to right, #38BDF8 25px, transparent 25px, transparent calc(100% - 25px), #38BDF8 calc(100% - 25px)) bottom left / 100% 25px no-repeat,
                        linear-gradient(to bottom, #38BDF8 25px, transparent 25px, transparent calc(100% - 25px), #38BDF8 calc(100% - 25px)) top left / 25px 100% no-repeat,
                        linear-gradient(to bottom, #38BDF8 25px, transparent 25px, transparent calc(100% - 25px), #38BDF8 calc(100% - 25px)) top right / 25px 100% no-repeat;
            transition: all 0.25s ease;
        }

        /* Target Locked / Success Scan Animation */
        .scan-overlay.success {
            border-color: #10B981 !important;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.7), 0 0 50px rgba(16, 185, 129, 0.45) inset !important;
            transform: translate(-50%, -50%) scale(1.02);
        }
        .scan-overlay.success::before {
            background: #10B981 !important;
            box-shadow: 0 0 25px 5px #10B981, 0 10px 30px rgba(16, 185, 129, 0.6) !important;
        }
        .scan-overlay.success::after {
            background: linear-gradient(to right, #10B981 25px, transparent 25px, transparent calc(100% - 25px), #10B981 calc(100% - 25px)) top left / 100% 25px no-repeat,
                        linear-gradient(to right, #10B981 25px, transparent 25px, transparent calc(100% - 25px), #10B981 calc(100% - 25px)) bottom left / 100% 25px no-repeat,
                        linear-gradient(to bottom, #10B981 25px, transparent 25px, transparent calc(100% - 25px), #10B981 calc(100% - 25px)) top left / 25px 100% no-repeat,
                        linear-gradient(to bottom, #10B981 25px, transparent 25px, transparent calc(100% - 25px), #10B981 calc(100% - 25px)) top right / 25px 100% no-repeat;
        }

        .reticle-status {
            position: absolute;
            bottom: calc(50% - 195px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            color: #94A3B8;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.4rem 0.85rem;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .reticle-status.locked {
            color: #34D399;
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.15);
        }

        @keyframes scanline {
            0% { top: 0; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- MANUAL SEARCH DRAWER --- */
        .manual-search-drawer {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(17, 24, 39, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            padding: calc(1rem + env(safe-area-inset-top)) 1.25rem 1.25rem 1.25rem;
            z-index: 150;
            transform: translateY(-110%);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-sheet);
        }
        .manual-search-drawer.open {
            transform: translateY(0);
        }
        .search-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 0.85rem 1rem;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            text-transform: uppercase;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* --- BOTTOM SHEET MODAL --- */
        .bottom-sheet {
            position: fixed; 
            bottom: 0; left: 0; right: 0;
            background: var(--bg-surface); 
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom)) 1.25rem; 
            z-index: 120;
            transform: translateY(105%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-sheet);
            max-height: 88vh; 
            display: flex; 
            flex-direction: column; 
            color: var(--text-main);
        }
        .bottom-sheet.open { 
            transform: translateY(0); 
        }
        
        .sheet-handle {
            width: 44px; 
            height: 5px; 
            background: var(--border);
            border-radius: var(--radius-full); 
            margin: -0.5rem auto 1.25rem auto;
            cursor: pointer;
        }

        .profile-card {
            display: flex; 
            gap: 1rem; 
            margin-bottom: 1.25rem; 
            align-items: flex-start;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-light);
        }
        .profile-photo {
            width: 85px; 
            height: 110px; 
            object-fit: cover;
            border-radius: var(--radius-md); 
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-float); 
            flex-shrink: 0;
            background: var(--bg-surface-elevated);
        }
        .profile-info { 
            flex: 1; 
            min-width: 0; 
        }
        .profile-name { 
            font-size: 1.25rem; 
            font-weight: 800; 
            color: #FFFFFF; 
            line-height: 1.2; 
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .profile-id { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.88rem; 
            color: var(--primary); 
            font-weight: 700; 
            display: block; 
            margin-bottom: 0.75rem; 
        }
        
        .badge-chips { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 0.4rem; 
        }
        .pill-chip { 
            padding: 0.3rem 0.65rem; 
            border-radius: var(--radius-full); 
            font-size: 0.7rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            display: inline-flex; 
            align-items: center; 
            gap: 0.35rem; 
            letter-spacing: 0.03em; 
            border: 1px solid transparent; 
        }
        .pill-team { background: var(--primary-light); color: #60A5FA; border-color: rgba(59, 130, 246, 0.3); }
        .pill-category { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); border-color: var(--border-light); }
        .pill-batch { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border-color: rgba(245, 158, 11, 0.3); }

        .comps-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding-right: 0.25rem; 
            margin-bottom: 1.25rem; 
            -webkit-overflow-scrolling: touch; 
        }
        .comps-scroll::-webkit-scrollbar { width: 4px; }
        .comps-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        .comps-heading { 
            font-size: 0.8rem; 
            font-weight: 800; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 0.75rem; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }

        /* Competition Cards in Bottom Sheet */
        .sheet-comp-card {
            background: var(--bg-surface-elevated); 
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md); 
            padding: 1rem; 
            margin-bottom: 0.75rem;
            display: flex; 
            flex-direction: column; 
            gap: 0.6rem;
            transition: var(--transition);
        }
        .sheet-comp-card.is-published {
            cursor: pointer;
            border-color: rgba(139, 92, 246, 0.45);
            background: linear-gradient(135deg, var(--bg-surface-elevated) 0%, rgba(139, 92, 246, 0.12) 100%);
            position: relative;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        border-color 0.2s ease, 
                        box-shadow 0.2s ease, 
                        background 0.2s ease;
        }
        .sheet-comp-card.is-published:hover {
            border-color: #8B5CF6;
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.98) 0%, rgba(139, 92, 246, 0.22) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.35);
        }
        .sheet-comp-card.is-published:active {
            transform: scale(0.98);
        }
        .sheet-comp-card.is-published:focus-visible {
            outline: 2px solid #8B5CF6;
            outline-offset: 2px;
        }
        .result-link-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.55rem;
            border-radius: var(--radius-full);
            background: rgba(139, 92, 246, 0.2);
            color: #DDD6FE;
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-size: 0.68rem;
            font-weight: 700;
            transition: var(--transition);
        }
        .sheet-comp-card.is-published:hover .result-link-pill {
            background: #8B5CF6;
            color: #FFFFFF;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        .sheet-comp-published-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.74rem;
            font-weight: 700;
            color: #A78BFA;
            margin-top: 0.2rem;
            padding-top: 0.5rem;
            border-top: 1px dashed rgba(139, 92, 246, 0.3);
        }
        .sheet-comp-published-action .view-link-text {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #DDD6FE;
            background: rgba(139, 92, 246, 0.25);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-size: 0.72rem;
            transition: var(--transition);
        }
        .sheet-comp-card.is-published:hover .sheet-comp-published-action .view-link-text {
            background: #8B5CF6;
            color: #FFFFFF;
            border-color: #8B5CF6;
            transform: translateX(2px);
        }
        .sheet-comp-header {
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 0.75rem;
        }
        .sheet-comp-name {
            font-size: 0.95rem; 
            font-weight: 800; 
            color: #FFFFFF; 
            text-transform: uppercase;
            line-height: 1.3;
        }
        
        /* Squad Roster in Scanner Sheet */
        .squad-member-list {
            margin-top: 0.4rem;
            padding: 0.5rem 0.65rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
        }
        .squad-member-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .squad-tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .squad-tag {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-full);
            color: var(--text-main);
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .squad-tag.leader {
            background: rgba(245, 158, 11, 0.15);
            color: #FCD34D;
            border-color: rgba(245, 158, 11, 0.3);
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.25rem 0.6rem;
            border-radius: var(--radius-full);
            white-space: nowrap;
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            border: 1px solid transparent;
        }
        .st-pending { background: rgba(255, 255, 255, 0.06); color: var(--text-muted); }
        .st-registration { background: var(--primary-light); color: #60A5FA; border-color: rgba(59, 130, 246, 0.3); }
        .st-ongoing { background: var(--success-light); color: #34D399; border-color: rgba(16, 185, 129, 0.3); }
        .st-valuation { background: var(--warning-light); color: #FBBF24; border-color: rgba(245, 158, 11, 0.3); }
        .st-published { background: rgba(139, 92, 246, 0.15); color: #A78BFA; border-color: rgba(139, 92, 246, 0.3); }

        /* Action Buttons */
        .btn-action {
            width: 100%; 
            min-height: 50px; 
            border-radius: var(--radius-md); 
            border: none;
            background: var(--primary-gradient); 
            color: white; 
            font-size: 0.92rem; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.6rem;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); 
            transition: var(--transition);
        }
        .btn-action:active { transform: scale(0.97); }

        /* Loading Overlay */
        #loader {
            position: absolute; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.82); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            z-index: 200; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white;
        }

        /* Toast Notifications */
        #toast {
            position: fixed; 
            top: calc(1rem + env(safe-area-inset-top)); 
            left: 50%; 
            transform: translateX(-50%) translateY(-150px);
            background: var(--bg-surface-elevated); 
            color: var(--text-main); 
            padding: 0.85rem 1.25rem; 
            border-radius: var(--radius-full); 
            font-weight: 700; 
            z-index: 300; 
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-float); 
            display: flex; 
            align-items: center; 
            gap: 0.75rem; 
            border: 1px solid var(--border-light);
            font-size: 0.85rem; 
            width: 90%; 
            max-width: 380px;
            text-transform: uppercase;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- HUD Header -->
    <header class="hud-header">
        <div class="hud-brand">
            <img id="head-logo" class="hud-logo" src="" alt="Logo" style="display: none;">
            <span id="head-title" class="hud-title">FestOS Scan</span>
        </div>
        <div class="hud-actions">
            <button class="hud-btn" id="btn-torch" onclick="toggleTorch()" title="Toggle Flashlight">
                <i class="fa-solid fa-bolt"></i>
            </button>
            <button class="hud-btn" id="btn-camera-flip" onclick="cycleCamera()" title="Switch Camera">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <button class="hud-btn" id="btn-gallery" onclick="triggerGalleryScan()" title="Scan QR from Gallery">
                <i class="fa-solid fa-image"></i>
            </button>
            <button class="hud-btn" id="btn-sound" onclick="toggleSound()" title="Toggle Scan Sound">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="hud-btn" id="btn-search-toggle" onclick="toggleManualSearch()" title="Manual Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>

    <!-- Hidden file input for gallery photo scan -->
    <input type="file" id="gallery-file-input" accept="image/*" style="display: none;" onchange="handleGalleryScan(event)">

    <!-- Manual Search Dropdown Drawer -->
    <div class="manual-search-drawer" id="manual-drawer">
        <div class="search-row">
            <input type="text" class="search-input" id="manual-search-input" placeholder="Type Chest # or Name..." onkeydown="if(event.key==='Enter') executeManualLookup()">
            <button class="hud-btn" onclick="executeManualLookup()" style="border-radius: var(--radius-md); background: var(--primary);">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button class="hud-btn" onclick="toggleManualSearch()" style="border-radius: var(--radius-md); background: transparent;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Camera Viewport -->
    <div id="reader-container">
        <!-- Hardware Zoom Controls (1x, 2x, 3x) -->
        <div class="zoom-controls" id="zoom-controls" style="display: none;">
            <button class="zoom-btn active" data-zoom="1" onclick="setZoom(1)">1x</button>
            <button class="zoom-btn" data-zoom="2" onclick="setZoom(2)">2x</button>
            <button class="zoom-btn" data-zoom="3" id="zoom-btn-3" onclick="setZoom(3)" style="display: none;">3x</button>
        </div>

        <!-- Tap to focus animation ring -->
        <div class="focus-ring" id="focus-ring"></div>

        <div class="scan-overlay" id="scan-overlay"></div>
        <div class="reticle-status" id="reticle-status">
            <i class="fa-solid fa-crosshairs" id="reticle-icon"></i> 
            <span id="reticle-text">Align QR in frame</span>
        </div>
        <div id="reader"></div>
    </div>

    <!-- Spinner Modal -->
    <div id="loader">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--primary);"></i>
        <p style="margin-top: 1.25rem; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.05em; text-transform: uppercase;">VERIFYING CREDENTIALS...</p>
    </div>
    
    <!-- Toast Popup -->
    <div id="toast">
        <i class="fa-solid fa-circle-exclamation" id="toast-icon" style="color: var(--danger); font-size: 1.15rem;"></i> 
        <span id="toast-msg">Error Message</span>
    </div>

    <!-- Profile Verification Bottom Sheet -->
    <div id="profile-sheet" class="bottom-sheet">
        <div class="sheet-handle" onclick="resumeScanning()"></div>
        
        <div class="profile-card">
            <img id="p-photo" class="profile-photo" src="" alt="Profile">
            <div class="profile-info">
                <h2 id="p-name" class="profile-name">Student Name</h2>
                <span id="p-id" class="profile-id">CHEST: ---</span>
                <div class="badge-chips">
                    <span id="p-team" class="pill-chip pill-team"><i class="fa-solid fa-users"></i> TEAM</span>
                    <span id="p-category" class="pill-chip pill-category"><i class="fa-solid fa-folder"></i> CATEGORY</span>
                    <span id="p-batch" class="pill-chip pill-batch"><i class="fa-solid fa-calendar"></i> DOB</span>
                </div>
            </div>
        </div>

        <div class="comps-scroll">
            <div class="comps-heading">
                <span><i class="fa-solid fa-trophy" style="color: var(--primary); margin-right: 4px;"></i> Enrolled Competitions</span>
                <span id="p-comp-count" style="font-size: 0.72rem; color: var(--primary);">0 Events</span>
            </div>
            <div id="p-comps">
                <!-- Dynamically populated event cards with squad rosters -->
            </div>
        </div>

        <button class="btn-action" onclick="resumeScanning()">
            <i class="fa-solid fa-qrcode"></i> SCAN NEXT CREDENTIAL
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabaseClient || (window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null);
        if (typeof window !== 'undefined') window.supabaseClient = supabaseClient;

        let html5QrCode = null;
        let isProcessing = false;
        let currentFacingMode = "environment";
        let isTorchOn = false;
        let isSoundEnabled = true;
        let videoTrack = null;
        let audioCtx = null;
        let availableCameras = [];
        let currentCameraIndex = 0;
        let currentZoom = 1;
        let maxZoom = 1;
        let minZoom = 1;
        let lastScannedPayload = null;
        let lastScannedTime = 0;

        // Pinch-to-zoom tracking
        let initialPinchDistance = null;
        let pinchStartZoom = 1;

        document.addEventListener("DOMContentLoaded", () => {
            fetchAndApplyBranding();
            setupTouchAndFocusGestures();
            initializeScannerEngine();
        });

        // ==========================================
        // AUDIO & HAPTIC FEEDBACK MULTI-SENSORY ENGINE
        // ==========================================
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const btn = document.getElementById('btn-sound');
            if (btn) {
                btn.innerHTML = isSoundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
                btn.classList.toggle('active', isSoundEnabled);
            }
            showToast(isSoundEnabled ? "Sound alerts enabled" : "Sound alerts muted", "info");
        }

        function playSuccessBeep() {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                // Futuristic crisp positive verification chime
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5 note
                osc.frequency.exponentialRampToValueAtTime(1975.53, now + 0.09); // B6 note

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.14);
            } catch (e) {
                console.warn("Audio feedback unsupported:", e);
            }
        }

        function triggerHapticFeedback() {
            try {
                // 1. Capacitor Native Haptics (if installed)
                if (window.Capacitor && window.Capacitor.isPluginAvailable && window.Capacitor.isPluginAvailable('Haptics')) {
                    const Haptics = window.Capacitor.Plugins.Haptics;
                    if (Haptics && Haptics.notification) {
                        Haptics.notification({ type: 'SUCCESS' }).catch(() => {});
                        return;
                    }
                }
                // 2. Web Vibration API Fallback
                if (navigator.vibrate) {
                    navigator.vibrate([40, 50, 40]);
                }
            } catch (e) {
                // Ignore silent vibration fails
            }
        }

        // ==========================================
        // HARDWARE SCANNER INITIALIZATION & CONTROLS
        // ==========================================
        async function initializeScannerEngine() {
            try {
                if (typeof Html5Qrcode === 'undefined') {
                    showToast("Scanner library loading...", "info");
                    return;
                }

                // Query and categorize device cameras
                try {
                    const devices = await Html5Qrcode.getCameras();
                    if (devices && devices.length > 0) {
                        availableCameras = devices;
                        // Select primary back camera if available
                        const backIndex = availableCameras.findIndex(d => 
                            (d.label || '').toLowerCase().includes('back') || 
                            (d.label || '').toLowerCase().includes('rear') ||
                            (d.label || '').toLowerCase().includes('environment')
                        );
                        if (backIndex !== -1) currentCameraIndex = backIndex;
                    }
                } catch (camErr) {
                    console.log("Camera enumeration notice:", camErr.message);
                }

                startCameraWithOptimalSettings();
            } catch (err) {
                console.error("Init engine failed:", err);
                showToast("Failed to initialize camera scanner.", "error");
            }
        }

        function createScannerInstance() {
            if (html5QrCode) {
                try { html5QrCode.clear(); } catch(e) {}
            }
            // Enable hardware-accelerated BarcodeDetector API for 60fps instant decoding
            html5QrCode = new Html5Qrcode("reader", {
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                },
                verbose: false
            });
        }

        async function startCameraWithOptimalSettings() {
            if (html5QrCode && html5QrCode.isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (e) {}
            }

            createScannerInstance();

            // Setup camera target: Prefer selected camera ID if available, else facingMode
            let cameraTarget = { facingMode: currentFacingMode };
            if (availableCameras.length > 0 && availableCameras[currentCameraIndex]) {
                cameraTarget = availableCameras[currentCameraIndex].id;
            }

            // High Definition resolution constraints for razor-sharp QR detection at distance
            const scanConfig = {
                fps: 28, // High sampling rate for instantaneous detection
                videoConstraints: {
                    facingMode: currentFacingMode,
                    width: { min: 640, ideal: 1920, max: 2560 },
                    height: { min: 480, ideal: 1080, max: 1440 }
                }
            };

            // Start hardware camera stream
            html5QrCode.start(
                cameraTarget,
                scanConfig,
                onScanSuccess,
                () => {} // Silent continuous frame scanner
            ).then(() => {
                captureVideoTrackAndApplyCapabilities();
            }).catch(err => {
                console.warn("HD camera start fallback triggered:", err.message);
                // Fallback to basic constraints if device rejects HD
                startBasicCameraFallback(cameraTarget);
            });
        }

        function startBasicCameraFallback(cameraTarget) {
            if (!html5QrCode) createScannerInstance();
            html5QrCode.start(
                cameraTarget,
                { fps: 20 },
                onScanSuccess,
                () => {}
            ).then(() => {
                captureVideoTrackAndApplyCapabilities();
            }).catch(e => {
                showToast("Camera access unavailable. Grant permission or use manual search.", "error");
            });
        }

        function captureVideoTrackAndApplyCapabilities() {
            const videoEl = document.querySelector("#reader video");
            if (videoEl && videoEl.srcObject) {
                const stream = videoEl.srcObject;
                const tracks = stream.getVideoTracks();
                if (tracks.length > 0) {
                    videoTrack = tracks[0];
                    applyCameraCapabilities();
                }
            }
        }

        async function applyCameraCapabilities() {
            if (!videoTrack) return;
            try {
                const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

                // 1. Continuous Auto-Focus (Eliminates blurry macro / close-up issues)
                if (caps.focusMode && Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
                    await videoTrack.applyConstraints({
                        advanced: [{ focusMode: 'continuous' }]
                    }).catch(() => {});
                }

                // 2. Auto-Exposure continuous
                if (caps.exposureMode && Array.isArray(caps.exposureMode) && caps.exposureMode.includes('continuous')) {
                    await videoTrack.applyConstraints({
                        advanced: [{ exposureMode: 'continuous' }]
                    }).catch(() => {});
                }

                // 3. Hardware Optical / Digital Zoom capability setup
                const zoomCtrl = document.getElementById('zoom-controls');
                if (caps.zoom) {
                    minZoom = caps.zoom.min || 1;
                    maxZoom = caps.zoom.max || 1;
                    currentZoom = minZoom;

                    if (maxZoom >= 1.8) {
                        zoomCtrl.style.display = 'flex';
                        const btn3 = document.getElementById('zoom-btn-3');
                        if (maxZoom >= 2.8) {
                            btn3.style.display = 'flex';
                        } else {
                            btn3.style.display = 'none';
                        }
                        updateZoomButtons(1);
                    } else {
                        zoomCtrl.style.display = 'none';
                    }
                } else {
                    zoomCtrl.style.display = 'none';
                }

                // 4. Torch availability reflection
                const torchBtn = document.getElementById('btn-torch');
                if (torchBtn) {
                    if (caps.torch) {
                        torchBtn.classList.remove('disabled');
                        torchBtn.style.display = 'flex';
                    } else if (currentFacingMode === "user") {
                        torchBtn.style.display = 'none';
                    }
                }

            } catch (err) {
                console.warn("Camera capabilities notice:", err.message);
            }
        }

        // ==========================================
        // HARDWARE ZOOM & TOUCH FOCUS HANDLERS
        // ==========================================
        async function setZoom(level) {
            if (!videoTrack) return;
            try {
                const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (!caps.zoom) return;

                const targetZoom = Math.min(Math.max(level, minZoom), maxZoom);
                await videoTrack.applyConstraints({
                    advanced: [{ zoom: targetZoom }]
                });
                currentZoom = targetZoom;
                updateZoomButtons(level);
            } catch (err) {
                console.warn("Zoom adjustment failed:", err);
            }
        }

        function updateZoomButtons(activeLevel) {
            document.querySelectorAll('.zoom-btn').forEach(btn => {
                const val = parseFloat(btn.getAttribute('data-zoom'));
                btn.classList.toggle('active', Math.abs(val - activeLevel) < 0.3);
            });
        }

        function setupTouchAndFocusGestures() {
            const container = document.getElementById('reader-container');
            const ring = document.getElementById('focus-ring');

            // Tap to focus
            container.addEventListener('click', async (e) => {
                // Ignore if clicked on zoom controls or buttons
                if (e.target.closest('.zoom-controls, .hud-btn, .reticle-status')) return;

                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                ring.style.left = `${x}px`;
                ring.style.top = `${y}px`;
                ring.classList.add('active');

                // Trigger camera focus constraint if supported
                if (videoTrack) {
                    try {
                        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                        if (caps.focusMode && Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
                            await videoTrack.applyConstraints({
                                advanced: [{ focusMode: 'continuous' }]
                            }).catch(() => {});
                        }
                    } catch (e) {}
                }

                setTimeout(() => ring.classList.remove('active'), 650);
            });

            // Touch Pinch-to-zoom
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2 && maxZoom > 1) {
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    pinchStartZoom = currentZoom;
                }
            }, { passive: true });

            container.addEventListener('touchmove', async (e) => {
                if (e.touches.length === 2 && initialPinchDistance && maxZoom > 1) {
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const scaleFactor = currentDist / initialPinchDistance;
                    const computedZoom = Math.min(Math.max(pinchStartZoom * scaleFactor, minZoom), maxZoom);
                    if (Math.abs(computedZoom - currentZoom) > 0.15) {
                        setZoom(computedZoom);
                    }
                }
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            }, { passive: true });
        }

        // ==========================================
        // CAMERA SWITCH & TORCH CONTROLS
        // ==========================================
        async function cycleCamera() {
            if (availableCameras.length > 1) {
                currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
                const nextCam = availableCameras[currentCameraIndex];
                const isBack = (nextCam.label || '').toLowerCase().includes('back') || (nextCam.label || '').toLowerCase().includes('rear');
                currentFacingMode = isBack ? "environment" : "user";
                showToast(`Switched Camera: ${nextCam.label || 'Camera ' + (currentCameraIndex + 1)}`, "info");
                startCameraWithOptimalSettings();
            } else {
                currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
                showToast(`Switched to ${currentFacingMode === "environment" ? "Back" : "Front"} Camera`, "info");
                startCameraWithOptimalSettings();
            }
        }

        async function toggleTorch() {
            if (!videoTrack) captureVideoTrackAndApplyCapabilities();
            if (!videoTrack) return showToast("Torch unavailable on device.", "error");

            try {
                const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                if (!capabilities.torch) {
                    return showToast("Flashlight not supported on this camera.", "error");
                }

                isTorchOn = !isTorchOn;
                await videoTrack.applyConstraints({
                    advanced: [{ torch: isTorchOn }]
                });

                const btn = document.getElementById('btn-torch');
                if (btn) {
                    btn.classList.toggle('active', isTorchOn);
                }

            } catch (err) {
                showToast("Torch toggle error: " + err.message, "error");
            }
        }

        // ==========================================
        // SCAN FROM GALLERY IMAGE FILE
        // ==========================================
        function triggerGalleryScan() {
            document.getElementById('gallery-file-input').click();
        }

        async function handleGalleryScan(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            document.getElementById('loader').style.display = 'flex';
            try {
                if (!html5QrCode) createScannerInstance();
                const decodedText = await html5QrCode.scanFile(file, true);
                if (decodedText) {
                    await onScanSuccess(decodedText);
                } else {
                    throw new Error("No readable QR code found.");
                }
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                showToast("No QR code detected in image.", "error");
            } finally {
                e.target.value = '';
            }
        }

        // ==========================================
        // MANUAL SEARCH DRAWER
        // ==========================================
        function toggleManualSearch() {
            const drawer = document.getElementById('manual-drawer');
            drawer.classList.toggle('open');
            if (drawer.classList.contains('open')) {
                document.getElementById('manual-search-input').focus();
            }
        }

        async function executeManualLookup() {
            const val = document.getElementById('manual-search-input').value.trim();
            if (!val) return;
            toggleManualSearch();
            await lookupParticipant(val);
        }

        // ==========================================
        // SMART QR PAYLOAD NORMALIZER
        // ==========================================
        function normalizeScannedPayload(rawText) {
            if (!rawText) return '';
            let text = rawText.trim();

            // 1. Extract from URL query parameters (e.g. https://domain.com/scan.html?id=104829&fest=zenith)
            if (text.startsWith('http://') || text.startsWith('https://') || text.includes('?')) {
                try {
                    const parsedUrl = new URL(text.startsWith('http') ? text : 'https://festos.local/' + text);
                    if (parsedUrl.searchParams.has('id')) return parsedUrl.searchParams.get('id').trim();
                    if (parsedUrl.searchParams.has('uid')) return parsedUrl.searchParams.get('uid').trim();
                    if (parsedUrl.searchParams.has('chest')) return parsedUrl.searchParams.get('chest').trim();
                    if (parsedUrl.searchParams.has('unique_id')) return parsedUrl.searchParams.get('unique_id').trim();

                    // Check path segment (e.g. /participant/104829)
                    const segments = parsedUrl.pathname.split('/').filter(Boolean);
                    if (segments.length > 0) {
                        const last = segments[segments.length - 1];
                        if (/^[a-zA-Z0-9_-]+$/.test(last)) return last.trim();
                    }
                } catch(e) {}
            }

            // 2. Parse JSON payloads (e.g. {"unique_id":"104829"})
            if (text.startsWith('{') && text.endsWith('}')) {
                try {
                    const obj = JSON.parse(text);
                    const found = obj.unique_id || obj.id || obj.chest || obj.chest_no || obj.code;
                    if (found) return String(found).trim();
                } catch(e) {}
            }

            // 3. Strip common chest / ID prefixes (e.g. "CHEST: 104829", "ID #104829")
            text = text.replace(/^(chest|id|uid|reg|no)\s*([#:=_\-])\s*/i, '').trim();

            return text;
        }

        // ==========================================
        // SCAN HANDLER & DATA POPULATION
        // ==========================================
        async function onScanSuccess(decodedText) {
            const now = Date.now();
            const cleanId = normalizeScannedPayload(decodedText);

            // Debounce identical scans within 1.8 seconds to avoid rapid duplicate triggers
            if (cleanId === lastScannedPayload && (now - lastScannedTime) < 1800) {
                return;
            }

            if (isProcessing) return;
            isProcessing = true;
            lastScannedPayload = cleanId;
            lastScannedTime = now;

            // Trigger Instant Multi-Sensory Feedback
            playSuccessBeep();
            triggerHapticFeedback();

            // Visual target lock feedback
            const overlay = document.getElementById('scan-overlay');
            const statusBox = document.getElementById('reticle-status');
            const statusText = document.getElementById('reticle-text');
            const statusIcon = document.getElementById('reticle-icon');

            if (overlay) overlay.classList.add('success');
            if (statusBox) statusBox.classList.add('locked');
            if (statusIcon) statusIcon.className = "fa-solid fa-circle-check";
            if (statusText) statusText.innerText = "Target Locked! Verifying...";

            // Pause video frame processing
            try {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.pause(true);
                }
            } catch (e) {}

            await lookupParticipant(cleanId);
        }

        async function lookupParticipant(searchIdentifier) {
            document.getElementById('loader').style.display = 'flex';

            try {
                if (window.festosHostFestReady) { try { await window.festosHostFestReady; } catch (e) {} }

                // 1. Fetch Participant Details
                let partQuery = supabaseClient
                    .from('participants')
                    .select(`
                        *, 
                        teams(id, name), 
                        categories(name),
                        participant_competitions(
                            is_leader,
                            competitions(
                                id, 
                                name, 
                                status,
                                is_group,
                                categories(name),
                                stages(name)
                            )
                        )
                    `)
                    .or(`unique_id.eq.${searchIdentifier},name.ilike.%${searchIdentifier}%`);
                
                if (window.festosApplyFilter) partQuery = window.festosApplyFilter(partQuery);
                const { data: pData, error } = await partQuery.limit(1).maybeSingle();

                if (error || !pData) throw new Error("Participant record not found.");

                // 2. For each enrolled Group event, fetch all teammates
                const groupCompIds = (pData.participant_competitions || [])
                    .filter(pc => pc.competitions && pc.competitions.is_group)
                    .map(pc => pc.competitions.id);

                let squadMembersMap = {};
                if (groupCompIds.length > 0 && pData.team_id) {
                    let squadQuery = supabaseClient
                        .from('participant_competitions')
                        .select('competition_id, is_leader, participants(name, unique_id, team_id)')
                        .in('competition_id', groupCompIds);
                    if (window.festosApplyFilter) squadQuery = window.festosApplyFilter(squadQuery);
                    const { data: squadData } = await squadQuery;

                    if (squadData) {
                        squadData.forEach(row => {
                            if (row.participants && row.participants.team_id === pData.team_id) {
                                if (!squadMembersMap[row.competition_id]) squadMembersMap[row.competition_id] = [];
                                squadMembersMap[row.competition_id].push({
                                    name: row.participants.name,
                                    unique_id: row.participants.unique_id,
                                    is_leader: row.is_leader
                                });
                            }
                        });
                    }
                }

                populateSheet(pData, squadMembersMap);

                document.getElementById('loader').style.display = 'none';
                document.getElementById('profile-sheet').classList.add('open');

            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                showToast(err.message, "error");

                resetReticleState();
                setTimeout(() => {
                    isProcessing = false;
                    try {
                        if (html5QrCode) html5QrCode.resume();
                    } catch(e) {}
                }, 1500);
            }
        }

        function populateSheet(p, squadMembersMap) {
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-id').innerText = `CHEST #${p.unique_id}`;
            document.getElementById('p-team').innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${p.teams?.name || 'INDEPENDENT'}`;
            document.getElementById('p-category').innerHTML = `<i class="fa-solid fa-layer-group"></i> ${p.categories?.name || 'GENERAL'}`;
            document.getElementById('p-batch').innerHTML = `<i class="fa-solid fa-calendar"></i> ${p.dob || 'DOB N/A'}`;

            // Participant Photo
            const fallbackAvatar = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="150" height="200"%3E%3Crect width="100%25" height="100%25" fill="%231F2937"/%3E%3Ctext x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="%239CA3AF"%3ENO PHOTO%3C/text%3E%3C/svg%3E`;
            document.getElementById('p-photo').src = p.photo_url || fallbackAvatar;

            const enrollments = p.participant_competitions || [];
            document.getElementById('p-comp-count').innerText = `${enrollments.length} Assigned`;

            const compContainer = document.getElementById('p-comps');

            if (enrollments.length > 0) {
                compContainer.innerHTML = enrollments.map(pc => {
                    const comp = pc.competitions;
                    if (!comp) return '';

                    let stClass = 'st-pending';
                    let stIcon = '<i class="fa-solid fa-clock"></i>';
                    let stText = 'UPCOMING';

                    const isPublished = comp.status === 'published';
                    if (comp.status === 'registration') { stClass = 'st-registration'; stIcon = '<i class="fa-solid fa-bullhorn"></i>'; stText = 'CALLING'; }
                    else if (comp.status === 'ongoing') { stClass = 'st-ongoing'; stIcon = '<i class="fa-solid fa-bolt"></i>'; stText = 'LIVE ON STAGE'; }
                    else if (comp.status === 'valuation') { stClass = 'st-valuation'; stIcon = '<i class="fa-solid fa-gavel"></i>'; stText = 'VALUATION'; }
                    else if (isPublished) { stClass = 'st-published'; stIcon = '<i class="fa-solid fa-circle-check"></i>'; stText = 'DECLARED'; }

                    const catName = comp.categories?.name || 'General';
                    const stageName = comp.stages?.name || 'Unassigned Stage';

                    // Group Roster HTML
                    let squadHtml = '';
                    if (comp.is_group) {
                        const teammates = squadMembersMap[comp.id] || [];
                        if (teammates.length > 0) {
                            squadHtml = `
                                <div class="squad-member-list">
                                    <div class="squad-member-title"><i class="fa-solid fa-users"></i> Team Squad (${teammates.length} Members)</div>
                                    <div class="squad-tags-row">
                                        ${teammates.map(m => `
                                            <span class="squad-tag ${m.is_leader ? 'leader' : ''}">
                                                ${m.is_leader ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-solid fa-user"></i>'} ${m.name}
                                            </span>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        }
                    }

                    const safeCompName = (comp.name || '').replace(/"/g, '&quot;');

                    return `
                        <div class="sheet-comp-card ${isPublished ? 'is-published' : ''}"
                             ${isPublished ? `onclick="navigateToResult('${comp.id}')" role="button" tabindex="0" title="Click to view published result for ${safeCompName}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateToResult('${comp.id}');}"` : ''}>
                            <div class="sheet-comp-header">
                                <div>
                                    <strong class="sheet-comp-name">${comp.name}</strong>
                                    ${pc.is_leader ? '<span style="color: #FBBF24; font-size: 0.68rem; font-weight: 800; display: block; margin-top: 2px;"><i class="fa-solid fa-star"></i> SQUAD LEADER</span>' : ''}
                                </div>
                                <div style="display: flex; align-items: center; gap: 0.4rem;">
                                    <span class="status-badge ${stClass}">${stIcon} ${stText}</span>
                                    ${isPublished ? `<span class="result-link-pill" title="View Result"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>` : ''}
                                </div>
                            </div>

                            <div style="display: flex; gap: 0.75rem; font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">
                                <span><i class="fa-solid fa-folder"></i> ${catName}</span>
                                <span><i class="fa-solid fa-microphone-lines"></i> ${stageName}</span>
                            </div>

                            ${squadHtml}

                            ${isPublished ? `
                                <div class="sheet-comp-published-action">
                                    <span><i class="fa-solid fa-trophy" style="margin-right: 4px;"></i> Results Declared</span>
                                    <span class="view-link-text">View Result <i class="fa-solid fa-chevron-right" style="font-size: 0.65rem;"></i></span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            } else {
                compContainer.innerHTML = `
                    <div style="text-align: center; padding: 2rem 1rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md); border: 1px dashed var(--border-light); color: var(--text-muted);">
                        <i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 0.5rem; display: block; color: var(--text-dim);"></i>
                        <p style="font-size: 0.85rem; font-weight: 600;">No events assigned to this participant.</p>
                    </div>
                `;
            }
        }

        function resetReticleState() {
            const overlay = document.getElementById('scan-overlay');
            const statusBox = document.getElementById('reticle-status');
            const statusText = document.getElementById('reticle-text');
            const statusIcon = document.getElementById('reticle-icon');

            if (overlay) overlay.classList.remove('success');
            if (statusBox) statusBox.classList.remove('locked');
            if (statusIcon) statusIcon.className = "fa-solid fa-crosshairs";
            if (statusText) statusText.innerText = "Align QR in frame";
        }

        function navigateToResult(compId) {
            if (!compId) return;
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const fest = urlParams.get('fest') || urlParams.get('fest_id') || urlParams.get('slug') || 
                             (window.festosAuth && typeof window.festosAuth.getCurrentFestId === 'function' ? window.festosAuth.getCurrentFestId() : null) || 
                             window.activeFestId || 
                             localStorage.getItem('festos_last_fest_id') || 
                             localStorage.getItem('festos_active_fest_id') || '';

                const targetParams = new URLSearchParams();
                if (fest) targetParams.set('fest', fest);
                targetParams.set('tab', 'results');
                targetParams.set('subtab', 'individual');
                targetParams.set('comp', compId);

                window.location.href = `results.html?${targetParams.toString()}`;
            } catch (err) {
                console.error("Navigation error:", err);
                window.location.href = `results.html?tab=results&subtab=individual&comp=${encodeURIComponent(compId)}`;
            }
        }
        window.navigateToResult = navigateToResult;

        function resumeScanning() {
            document.getElementById('profile-sheet').classList.remove('open');
            resetReticleState();
            setTimeout(() => {
                isProcessing = false;
                try {
                    if (html5QrCode) html5QrCode.resume();
                } catch(e) {}
            }, 350);
        }

        function showToast(msg, type = "error") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            
            if (type === "error") {
                icon.className = "fa-solid fa-circle-exclamation";
                icon.style.color = "var(--danger)";
            } else if (type === "info") {
                icon.className = "fa-solid fa-circle-info";
                icon.style.color = "var(--primary)";
            } else {
                icon.className = "fa-solid fa-circle-check";
                icon.style.color = "var(--success)";
            }
            
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ==========================================
        // UNIFIED BRANDING & FAVICON ENGINE
        // ==========================================
        async function fetchAndApplyBranding() {
            try {
                const festId = window.festosAuth ? window.festosAuth.getCurrentFestId() : null;
                let val = window.festosGetSetting ? await window.festosGetSetting('system_branding', festId) : null;
                if (!val && festId && typeof supabaseClient !== 'undefined') {
                    const { data: fData } = await supabaseClient.from('fests').select('name, logo').eq('id', festId).maybeSingle();
                    if (fData && (fData.name || fData.logo)) {
                        val = { fest_name: fData.name, fest_logo: fData.logo, display_mode: fData.logo ? 'both' : 'name' };
                    }
                }
                if (val) applyGlobalBranding(val);
            } catch (e) {
                console.warn("Branding error:", e.message);
            }
        }

        function applyGlobalBranding(brandingData) {
            if (!brandingData) return;
            const validName = brandingData.fest_name && brandingData.fest_name.trim() !== '';
            const rawLogo = brandingData.fest_logo && brandingData.fest_logo.trim() !== '' ? brandingData.fest_logo.trim() : '';
            const validLogo = rawLogo !== '' && rawLogo !== 'festos-logo.svg' && rawLogo !== '/festos-logo.svg';
            const displayMode = brandingData.display_mode || 'both';

            const festName = validName ? brandingData.fest_name : 'Festival';
            document.title = `${festName} | Scanner Pro`;

            if (validLogo) {
                let iconLinks = document.querySelectorAll("link[rel~='icon']");
                if (iconLinks.length === 0) {
                    let newIcon = document.createElement('link');
                    newIcon.rel = 'icon';
                    document.head.appendChild(newIcon);
                    iconLinks = [newIcon];
                }
                iconLinks.forEach(link => link.href = brandingData.fest_logo);
            }

            const showLogo = validLogo && (displayMode === 'both' || displayMode === 'logo');
            const showName = (displayMode === 'both' || displayMode === 'name') || (!validLogo && displayMode === 'logo');

            const logoEl = document.getElementById('head-logo');
            const titleEl = document.getElementById('head-title');

            if (logoEl) {
                if (showLogo) {
                    logoEl.src = brandingData.fest_logo;
                    logoEl.style.display = 'block';
                } else {
                    logoEl.style.display = 'none';
                }
            }
            if (titleEl) {
                titleEl.innerText = showName ? (validName ? brandingData.fest_name : 'FestOS Scan') : '';
                titleEl.style.display = showName ? 'block' : 'none';
            }
        }
    </script>
    <script src="mobile-native.js"></script>
</body>
</html>
