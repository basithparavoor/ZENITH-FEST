<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FestOS | Mobile Spectator</title>
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --bg-main: #0F172A;
            --bg-surface: #1E293B;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #334155;
            --gold: #FBBF24; --silver: #CBD5E1; --bronze: #D97706;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; text-transform: uppercase; }
        body { background: var(--bg-main); color: var(--text-main); padding-top: 80px; padding-bottom: 40px; }

        /* Unified Header */
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 0.75rem; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .header img { height: 35px; max-width: 120px; object-fit: contain; border-radius: 4px; display: none; }
        .header h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; margin: 0; }

        .container { padding: 1.25rem; max-width: 600px; margin: 0 auto; }
        
        /* Typography */
        .page-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.6rem; font-weight: 800; color: white; margin-bottom: 0.25rem; line-height: 1.2; text-align: center; }
        .page-subtitle { color: var(--primary); font-size: 0.9rem; font-weight: 700; text-align: center; margin-bottom: 2rem; letter-spacing: 1px; }

        /* Cards */
        .card { background: var(--bg-surface); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        .badge { padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; }
        .badge-live { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid #10B981; }
        .badge-val { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border: 1px solid #F59E0B; }
        .badge-call { background: rgba(59, 130, 246, 0.15); color: #3B82F6; border: 1px solid #3B82F6; }

        /* Leaderboard Rows */
        .lb-row { display: flex; align-items: center; padding: 1.25rem 0; border-bottom: 1px dashed var(--border); }
        .lb-row:last-child { border-bottom: none; }
        .lb-rank { font-size: 1.8rem; font-weight: 800; width: 45px; color: var(--text-muted); }
        .lb-details { flex: 1; }
        .lb-name { font-size: 1.1rem; font-weight: 800; color: white; display: block; margin-bottom: 0.2rem; }
        .lb-team { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; }
        .lb-pts { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-align: right; }
        
        .rank-1 { color: var(--gold); text-shadow: 0 0 15px rgba(251, 191, 36, 0.4); } 
        .rank-2 { color: var(--silver); } 
        .rank-3 { color: var(--bronze); }

        /* Buttons */
        .btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 1rem; border-radius: 12px; font-size: 1rem; font-weight: 800; border: none; cursor: pointer; margin-top: 1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: white; }

        .loader { text-align: center; padding: 4rem 0; color: var(--text-muted); }
        .loader i { font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="header">
        <img id="head-logo" src="" alt="Logo">
        <h1 id="head-title">FESTOS LIVE</h1>
    </div>

    <div class="container" id="main-content">
        <div class="loader">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p style="font-weight: 600; margin-top: 10px;">Syncing Secure Data...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://amdpvvwgttzzwaxnufcs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_XkHBI5AuYWo4klAdKWI1ag_mp4psVSA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let systemSettings = { thresholds: { aplus: 90, a: 70, b: 60, c: 50 }, points_solo: { aplus: 8, a: 7, b: 5, c: 3 }, points_small: { aplus: 12, a: 10, b: 7, c: 5 }, points_large: { aplus: 15, a: 12, b: 10, c: 7 }, pos_points: { p1: 3, p2: 2, p3: 1 } };
        let allTeams = [];
        
        // Contextual Engine
        const urlParams = new URLSearchParams(window.location.search);
        let viewContext = urlParams.get('view') || 'live';
        let targetCompId = urlParams.get('comp') || null;

        async function init() {
            try {
                // 1. Fetch Global Branding
                const { data: brand } = await supabaseClient.from('settings').select('value').eq('id', 'system_branding').maybeSingle();
                if(brand && brand.value) {
                    if(brand.value.fest_name) document.getElementById('head-title').innerText = brand.value.fest_name.toUpperCase();
                    if(brand.value.fest_logo) {
                        document.getElementById('head-logo').src = brand.value.fest_logo;
                        document.getElementById('head-logo').style.display = 'block';
                    }
                }

                // 2. Fetch Display Settings (Colors/Fonts)
                const { data: display } = await supabaseClient.from('settings').select('value').eq('id', 'display_settings').maybeSingle();
                if (display && display.value) {
                    if (display.value.primary_color) document.documentElement.style.setProperty('--primary', display.value.primary_color);
                    if (display.value.font_family) {
                        const fontString = `"${display.value.font_family}", sans-serif`;
                        document.body.style.fontFamily = fontString;
                        document.getElementById('head-title').style.fontFamily = fontString;
                    }
                }

                // 3. Fetch Matrix
                const { data: set_data } = await supabaseClient.from('settings').select('value').eq('id', 'point_system').maybeSingle();        
                if (set_data && set_data.value) systemSettings = set_data.value;

                // 4. Fetch Teams
                const { data: teams } = await supabaseClient.from('teams').select('*');
                allTeams = teams || [];

                // 5. Route to correct contextual view
                if (viewContext === 'results' && targetCompId) await renderSingleResult();
                else if (viewContext === 'standings') await renderStandings();
                else await renderLiveSchedule();

            } catch (err) {
                document.getElementById('main-content').innerHTML = `<p style="color:red; text-align:center;">Connection Error.</p>`;
            }
        }

        async function renderSingleResult() {
            const content = document.getElementById('main-content');
            
            const { data: comp } = await supabaseClient.from('competitions').select('*, categories(name)').eq('id', targetCompId).single();
            if (!comp || comp.status !== 'published') {
                content.innerHTML = `<h2 class="page-title">Results Not Ready</h2><p style="text-align:center; color: var(--text-muted);">Results for this event are not published yet.</p>`;
                return;
            }

            const { data: judgements } = await supabaseClient.from('judgements')
                .select('awarded_mark, participants(id, name, team_id, unique_id)')
                .eq('competition_id', targetCompId)
                .not('awarded_mark', 'is', null);

            const results = calculateSingleComp(comp, judgements || []);
            
            content.innerHTML = `
                <div id="pdf-container">
                    <h2 class="page-title">${comp.name}</h2>
                    <p class="page-subtitle">${comp.categories?.name || 'GEN'} • OFFICIAL RESULTS</p>
                    <div class="card" style="padding: 0 1.25rem;">
                        ${results.map(r => `
                            <div class="lb-row">
                                <div class="lb-rank rank-${r.pos}">#${r.pos}</div>
                                <div class="lb-details">
                                    <span class="lb-name">${r.name}</span>
                                    <span class="lb-team">${r.team}</span>
                                </div>
                                <div class="lb-pts">${r.pts} <span style="font-size:0.6rem; color:var(--text-muted);">PTS</span></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <button class="btn btn-primary" onclick="downloadPDF('${comp.name}')">
                    <i class="fa-solid fa-download"></i> Save Results PDF
                </button>
                <button class="btn btn-outline" onclick="window.location.href='spectator.html'">
                    <i class="fa-solid fa-home"></i> View Live Schedule
                </button>
            `;
        }

        async function renderStandings() {
            const content = document.getElementById('main-content');
            const { data: publishedComps } = await supabaseClient.from('competitions').select('*, participant_competitions(count)').eq('status', 'published');
            
            if (!publishedComps || publishedComps.length === 0) {
                content.innerHTML = '<h2 class="page-title">CHAMPIONSHIP STANDINGS</h2><p style="text-align:center; color: var(--text-muted); margin-top:2rem;">No points awarded yet.</p>';
                return;
            }

            const compIds = publishedComps.map(c => c.id);
            const { data: judgements } = await supabaseClient.from('judgements')
                .select('competition_id, awarded_mark, participants(id, name, team_id, unique_id)')
                .in('competition_id', compIds)
                .not('awarded_mark', 'is', null);

            let teamScores = {};
            allTeams.forEach(t => teamScores[t.id] = { name: t.name, score: 0 });

            publishedComps.forEach(comp => {
                const compJudgements = (judgements || []).filter(j => j.competition_id === comp.id);
                const results = calculateSingleComp(comp, compJudgements);
                results.forEach(r => {
                    if (r.teamId && teamScores[r.teamId]) teamScores[r.teamId].score += r.pts;
                });
            });

            const sortedTeams = Object.values(teamScores).sort((a,b) => b.score - a.score);

            content.innerHTML = `
                <div id="pdf-container">
                    <h2 class="page-title">OVERALL STANDINGS</h2>
                    <p class="page-subtitle">LIVE TEAM LEADERBOARD</p>
                    <div class="card" style="padding: 0 1.25rem;">
                        ${sortedTeams.map((t, i) => {
                            const rank = i + 1;
                            return `
                            <div class="lb-row">
                                <div class="lb-rank rank-${rank}">#${rank}</div>
                                <div class="lb-details"><span class="lb-name">${t.name}</span></div>
                                <div class="lb-pts">${t.score} <span style="font-size:0.6rem; color:var(--text-muted);">PTS</span></div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                <button class="btn btn-primary" onclick="downloadPDF('Overall_Standings')">
                    <i class="fa-solid fa-download"></i> Save Standings PDF
                </button>
            `;
        }

        async function renderLiveSchedule() {
            const content = document.getElementById('main-content');
            const { data: comps } = await supabaseClient.from('competitions')
                .select('*, categories(name), stages(name)')
                .in('status', ['ongoing', 'valuation', 'registration'])
                .order('status');
                
            content.innerHTML = `
                <h2 class="page-title">EVENT SCHEDULE</h2>
                <p class="page-subtitle">HAPPENING NOW</p>
            `;
            
            if (!comps || comps.length === 0) {
                content.innerHTML += `<div class="card"><p style="color: var(--text-muted); text-align: center; font-weight:600;">No active events right now.</p></div>`;
                return;
            }

            comps.forEach(c => {
                let badge = '';
                if(c.status === 'ongoing') badge = '<span class="badge badge-live">LIVE ON STAGE</span>';
                if(c.status === 'valuation') badge = '<span class="badge badge-val">IN VALUATION</span>';
                if(c.status === 'registration') badge = '<span class="badge badge-call">CALLING NOW</span>';

                content.innerHTML += `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                            <span style="font-size: 0.8rem; font-weight: 800; color: var(--primary);">${c.categories?.name || 'GEN'}</span>
                            ${badge}
                        </div>
                        <h3 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; line-height: 1.2;">${c.name}</h3>
                        <div style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;"><i class="fa-solid fa-microphone-stage"></i> ${c.stages?.name || 'GLOBAL'}</div>
                    </div>
                `;
            });
            
            content.innerHTML += `
                <button class="btn btn-outline" onclick="window.location.href='spectator.html?view=standings'">
                    <i class="fa-solid fa-trophy"></i> View Overall Standings
                </button>
            `;
        }

        // Shared Calculation Engine
        function calculateSingleComp(comp, judgements) {
            const pMap = {};
            judgements.forEach(j => {
                if(!j.participants) return;
                const pId = j.participants.id;
                if(!pMap[pId]) pMap[pId] = { p: j.participants, marks: [] };
                pMap[pId].marks.push(parseFloat(j.awarded_mark));
            });

            const limit = comp.max_participants || 1;
            const sizeCat = limit >= 4 ? 'large' : (limit >= 2 ? 'small' : 'solo');
            const registeredCount = comp.participant_competitions?.[0]?.count || 0;
            const eligibleForPosPts = registeredCount >= 3;

            const arr = Object.values(pMap).map(data => {
                let sorted = data.marks.sort((a,b) => a-b);
                if(sorted.length >= 3) sorted = sorted.slice(1, sorted.length-1);
                const avg = sorted.reduce((a,b) => a+b, 0) / sorted.length;
                
                let name = data.p.name;
                // Add Group Party logic
                if(comp.is_group && !name.endsWith('& PARTY')) name += " & PARTY";

                return { avg, name, teamId: data.p.team_id, team: allTeams.find(t=>t.id===data.p.team_id)?.name || 'IND' };
            }).sort((a,b) => b.avg - a.avg);

            let rank = 1, prev = -1;
            return arr.map((entry, idx) => {
                if(entry.avg !== prev) rank = idx + 1;
                prev = entry.avg;

                let pct = (entry.avg / (comp.max_mark || 100)) * 100;
                let pts = 0;

                if (pct >= 50) {
                    if (pct >= systemSettings.thresholds.aplus) pts += systemSettings[`points_${sizeCat}`].aplus;
                    else if (pct >= systemSettings.thresholds.a) pts += systemSettings[`points_${sizeCat}`].a;
                    else if (pct >= systemSettings.thresholds.b) pts += systemSettings[`points_${sizeCat}`].b;
                    else pts += systemSettings[`points_${sizeCat}`].c;
                }
                if (eligibleForPosPts && rank <= 3) {
                    if (rank === 1) pts += systemSettings.pos_points.p1;
                    else if (rank === 2) pts += systemSettings.pos_points.p2;
                    else if (rank === 3) pts += systemSettings.pos_points.p3;
                }

                return { ...entry, pos: rank, pts };
            });
        }

        // Generate PDF using html2pdf
        function downloadPDF(filename) {
            const element = document.getElementById('pdf-container');
            const opt = {
                margin: 0.5,
                filename: `FestOS_${filename.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#0F172A' },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            
            // Visual feedback
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
            });
        }

        init();
    </script>
</body>
</html>
